<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f7a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AgriCare · Farmer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js"
  }
}
</script>

<style>
:root{
  --p:#0f7a34; --p-h:#0b5f28; --p-d:#084d20;
  --p-l:#e6f5eb; --p-ll:#f1faf4;
  --p-glow:rgba(15,122,52,.28);
  --acc:#16a34a; --acc-soft:#86efac;
  --plant:#0f7a34; --plant-l:#e6f5eb;
  --manage:#2563eb; --manage-l:#dbeafe;
  --harvest:#ea580c; --harvest-l:#ffedd5;
  --market:#7c3aed; --market-l:#ede9fe;
  --delivery:#0891b2; --delivery-l:#cffafe;
  --td:#0f172a; --tb:#334155; --tl:#64748b; --tm:#94a3b8;
  --bd:#e2e8f0; --bd-s:#cbd5e1;
  --sf:#ffffff; --sf2:#f8fafc; --bg:#f4f7f5;
  --danger:#dc2626; --warn:#b45309; --ok:#16a34a; --info:#2563eb;
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px; --r-p:999px;
  --e:cubic-bezier(.22,1,.36,1);
  --sh-xs:0 1px 2px rgba(15,23,42,.05);
  --sh-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh:0 4px 12px rgba(15,23,42,.07),0 2px 4px rgba(15,23,42,.04);
  --sh-lg:0 12px 28px rgba(15,23,42,.09),0 4px 10px rgba(15,23,42,.05);
  --sh-brand:0 10px 30px -8px var(--p-glow);
  --ring:0 0 0 4px rgba(15,122,52,.14);
  --nav-h:68px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--tb);height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

#app{position:fixed;inset:0;overflow:hidden;display:flex;justify-content:center}
.screen-wrap{
  width:100%;max-width:720px;height:100%;position:relative;
  display:flex;flex-direction:column;background:var(--sf);
  box-shadow:0 0 60px rgba(15,23,42,.06);
}
@media(min-width:721px){
  body{background:linear-gradient(135deg,#eef7f0 0%,#e0f2e6 50%,#d5ecdc 100%)}
  .screen-wrap{margin:0 auto;height:100dvh;border-radius:0}
}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--sf);opacity:0;transform:translateY(14px);
  transition:opacity .35s var(--e),transform .4s var(--e);
  pointer-events:none;will-change:opacity,transform;
}
.screen.active{opacity:1;transform:translateY(0);pointer-events:auto;z-index:5}
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px);
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}

#splash{
  background:#000;z-index:100;
  display:flex;align-items:center;justify-content:center;
  opacity:1;transform:none;pointer-events:auto;
}
#splash img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease-in-out}
#splash.show img{opacity:1}
#splash .brand-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:space-between;padding:calc(var(--safe-t) + 40px) 24px calc(var(--safe-b) + 40px);
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 40%,transparent 60%,rgba(0,0,0,.55) 100%);
  pointer-events:none;opacity:0;transition:opacity 1s ease-in-out;
}
#splash.show .brand-overlay{opacity:1}
#splash .brand-top{text-align:center;color:#fff}
#splash .brand-top .leaf{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;font-size:34px;
  margin:0 auto 12px;box-shadow:0 12px 30px rgba(0,0,0,.3);
}
#splash .brand-top h1{font-size:34px;font-weight:900;letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#splash .brand-top p{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.95;margin-top:6px}
#splash .brand-bottom{text-align:center;color:#fff}
#splash .brand-bottom h2{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.25;text-shadow:0 2px 14px rgba(0,0,0,.5)}

.topbar{
  padding:calc(var(--safe-t) + 14px) 18px 10px;
  display:flex;align-items:center;gap:12px;
  background:var(--sf);flex-shrink:0;
}
.topbar.bordered{border-bottom:1px solid var(--bd)}
.topbar .tb-back{
  width:40px;height:40px;border-radius:50%;
  background:var(--sf2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .2s var(--e);
}
.topbar .tb-back:active{transform:scale(.92);background:var(--p-l);border-color:var(--p)}
.topbar .tb-back svg{width:18px;height:18px;fill:var(--td)}
.topbar .tb-title{
  flex:1;font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--td);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topbar .tb-actions{display:flex;gap:8px;align-items:center}
.topbar .tb-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--sf2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--e);position:relative;
}
.topbar .tb-btn:active{transform:scale(.92);background:var(--p-l)}
.topbar .tb-btn svg{width:18px;height:18px;fill:var(--td)}
.topbar .tb-btn .dot{
  position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);border:1.5px solid #fff;
}
.topbar .tb-avatar{
  width:44px;height:44px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,var(--p),var(--p-d));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;flex-shrink:0;cursor:pointer;
  border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.topbar .tb-avatar img{width:100%;height:100%;object-fit:cover}

.greet{padding:2px 18px 12px}
.greet h2{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--td);line-height:1.2}
.greet h2 span{color:var(--p)}
.greet p{font-size:12.5px;color:var(--tl);margin-top:2px;font-weight:500}

.live-clock{
  display:flex;align-items:center;gap:8px;padding:0 18px 10px;
  font-size:12px;color:var(--tl);font-weight:700;
}
.live-clock .lc-dot{
  width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(22,163,74,.15);
  animation:lcPulse 2s ease-in-out infinite;
}
@keyframes lcPulse{0%,100%{opacity:1}50%{opacity:.4}}

.weather-card{
  margin:0 18px 14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0f7a34 0%,#0b5f28 60%,#084d20 100%);
  border-radius:var(--r-lg);padding:18px;color:#fff;
  box-shadow:var(--sh-brand);
}
.weather-card::before{
  content:'';position:absolute;top:-30px;right:-20px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(255,255,255,.22) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.weather-card::after{
  content:'';position:absolute;bottom:-40px;left:-30px;width:120px;height:120px;
  background:radial-gradient(circle,rgba(134,239,172,.25) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.wc-head{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.wc-loc{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;opacity:.95}
.wc-loc svg{width:13px;height:13px;fill:#fff}
.wc-temp{font-size:38px;font-weight:900;letter-spacing:-.04em;line-height:1;margin:8px 0 4px;position:relative;z-index:1}
.wc-desc{font-size:13px;font-weight:600;opacity:.92;position:relative;z-index:1}
.wc-range{font-size:12px;font-weight:600;opacity:.85;margin-top:3px;position:relative;z-index:1}
.wc-icon{
  position:absolute;top:14px;right:16px;font-size:44px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));
  animation:bob 3s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ============ QUICK ACTIONS ============ */
.qa-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:0 18px 16px;
}
.qa{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 4px 10px;border-radius:var(--r);
  background:var(--sf2);border:1px solid var(--bd);
  transition:all .22s var(--e);
}
.qa:active{transform:scale(.94);background:var(--p-l);border-color:var(--p)}
.qa .qa-ic{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1;
}
.qa .qa-lb{font-size:10px;font-weight:800;letter-spacing:.02em;color:var(--td);text-transform:uppercase;text-align:center}
.qa-ic.c1{background:linear-gradient(145deg,#d1fae5,#10b981)}
.qa-ic.c2{background:linear-gradient(145deg,#dbeafe,#2563eb)}
.qa-ic.c3{background:linear-gradient(145deg,#ffedd5,#ea580c)}
.qa-ic.c4{background:linear-gradient(145deg,#ede9fe,#7c3aed)}

/* ============ MY FARM HORIZONTAL SCROLL ============ */
.sec-h{padding:4px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h h3{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--td)}
.sec-h button{
  font-size:12px;font-weight:700;color:var(--p);
  display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;
}
.mf-row{
  display:flex;gap:10px;padding:0 18px 16px;overflow-x:auto;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.mf-row::-webkit-scrollbar{display:none}
.mf-card{
  flex:0 0 160px;background:var(--sf);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;scroll-snap-align:start;
  transition:transform .22s var(--e);
  box-shadow:var(--sh-xs);cursor:pointer;
}
.mf-card:active{transform:scale(.97)}
.mf-card .mf-img{
  height:88px;background:var(--sf2);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:42px;
}
.mf-card .mf-img img{width:100%;height:100%;object-fit:cover}
.mf-card .mf-body{padding:9px 10px 11px}
.mf-card .mf-name{font-size:12.5px;font-weight:800;color:var(--td);letter-spacing:-.01em;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mf-card .mf-sub{font-size:10.5px;color:var(--tl);font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mf-card .mf-tag{
  display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 8px;border-radius:var(--r-p);margin-top:6px;
  background:var(--p-l);color:var(--p-d);
}
.mf-card .mf-tag.warn{background:#fef3c7;color:#92400e}
.mf-card .mf-tag.ok{background:#d1fae5;color:#065f46}
.mf-card .mf-tag.ready{background:#ffedd5;color:#9a3412}
.mf-card .mf-days{
  display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;
  color:var(--p);margin-top:4px;
}
.mf-days .mf-dot{width:5px;height:5px;border-radius:50%;background:var(--p);animation:lcPulse 1.5s infinite}
.mf-add{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px 8px;text-align:center;border-style:dashed !important;
}
.mf-add .mf-plus{font-size:32px;margin-bottom:6px}
.mf-add .mf-lb{font-size:11.5px;font-weight:800;color:var(--p)}

/* ==================================================
   SERVICE CARDS — ZAMLIFT STYLE
   ================================================== */
.service-hero{
  margin:0 18px 12px;position:relative;overflow:hidden;
  border-radius:var(--r-xl);height:180px;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:18px;cursor:pointer;color:#fff;
  transition:transform .25s var(--e);
  box-shadow:0 12px 30px -8px rgba(15,23,42,.25);
}
.service-hero:active{transform:scale(.985)}
.service-hero .sh-bg{
  position:absolute;inset:0;z-index:0;
  background:linear-gradient(135deg,#0f7a34 0%,#0b5f28 100%);
}
.service-hero .sh-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.5) 100%);
}
.service-hero .sh-art{
  position:absolute;top:-10px;right:-10px;width:200px;height:180px;
  display:flex;align-items:center;justify-content:center;
  font-size:130px;line-height:1;opacity:.9;
  transform:rotate(-8deg);z-index:1;
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.3));
}
.service-hero .sh-content{
  position:relative;z-index:2;
}
.service-hero .sh-title{
  font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.1;
  text-shadow:0 2px 12px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:10px;
}
.service-hero .sh-title .sh-ic{
  width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  backdrop-filter:blur(10px);
}
.service-hero .sh-sub{
  font-size:12.5px;font-weight:600;opacity:.92;margin-top:4px;
  text-shadow:0 1px 6px rgba(0,0,0,.4);
}
.service-hero .sh-cta{
  position:absolute;top:18px;right:18px;z-index:3;
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 12px;border-radius:var(--r-p);
  background:rgba(255,255,255,.2);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.3);
}
.service-hero.plant .sh-bg{background:linear-gradient(135deg,#0f7a34 0%,#084d20 100%)}
.service-hero.manage .sh-bg{background:linear-gradient(135deg,#2563eb 0%,#1e40af 100%)}
.service-hero.harvest .sh-bg{background:linear-gradient(135deg,#ea580c 0%,#9a3412 100%)}
.service-hero.market .sh-bg{background:linear-gradient(135deg,#7c3aed 0%,#4c1d95 100%)}

.service-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:0 18px 14px;
}
.service-card{
  position:relative;overflow:hidden;
  border-radius:var(--r-lg);height:140px;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px;cursor:pointer;color:#fff;
  transition:transform .25s var(--e);
  box-shadow:0 8px 20px -6px rgba(15,23,42,.2);
}
.service-card:active{transform:scale(.97)}
.service-card .sc-bg{
  position:absolute;inset:0;z-index:0;
}
.service-card .sc-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 100%);
}
.service-card .sc-art{
  position:absolute;top:-6px;right:-10px;width:120px;height:120px;
  display:flex;align-items:center;justify-content:center;
  font-size:78px;line-height:1;opacity:.85;z-index:1;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.3));
}
.service-card .sc-content{position:relative;z-index:2}
.service-card .sc-title{
  font-size:14px;font-weight:900;letter-spacing:-.01em;line-height:1.15;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:6px;
}
.service-card .sc-title .sc-ic{
  width:22px;height:22px;border-radius:8px;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:12px;
  backdrop-filter:blur(8px);flex-shrink:0;
}
.service-card .sc-sub{
  font-size:10.5px;font-weight:600;opacity:.92;margin-top:3px;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
  line-height:1.35;
}
.service-card.blue .sc-bg{background:linear-gradient(135deg,#2563eb 0%,#1e40af 100%)}
.service-card.orange .sc-bg{background:linear-gradient(135deg,#ea580c 0%,#9a3412 100%)}
.service-card.purple .sc-bg{background:linear-gradient(135deg,#7c3aed 0%,#4c1d95 100%)}
.service-card.teal .sc-bg{background:linear-gradient(135deg,#0891b2 0%,#155e75 100%)}
.service-card.pink .sc-bg{background:linear-gradient(135deg,#db2777 0%,#9d174d 100%)}
.service-card.amber .sc-bg{background:linear-gradient(135deg,#d97706 0%,#92400e 100%)}

/* List rows (My Orders / My Wallet style) */
.list-row{
  margin:0 18px 10px;padding:16px 18px;
  background:#fff;border:1px solid var(--bd);border-radius:var(--r-lg);
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--sh-xs);cursor:pointer;
  transition:all .2s var(--e);
}
.list-row:active{transform:scale(.985);background:var(--p-ll)}
.list-row .lr-ic{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.list-row .lr-ic.green{background:linear-gradient(145deg,#d1fae5,#10b981)}
.list-row .lr-ic.blue{background:linear-gradient(145deg,#dbeafe,#2563eb)}
.list-row .lr-ic.orange{background:linear-gradient(145deg,#ffedd5,#ea580c)}
.list-row .lr-ic.purple{background:linear-gradient(145deg,#ede9fe,#7c3aed)}
.list-row .lr-tx{flex:1;min-width:0}
.list-row .lr-tt{font-size:15px;font-weight:900;color:var(--td);letter-spacing:-.02em}
.list-row .lr-sb{font-size:12px;color:var(--tl);font-weight:600;margin-top:3px;line-height:1.35}
.list-row .lr-arrow{
  width:28px;height:28px;flex-shrink:0;color:var(--tm);
  display:flex;align-items:center;justify-content:center;
}
.list-row .lr-arrow svg{width:18px;height:18px;fill:currentColor}

/* ============ BATCH CARD ============ */
.batch-card{
  background:#fff;border:1px solid var(--bd);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:12px;box-shadow:var(--sh-sm);
  transition:transform .2s var(--e);cursor:pointer;
}
.batch-card:active{transform:scale(.99)}
.batch-card .bc-top{display:flex;align-items:center;gap:12px;padding:14px}
.batch-card .bc-crop-ic{
  width:54px;height:54px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  overflow:hidden;
}
.batch-card .bc-info{flex:1;min-width:0}
.batch-card .bc-crop{font-size:15px;font-weight:900;color:var(--td);letter-spacing:-.02em}
.batch-card .bc-variety{font-size:11.5px;color:var(--tl);font-weight:600;margin-top:2px}
.batch-card .bc-batch-num{
  font-size:10px;color:var(--p);font-weight:800;letter-spacing:.04em;
  margin-top:4px;font-family:'SF Mono','Roboto Mono',monospace;
}
.batch-card .bc-stat{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.batch-card .bc-status{
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:4px 9px;border-radius:var(--r-p);
}
.batch-card .bc-status.planted{background:#dbeafe;color:#1e40af}
.batch-card .bc-status.growing{background:#e6f5eb;color:var(--p-d)}
.batch-card .bc-status.flowering{background:#fef3c7;color:#92400e}
.batch-card .bc-status.fruiting{background:#ede9fe;color:#5b21b6}
.batch-card .bc-status.harvesting{background:#ffedd5;color:#9a3412}
.batch-card .bc-status.harvested{background:#f1f5f9;color:#475569}
.batch-card .bc-area{font-size:11px;color:var(--tl);font-weight:700}
.batch-card .bc-bar-wrap{padding:0 14px 14px}
.batch-card .bc-progress{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}
.batch-card .bc-progress-fill{
  height:100%;background:linear-gradient(90deg,var(--p),var(--acc));
  transition:width .8s var(--e);border-radius:4px;
}
.batch-card .bc-progress-meta{
  display:flex;justify-content:space-between;margin-top:6px;
  font-size:10.5px;font-weight:700;color:var(--tl);
}
.batch-card .bc-progress-meta strong{color:var(--p-d)}

/* ============ THREE TABS ON FARM SCREEN ============ */
.three-tabs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:12px 18px 14px;
}
.three-tab{
  padding:14px 8px 12px;border-radius:var(--r);
  background:var(--sf);border:2px solid var(--bd);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:all .25s var(--e);position:relative;
}
.three-tab:active{transform:scale(.96)}
.three-tab .tt-ic{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;transition:all .25s var(--e);
}
.three-tab .tt-lb{font-size:11.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--td)}
.three-tab.active.plant{border-color:var(--plant);background:var(--plant-l)}
.three-tab.active.plant .tt-ic{background:var(--plant);color:#fff;box-shadow:0 6px 16px -4px rgba(15,122,52,.45)}
.three-tab.active.plant .tt-lb{color:var(--plant)}
.three-tab.active.manage{border-color:var(--manage);background:var(--manage-l)}
.three-tab.active.manage .tt-ic{background:var(--manage);color:#fff;box-shadow:0 6px 16px -4px rgba(37,99,235,.45)}
.three-tab.active.manage .tt-lb{color:var(--manage)}
.three-tab.active.harvest{border-color:var(--harvest);background:var(--harvest-l)}
.three-tab.active.harvest .tt-ic{background:var(--harvest);color:#fff;box-shadow:0 6px 16px -4px rgba(234,88,12,.45)}
.three-tab.active.harvest .tt-lb{color:var(--harvest)}
.three-tab .tt-badge{
  position:absolute;top:6px;right:6px;min-width:20px;height:20px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  padding:0 5px;border:2px solid #fff;
}

/* ============ STEP WIZARD ============ */
.steps-indicator{
  display:flex;align-items:center;gap:6px;padding:14px 18px 6px;
}
.step-dot{
  flex:1;height:4px;border-radius:2px;background:var(--bd);
  transition:background .3s var(--e);
}
.step-dot.done{background:var(--p)}
.step-dot.active{background:var(--p);box-shadow:0 0 0 3px rgba(15,122,52,.15)}
.step-label{
  padding:0 18px 12px;font-size:11.5px;font-weight:800;
  color:var(--p);text-transform:uppercase;letter-spacing:.06em;
}
.step-title{
  padding:0 18px 6px;font-size:22px;font-weight:900;color:var(--td);
  letter-spacing:-.03em;line-height:1.2;
}
.step-sub{
  padding:0 18px 14px;font-size:13px;color:var(--tl);font-weight:600;line-height:1.5;
}

/* CROP PICKER GRID */
.crop-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:0 18px 18px;
}
@media(min-width:520px){.crop-grid{grid-template-columns:repeat(4,1fr)}}
.crop-pick{
  background:#fff;border:2px solid var(--bd);border-radius:var(--r);
  padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:all .2s var(--e);cursor:pointer;position:relative;
}
.crop-pick:active{transform:scale(.95)}
.crop-pick.selected{border-color:var(--p);background:var(--p-l);box-shadow:0 6px 16px -6px var(--p-glow)}
.crop-pick .cp-ic{
  width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:var(--sf2);
}
.crop-pick.selected .cp-ic{background:#fff}
.crop-pick .cp-lb{
  font-size:10.5px;font-weight:800;color:var(--td);
  text-align:center;line-height:1.15;letter-spacing:-.01em;
}

/* VARIETY CARDS */
.variety-card{
  background:#fff;border:2px solid var(--bd);border-radius:var(--r);
  padding:14px;margin-bottom:10px;cursor:pointer;text-align:left;width:100%;
  transition:all .2s var(--e);
}
.variety-card:active{transform:scale(.98)}
.variety-card.selected{border-color:var(--p);background:var(--p-ll);box-shadow:0 6px 16px -6px var(--p-glow)}
.variety-card .vc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.variety-card .vc-name{font-size:15px;font-weight:900;color:var(--td);letter-spacing:-.02em}
.variety-card .vc-type{
  font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 8px;border-radius:var(--r-p);background:var(--sf2);color:var(--tl);flex-shrink:0;
}
.variety-card .vc-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.variety-card .vc-chip{
  font-size:10.5px;font-weight:700;color:var(--tb);
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:var(--r-p);background:var(--sf2);
}
.variety-card .vc-note{font-size:11.5px;color:var(--tl);font-weight:500;margin-top:8px;line-height:1.5}

/* AREA INPUT */
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 14px}
.area-box{
  background:#fff;border:2px solid var(--bd);border-radius:var(--r);
  padding:16px 12px;text-align:center;
}
.area-box label{
  display:block;font-size:11px;font-weight:800;color:var(--tl);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;
}
.area-box input{
  width:100%;border:none;background:none;outline:none;text-align:center;
  font-size:26px;font-weight:900;color:var(--td);letter-spacing:-.03em;
}
.area-box .ab-unit{font-size:11px;color:var(--tl);font-weight:700;margin-top:4px}

.area-result{
  margin:0 18px 14px;padding:16px 18px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,#e6f5eb 0%,#d1fae5 100%);
  border:1.5px solid rgba(15,122,52,.18);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.area-result .ar-l{font-size:12px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.05em}
.area-result .ar-v{font-size:28px;font-weight:900;color:var(--p-d);letter-spacing:-.03em;line-height:1}
.area-result .ar-s{font-size:11px;color:var(--p);font-weight:600;margin-top:4px}

/* TOWN LIST */
.town-list{padding:0 18px 18px}
.town-item{
  display:flex;align-items:center;gap:12px;padding:14px;width:100%;
  background:#fff;border:2px solid var(--bd);border-radius:var(--r);
  margin-bottom:8px;transition:all .2s var(--e);cursor:pointer;text-align:left;
}
.town-item:active{transform:scale(.98)}
.town-item.selected{border-color:var(--p);background:var(--p-l)}
.town-item .ti-ic{
  width:40px;height:40px;border-radius:50%;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.town-item.selected .ti-ic{background:#fff}
.town-item .ti-name{font-size:14px;font-weight:800;color:var(--td)}
.town-item .ti-sub{font-size:11px;color:var(--tl);font-weight:600;margin-top:2px}

/* FORM ELEMENTS */
.frm{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.fld{position:relative}
.fld label{
  display:block;font-size:11.5px;font-weight:800;color:var(--tl);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;
}
.fld .inp{
  width:100%;padding:14px 16px;border:1.5px solid var(--bd);border-radius:var(--r);
  background:var(--sf);font-size:15px;font-weight:500;color:var(--td);
  outline:none;transition:all .2s var(--e);-webkit-appearance:none;appearance:none;
}
.fld .inp:focus{border-color:var(--p);box-shadow:var(--ring);background:#fbfdfb}
.fld textarea.inp{resize:vertical;min-height:82px;line-height:1.5}

.btn{
  width:100%;padding:15px 18px;border-radius:var(--r-p);
  font-size:15px;font-weight:800;letter-spacing:-.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .22s var(--e);
}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:linear-gradient(180deg,#12903e 0%,var(--p) 100%);color:#fff;box-shadow:var(--sh-brand)}
.btn-p:active:not(:disabled){transform:scale(.97)}
.btn-o{background:transparent;color:var(--p);border:1.5px solid var(--p)}
.btn-o:active:not(:disabled){background:var(--p-l)}
.btn-s{background:var(--sf);color:var(--td);border:1.5px solid var(--bd)}
.btn-s:active:not(:disabled){background:var(--sf2)}
.btn-danger{background:var(--sf);color:var(--danger);border:1.5px solid var(--danger)}
.btn-sm{padding:10px 14px;font-size:13px}
.btn-row{display:flex;gap:10px;padding:0 18px 18px}
.btn-row .btn{flex:1}

/* BATCH DETAIL */
.detail-hero{
  height:180px;background:var(--sf2);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:80px;
}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-body{padding:16px 18px 24px}
.detail-body h1{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--td);margin-bottom:6px}
.detail-body .d-sc{font-size:13px;color:var(--tl);font-weight:600;margin-bottom:12px}

.batch-num-box{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:linear-gradient(135deg,#e6f5eb 0%,#d1fae5 100%);
  border:1px solid rgba(15,122,52,.18);border-radius:var(--r);
  margin-bottom:14px;
}
.batch-num-box .bn-lb{font-size:10px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.05em}
.batch-num-box .bn-v{
  font-family:'SF Mono','Roboto Mono',monospace;
  font-size:13px;font-weight:800;color:var(--p-d);letter-spacing:.02em;margin-top:2px;
  word-break:break-all;
}

.d-section{margin-bottom:16px}
.d-section h3{
  font-size:12.5px;font-weight:900;color:var(--td);letter-spacing:-.01em;
  text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.d-section h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}

.info-table{background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.info-row{
  display:flex;justify-content:space-between;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--bd);
  font-size:12.5px;
}
.info-row:last-child{border-bottom:none}
.info-row .ir-k{color:var(--tl);font-weight:700;flex-shrink:0}
.info-row .ir-v{color:var(--td);font-weight:800;text-align:right;word-break:break-word;max-width:60%}

.timeline-stage{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;border-radius:var(--r-sm);
  background:var(--sf2);border:1px solid var(--bd);
  margin-bottom:6px;
}
.timeline-stage .ts-dot{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:var(--bd);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;margin-top:1px;
}
.timeline-stage.done .ts-dot{background:var(--p)}
.timeline-stage.active{background:var(--p-ll);border-color:var(--p)}
.timeline-stage.active .ts-dot{background:var(--p);box-shadow:0 0 0 4px rgba(15,122,52,.15)}
.timeline-stage .ts-lb{font-size:12.5px;font-weight:700;color:var(--td);text-transform:capitalize}
.timeline-stage.done .ts-lb{color:var(--p-d)}
.timeline-stage .ts-dur{font-size:10.5px;color:var(--tl);font-weight:600;margin-top:2px}

.schedule-row{
  display:flex;justify-content:space-between;gap:10px;
  padding:10px 12px;background:#fff;border:1px solid var(--bd);
  border-radius:var(--r-sm);margin-bottom:6px;
}
.schedule-row .sr-left{flex:1;min-width:0}
.schedule-row .sr-title{font-size:12.5px;font-weight:800;color:var(--td)}
.schedule-row .sr-sub{font-size:10.5px;color:var(--tl);font-weight:600;margin-top:2px;line-height:1.4}
.schedule-row .sr-right{text-align:right;flex-shrink:0;max-width:45%}
.schedule-row .sr-rate{font-size:12.5px;font-weight:900;color:var(--p-d)}
.schedule-row .sr-time{font-size:10px;color:var(--tl);font-weight:700;margin-top:2px}

.knowledge-block{
  background:#fff;border:1px solid var(--bd);border-radius:var(--r);
  padding:14px;margin-bottom:10px;
}
.knowledge-block h4{font-size:12.5px;font-weight:900;color:var(--td);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.knowledge-block p{font-size:12.5px;color:var(--tb);line-height:1.55;font-weight:500}
.knowledge-block ul{list-style:none;padding:0;margin-top:6px}
.knowledge-block ul li{
  font-size:12px;color:var(--tb);font-weight:600;
  padding:5px 0;padding-left:16px;position:relative;line-height:1.45;
}
.knowledge-block ul li::before{
  content:'●';color:var(--p);font-size:8px;position:absolute;left:2px;top:8px;
}

/* Details toggle */
.details-toggle{
  width:100%;padding:14px;border-radius:var(--r);
  background:var(--sf2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:800;color:var(--td);margin-bottom:8px;
  transition:all .2s var(--e);
}
.details-toggle:active{transform:scale(.98);background:var(--p-l)}
.details-toggle .dt-chev{transition:transform .3s var(--e)}
.details-toggle.open .dt-chev{transform:rotate(180deg)}
.details-content{
  max-height:0;overflow:hidden;
  transition:max-height .4s var(--e);
}
.details-content.open{max-height:3000px}

/* HARVEST INPUT */
.harvest-box{
  margin:0 18px 14px;padding:18px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,#ffedd5 0%,#fed7aa 100%);
  border:1.5px solid rgba(234,88,12,.18);
}
.harvest-box h4{
  font-size:13px;font-weight:900;color:#9a3412;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.harvest-input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.harvest-input-box{
  background:#fff;border:1.5px solid rgba(234,88,12,.22);
  border-radius:var(--r);padding:12px;text-align:center;
}
.harvest-input-box label{
  display:block;font-size:10.5px;font-weight:800;color:#9a3412;
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;
}
.harvest-input-box input{
  width:100%;border:none;background:none;outline:none;text-align:center;
  font-size:24px;font-weight:900;color:var(--td);letter-spacing:-.03em;
}
.harvest-input-box .hib-unit{
  font-size:10.5px;color:#9a3412;font-weight:800;margin-top:4px;letter-spacing:.03em;
}

.compare-card{
  margin:0 18px 14px;padding:14px;border-radius:var(--r);
  background:#fff;border:1px solid var(--bd);
}
.compare-card h4{font-size:12px;font-weight:900;color:var(--td);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.compare-bars{margin-top:8px}
.compare-bar-row{margin-bottom:10px}
.compare-bar-row .cbr-top{
  display:flex;justify-content:space-between;font-size:11.5px;
  font-weight:800;color:var(--tb);margin-bottom:4px;
}
.compare-bar-row .cbr-top span:first-child{color:var(--tl);font-weight:700}
.compare-bar-track{height:10px;border-radius:5px;background:var(--bd);overflow:hidden}
.compare-bar-fill{height:100%;border-radius:5px;transition:width .8s var(--e)}
.compare-bar-fill.expected{background:linear-gradient(90deg,#86efac,#16a34a)}
.compare-bar-fill.actual{background:linear-gradient(90deg,#fdba74,#ea580c)}

/* SUCCESS SCREEN */
.success-burst{text-align:center;padding:20px 0}
.success-burst .sb-ic{
  width:96px;height:96px;border-radius:50%;margin:0 auto 16px;
  background:linear-gradient(145deg,#a7f3d0,#0f7a34);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 16px 40px -8px rgba(15,122,52,.4);
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.success-burst h2{font-size:22px;font-weight:900;color:var(--td);letter-spacing:-.03em;margin-bottom:8px}
.success-burst p{font-size:13.5px;color:var(--tl);line-height:1.55;margin-bottom:14px}

.batch-result{
  padding:16px;border-radius:var(--r-lg);margin:0 0 16px;
  background:linear-gradient(135deg,#e6f5eb 0%,#d1fae5 100%);
  border:1.5px solid rgba(15,122,52,.18);
  text-align:left;
}
.batch-result .br-lb{
  font-size:10.5px;font-weight:800;color:var(--p);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;
}
.batch-result .br-num{
  font-family:'SF Mono','Roboto Mono',monospace;
  font-size:16px;font-weight:900;color:var(--p-d);letter-spacing:.02em;
  word-break:break-all;margin-bottom:12px;
}
.batch-result .br-row{
  display:flex;justify-content:space-between;padding:6px 0;
  font-size:12.5px;border-bottom:1px dashed rgba(15,122,52,.18);
}
.batch-result .br-row:last-child{border-bottom:none}
.batch-result .br-row span:first-child{color:var(--p);font-weight:700}
.batch-result .br-row span:last-child{color:var(--p-d);font-weight:800;text-align:right}

/* BOTTOM NAV */
.bnav{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-around;
  z-index:20;
}
.bnav .bn{
  flex:1;height:var(--nav-h);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--tm);transition:color .25s var(--e);position:relative;padding:0 2px;
}
.bnav .bn svg{
  width:22px;height:22px;fill:currentColor;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.bnav .bn .bn-lb{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.bnav .bn.active{color:var(--p)}
.bnav .bn.active svg{transform:scale(1.45)}
.bnav .bn.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--p);
  box-shadow:0 2px 6px -1px var(--p-glow);
}
.bnav .bn .bn-badge{
  position:absolute;top:8px;right:calc(50% - 18px);
  min-width:16px;height:16px;padding:0 4px;
  background:var(--danger);color:#fff;font-size:9px;font-weight:800;
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--sf);
}

/* MODAL + TOAST */
.modal{
  position:fixed;inset:0;background:rgba(15,23,42,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:500;
  animation:fadeIn .22s ease;
}
.modal.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  background:#fff;border-radius:var(--r-xl);width:100%;max-width:420px;
  padding:24px;text-align:center;
  box-shadow:0 30px 70px -20px rgba(15,23,42,.35);
  animation:modalIn .32s cubic-bezier(.34,1.4,.64,1);
  max-height:85vh;overflow-y:auto;
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-card h3{font-size:18px;font-weight:900;color:var(--td);margin-bottom:8px;letter-spacing:-.02em}

function esc(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function fmtZMK(n){
  if(n==null||isNaN(n)) return '—';

function fmtDate(ts){
  if(!ts) return '—';
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function timeAgo(ts){
  if(!ts) return 'just now';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<604800) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}
function nowMs(){ return Date.now(); }

/* ============================================================
   BATCH NUMBER
   ============================================================ */
async function generateBatchNumber(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const dateKey = `${y}_${m}_${d}`;
  let seq = 1;
  try{
    const snap = await get(ref(db, 'batches'));
    if(snap.exists()){
      const all = snap.val() || {};
      let maxToday = 0;
      Object.values(all).forEach(b=>{
        if(b && b.batchDateKey === dateKey){
          const n = parseInt(b.batchSeq || 0, 10);
          if(n > maxToday) maxToday = n;
        }
      });
      seq = maxToday + 1;
    }
  }catch(e){}
  const seqStr = String(seq).padStart(3, '0');
  return { batchNumber: `BATCH-${seqStr}_${dateKey}`, batchSeq: seq, batchDateKey: dateKey };
}

/* ============================================================
   AREA MATH
   ============================================================ */
const SQ_M_PER_HA = 10000;
function computeArea(length, width){
  const L = parseFloat(length) || 0;
  const W = parseFloat(width) || 0;
  const m2 = L * W;
  const ha = m2 / SQ_M_PER_HA;
  return { m2, ha };
}

/* ============================================================
   YIELD FORECAST
   ============================================================ */
function parseYieldRange(str){
  if(!str) return { low:0, high:0 };
  const m = String(str).match(/([\d.]+)\s*[–-]\s*([\d.]+)/);
  if(m) return { low: parseFloat(m[1]), high: parseFloat(m[2]) };
  const single = String(str).match(/([\d.]+)/);
  if(single) return { low: parseFloat(single[1]), high: parseFloat(single[1]) };
  return { low:0, high:0 };
}
function computeForecast(cropId, varietyName, areaHa){
  const list = S.varieties[cropId] || [];
  const variety = list.find(v=>v.name === varietyName);
  if(!variety) return { lowKg:0, highKg:0, baseKg:0, variety:null };
  const range = parseYieldRange(variety.yield);
  return {
    lowKg: range.low * 1000 * areaHa,
    highKg: range.high * 1000 * areaHa,
    baseKg: ((range.low + range.high) / 2) * 1000 * areaHa,
    variety
  };
}

}

/* ============================================================
   WEATHER
   ============================================================ */
async function loadWeatherByCoords(lat, lng){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4`;
    const r = await fetch(url);
    const j = await r.json();
    return {
      temp: Math.round(j.current.temperature_2m),
      hum: j.current.relative_humidity_2m,
      wind: Math.round(j.current.wind_speed_10m),
      code: j.current.weather_code,
      isDay: j.current.is_day === 1,
      hi: Math.round(j.daily.temperature_2m_max[0]),
      lo: Math.round(j.daily.temperature_2m_min[0])
    };
  }catch(e){ return null; }
}
function weatherIconFor(code, isDay){
  if(code === 0) return isDay ? '☀️' : '🌙';
  if(code === 1) return isDay ? '🌤️' : '🌙';
  if(code === 2) return isDay ? '⛅' : '☁️';
  if(code === 3) return '☁️';
  if(code <= 48) return '🌫️';
  if(code <= 55) return '🌦️';
  if(code <= 65) return '🌧️';
  if(code <= 77) return '🌨️';
  if(code <= 82) return '🌧️';
  return '⛈️';
}
function weatherDescFor(code){
  if(code === 0) return 'Clear sky';
  if(code === 1) return 'Mainly clear';
  if(code === 2) return 'Partly cloudy';
  if(code === 3) return 'Overcast';
  if(code <= 48) return 'Foggy';
  if(code <= 55) return 'Drizzle';
  if(code <= 65) return 'Rain';
  if(code <= 77) return 'Snow';
  if(code <= 82) return 'Rain showers';
  return 'Thunderstorm';
}
function formatLiveClock(d){
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm} ${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}
function startLiveClock(){
  const tick = ()=>{
    const el = document.getElementById('liveClockText');
    if(el) el.textContent = formatLiveClock(new Date());

  tick();
  clearInterval(S.liveClockTimer);
  S.liveClockTimer = setInterval(tick, 30000);

  const wrap = document.querySelector('.screen-wrap');

  if(!el){
    el = document.createElement('div');
    el.className = 'screen';
    el.id = 'screen-'+id;
    wrap.appendChild(el);
  }
  return el;
}
function showScreen(id, data={}, pushHistory=true){
  S.screenData = data || {};
  const target = buildScreen(id);
  if(activeScreenEl && activeScreenEl !== target) activeScreenEl.classList.remove('active');
  void target.offsetWidth;
  target.classList.add('active');
  activeScreenEl = target;
  S.screen = id;
  route();

  const sc = target.querySelector('.scroll');
  if(sc) sc.scrollTop = 0;
  updateNav(id);
  startLiveClock();
}

    case 'farm': el.innerHTML = renderFarm(); break;

function renderBatchCard(b, mode='manage'){
  const crop = S.catalogue.find(c=>c.id === b.cropId);
  const ic = crop ? pickIcon(crop.name) : '🌱';
  const grad = crop ? gradFor(crop.name) : gradFor(b.cropName||'');
  const stage = b.stage || 'planted';
  const totalDays = b.totalDays || 120;
  const daysIn = b.plantedDate ? Math.max(0, Math.floor((Date.now() - b.plantedDate)/86400000)) : 0;
  const pct = Math.min(100, Math.round(daysIn / totalDays * 100));
  const statusLabel = {
    planted:'Planted', growing:'Growing', flowering:'Flowering',
    fruiting:'Fruiting', harvesting:'Ready', harvested:'Harvested'
  }[stage] || stage;
  return `
  <div class="batch-card" onclick="openBatch('${esc(b.id)}','${esc(mode)}')">
    <div class="bc-top">
      <div class="bc-crop-ic" style="background:${grad}">${ic}</div>
      <div class="bc-info">
        <div class="bc-crop">${esc(b.cropName)}</div>
        <div class="bc-variety">${esc(b.varietyName || '')}</div>
        <div class="bc-batch-num">${esc(b.batchNumber || '')}</div>
      </div>
      <div class="bc-stat">
        <div class="bc-status ${stage}">${esc(statusLabel)}</div>
        <div class="bc-area">${b.areaHa ? b.areaHa.toFixed(2)+' ha' : ''}</div>
      </div>
    </div>
    ${mode !== 'harvested' ? `
    <div class="bc-bar-wrap">
      <div class="bc-progress">
        <div class="bc-progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="bc-progress-meta">
        <span>Day <strong>${daysIn}</strong> of ~${totalDays}</span>
        <span><strong>${pct}%</strong> to harvest</span>
      </div>
    </div>`:''}
  </div>`;
}

function renderStepsIndicator(active, total=4){
  let html = '<div class="steps-indicator">';
  for(let i=1; i<=total; i++){
    html += `<div class="step-dot ${i<active?'done':''} ${i===active?'active':''}"></div>`;
  }
  html += '</div>';
  return html;
}

  );
  const popular = crops.slice(0, 24);
  return `

window.filterCrops = (q)=>{

  grid.querySelectorAll('.crop-pick').forEach(el=>{
    const name = el.dataset.name || '';
    el.style.display = !term || name.includes(term) ? '' : 'none';
  });
};

window.updateArea = (field, value)=>{
  const v = parseFloat(value) || 0;
  if(field === 'length') S.plantWizard.length = v;
  if(field === 'width') S.plantWizard.width = v;
  const area = computeArea(S.plantWizard.length, S.plantWizard.width);
  const haEl = document.getElementById('area-ha');
  const m2El = document.getElementById('area-m2');
  if(haEl) haEl.textContent = area.ha.toFixed(3);
  if(m2El) m2El.textContent = `${area.m2.toFixed(0)} m²  ·  (1 ha = 10,000 m²)`;
  const btn = document.getElementById('plant-step3-next');
  if(btn) btn.disabled = !(S.plantWizard.length > 0 && S.plantWizard.width > 0);
};

};

window.filterTowns = (q)=>{
  const list = document.getElementById('town-list');
  if(!list) return;
  const term = q.trim().toLowerCase();
  list.querySelectorAll('.town-item').forEach(el=>{
    const name = el.dataset.name || '';
    el.style.display = !term || name.includes(term) ? '' : 'none';
  });
};

window.pickTown = (town)=>{
  S.plantWizard.town = town;
  document.querySelectorAll('.town-item').forEach(el=>{
    el.classList.toggle('selected', el.querySelector('.ti-name').textContent === town);
  });
};

window.finishPlanting = async ()=>{
  const w = S.plantWizard;
  if(!w.cropId || !w.varietyName || !w.length || !w.width || !w.town){
    toast('Please complete all steps');
    return;
  }
  const crop = S.catalogue.find(c=>c.id === w.cropId);
  if(!crop){ toast('Crop not found'); return; }

  const btn = document.getElementById('plant-finish');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }

  const area = computeArea(w.length, w.width);
  const forecast = computeForecast(w.cropId, w.varietyName, area.ha);
  const { batchNumber, batchSeq, batchDateKey } = await generateBatchNumber();

  let totalDays = 120;
  const v = (S.varieties[w.cropId]||[]).find(x=>x.name === w.varietyName);
  if(v && v.maturity){
    const m = String(v.maturity).match(/(\d+)/);
    if(m) totalDays = parseInt(m[1],10);
  }
  const stages = S.detailedStages[w.cropId] || [];
  if(stages.length && stages[stages.length-1].duration){
    const dm = String(stages[stages.length-1].duration).match(/(\d+)/);
    if(dm) totalDays = Math.max(totalDays, parseInt(dm[1],10));
  }

  const plantedDate = nowMs();
  const harvestStart = plantedDate + Math.round(totalDays * 0.85) * 86400000;
  const harvestEnd = plantedDate + Math.round(totalDays * 1.15) * 86400000;

  const batch = {
    batchNumber, batchSeq, batchDateKey,
    ownerId: S.user.uid,
    ownerName: (S.profile.firstName||'') + ' ' + (S.profile.lastName||''),
    cropId: w.cropId,
    cropName: crop.name,
    varietyName: w.varietyName,
    lengthM: w.length,
    widthM: w.width,
    areaM2: area.m2,
    areaHa: area.ha,
    town: w.town,
    stage: 'planted',
    status: 'active',
    plantedDate,
    totalDays,
    harvestStart,
    harvestEnd,
    expectedYieldLowKg: forecast.lowKg,
    expectedYieldHighKg: forecast.highKg,
    expectedYieldBaseKg: forecast.baseKg,
    expectedYieldUnit: 'kg',
    createdAt: nowMs(),
    updatedAt: nowMs(),
    harvestRecords: []
  };

  try{
    const newRef = push(ref(db, 'batches'));
    await set(newRef, batch);
    batch.id = newRef.key;
    S.myBatches.unshift(batch);
    showScreen('plant-success', {batch});
  }catch(e){
    console.error(e);
    toast('Failed: ' + (e.message || e));
    if(btn){ btn.disabled = false; btn.textContent = 'Finish ✓'; }
  }
};

window.updateHarvestPreview = (id)=>{
  const b = S.myBatches.find(x=>x.id === id);
  if(!b) return;
  const kg = parseFloat(document.getElementById('hv-kg').value) || 0;
  const expectedBase = b.expectedYieldBaseKg || 0;
  const pct = expectedBase ? Math.min(150, Math.round(kg/expectedBase*100)) : 0;
  const bar = document.getElementById('hv-actual-bar');
  const lbl = document.getElementById('hv-actual-label');
  const pctLbl = document.getElementById('hv-pct-label');
  if(bar) bar.style.width = Math.min(100, pct) + '%';
  if(lbl) lbl.textContent = `${Math.round(kg/10)/100} t`;
  if(pctLbl) pctLbl.textContent = pct + '% of expected';

  const reasonBlock = document.getElementById('hv-reason-block');
  if(reasonBlock){
    const diff = expectedBase ? Math.abs(kg - expectedBase) / expectedBase : 0;
    reasonBlock.style.display = (kg > 0 && diff > 0.15) ? 'block' : 'none';
  }
};

window.submitHarvest = async (id)=>{
  const b = S.myBatches.find(x=>x.id === id);
  if(!b) return;
  const kg = parseFloat(document.getElementById('hv-kg').value) || 0;
  const boxes = parseFloat(document.getElementById('hv-boxes').value) || 0;
  const dateStr = document.getElementById('hv-date').value;
  const notes = document.getElementById('hv-notes').value.trim();
  const reason = document.getElementById('hv-reason').value || '';

  if(kg <= 0 && boxes <= 0){
    toast('Please enter harvest weight or boxes');
    return;
  }
  const btn = document.getElementById('hv-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }

  const record = {
    kg, boxes, dateStr, notes, reason,
    expectedKg: b.expectedYieldBaseKg || 0,
    recordedAt: nowMs()
  };
  try{
    const newRef = push(ref(db, `batches/${id}/harvestRecords`));
    await set(newRef, record);
    const prev = b.harvestRecords || [];
    const all = [...prev, {id:newRef.key, ...record}];
    const totalKg = all.reduce((s,r)=>s + (Number(r.kg)||0), 0);
    const totalBoxes = all.reduce((s,r)=>s + (Number(r.boxes)||0), 0);
    await update(ref(db, 'batches/'+id), {
      harvestRecords: all,
      totalHarvestKg: totalKg,
      totalHarvestBoxes: totalBoxes,
      lastHarvestAt: nowMs(),
      stage: 'harvested',
      status: 'harvested',
      updatedAt: nowMs()
    });
    b.harvestRecords = all;
    b.totalHarvestKg = totalKg;
    b.totalHarvestBoxes = totalBoxes;
    b.stage = 'harvested';
    b.status = 'harvested';
    toast('Harvest saved ✓');
    setTimeout(()=>{
      showScreen('batch-detail', {id, tab:'manage'});
    }, 500);
  }catch(e){
    console.error(e);
    toast('Failed: ' + (e.message||e));
    if(btn){ btn.disabled = false; btn.textContent = 'Save Harvest'; }
  }
};

}

/* ============================================================
   LOCATION
   ============================================================ */
async function reverseGeocodeCity(lat, lng){
  try{
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=12&accept-language=en`;
    const r = await fetch(url);
    if(!r.ok) return null;
    const j = await r.json();
    const a = j.address || {};
    return { city: a.city || a.town || a.village || a.municipality || a.county || a.state_district || '' };
  }catch(e){ return null; }
}

async function detectUserCityAndWeather(force){
  if(!S.locationPermissionAsked && !force){
    S.locationPermissionAsked = true;
    const allowed = await new Promise(resolve=>{
      modal(`
        <div style="text-align:center">
          <div style="font-size:48px;margin-bottom:12px">📍</div>
          <h3>Enable Location</h3>
          <p>AgriCare needs your location to show accurate weather for your farm.</p>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-p" id="loc-allow">Allow Location</button>
            <button class="btn btn-s" id="loc-skip">Not Now</button>
          </div>
        </div>`);
      document.getElementById('loc-allow').onclick = ()=>{ closeModal(); resolve(true); };
      document.getElementById('loc-skip').onclick  = ()=>{ closeModal(); resolve(false); };
    });
    if(!allowed){
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if(S.screen === 'home') route();
      return;
    }
  }
  if(!navigator.geolocation){
    S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
    S.weatherCity = S.userLocation;
    if(S.screen === 'home') route();
    return;
  }
  return new Promise(resolve=>{
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      S.userCoords = {lat, lng};
      const place = await reverseGeocodeCity(lat, lng);
      if(place && place.city){
        S.weatherCity = place.city;
        S.userLocation = place.city;
      }
      S.weather = await loadWeatherByCoords(lat, lng);
      if(S.screen === 'home') route();
      resolve();
    }, async ()=>{
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if(S.screen === 'home') route();
      resolve();
    }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 300000});
  });
}

/* ============================================================
   LOAD KNOWLEDGE
   ============================================================ */
async function loadKnowledgeBase(){
  try{
    const snap = await get(ref(db,'agriKnowledge'));
    if(!snap.exists()) return false;
    const data = snap.val();

    const cat = [];
    const push = (obj, category, group)=>{
      if(!obj) return;
      Object.entries(obj).forEach(([k,v])=>{
        if(v && v.name){
          cat.push({
            id:k, key:k, name:v.name,
            scientificName: v.scientificName||'',
            group: v.group||group||'',
            category: category||group||'',
            enterpriseType: v.enterpriseType||'Crop',
            stages: v.stages||[],
            managementNotes: v.managementNotes||'',
            risks: v.risks||[],
            harvestSignal: v.harvestSignal||'',
            indicativeDuration: v.indicativeDuration||''
          });
        }
      });
    };
    if(data.crops?.fieldCrops) push(data.crops.fieldCrops, 'Field Crops', 'Cereal');
    if(data.crops?.pulses)     push(data.crops.pulses, 'Pulses', 'Legume');
    if(data.crops?.vegetables) push(data.crops.vegetables, 'Vegetables', 'Vegetable');
    if(data.crops?.fruits)     push(data.crops.fruits, 'Fruits', 'Fruit');
    if(data.livestock)         push(data.livestock, 'Livestock', 'Livestock');
    if(data.poultry)           push(data.poultry, 'Poultry', 'Poultry');
    if(data.fisheries?.aquaculture) push(data.fisheries.aquaculture, 'Fisheries', 'Aquaculture');
    if(data.fisheries?.capture)     push(data.fisheries.capture, 'Fisheries', 'Capture');

    S.catalogue = cat;
    S.varieties = data.varieties || {};
    S.cropSpacing = data.cropSpacing || {};
    S.fertilizerSchedules = data.fertilizerSchedules || {};
    S.soilTypes = data.soilTypes || [];
    S.irrigationTypes = data.irrigationTypes || [];
    S.detailedStages = data.detailedStages || {};

    console.log('[AgriCare] Knowledge loaded:', {
      crops: S.catalogue.length,
      varieties: Object.keys(S.varieties).length,
      spacing: Object.keys(S.cropSpacing).length,
      fertilizers: Object.keys(S.fertilizerSchedules).length,
      soils: S.soilTypes.length,
      irrigation: S.irrigationTypes.length,
      stages: Object.keys(S.detailedStages).length
    });
    return true;
  }catch(e){
    console.error('[AgriCare] Failed to load knowledge base', e);
    return false;
  }
}

async function loadUserData(uid){
  try{
    const p = await get(ref(db,'users/'+uid));
    if(p.exists()){
      S.profile = p.val();
      if(S.profile.location) S.userLocation = S.profile.location;
      if(S.profile.city) S.weatherCity = S.profile.city;
    }
    const batchesSnap = await get(ref(db, 'batches'));
    if(batchesSnap.exists()){
      const all = batchesSnap.val() || {};
      S.myBatches = Object.entries(all)
        .filter(([k,v]) => v && v.ownerId === uid)
        .map(([k,v]) => ({id:k, ...v}))
        .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    }
    const listSnap = await get(ref(db, 'marketListings'));
    if(listSnap.exists()){
      const all = listSnap.val() || {};
      S.myListings = Object.entries(all)
        .filter(([k,v]) => v && v.seller_id === uid)
        .map(([k,v]) => ({id:k, ...v}));
    }
  }catch(e){
    console.warn('loadUserData', e);
  }
}

async function loadMarketplaceData(){
  try{
    const snap = await get(ref(db, 'marketListings'));
    if(snap.exists()){
      const all = snap.val() || {};
      S.marketplace = Object.entries(all)
        .filter(([k,v]) => v && v.status !== 'removed')
        .map(([k,v]) => ({id:k, ...v}))
        .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    }
  }catch(e){}
}

/* ============================================================
   START
   ============================================================ */
async function startApp(){
  const splash = document.getElementById('splash');
  requestAnimationFrame(()=> splash.classList.add('show'));

  onAuthStateChanged(auth, async (user)=>{
    await new Promise(r=>setTimeout(r, 2500));
    if(!user){
      window.location.href = 'index.html';
      return;
    }
    S.user = user;

    await loadKnowledgeBase();
    await loadUserData(user.uid);
    await loadMarketplaceData();

    const app = document.getElementById('app');
    app.innerHTML = `<div class="screen-wrap"></div>`;
    const wrap = app.querySelector('.screen-wrap');
    const home = document.createElement('div');
    home.className = 'screen';
    home.id = 'screen-home';
    wrap.appendChild(home);
    activeScreenEl = home;
    S.screen = 'home';
    home.classList.add('active');
    route();
    try{ history.replaceState({screen:'home'}, '', '#home'); }catch(e){}

    await detectUserCityAndWeather();

    const splashEl = document.getElementById('splash');
    if(splashEl){
      splashEl.classList.remove('show');
      setTimeout(()=>{
        if(splashEl.parentNode) splashEl.parentNode.removeChild(splashEl);
      }, 800);
    }
  });
}

window.addEventListener('unhandledrejection', e=>console.warn('Unhandled:', e.reason));

startApp();
</script>
