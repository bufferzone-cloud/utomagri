<style>
/* ============================================================
   DESIGN TOKENS — LIGHT (default)
   ============================================================ */
:root{
  --p:#0f7a34;
  --p-h:#0b5f28;
  --p-d:#084d20;
  --p-l:#e6f5eb;
  --p-ll:#f1faf4;
  --p-glow:rgba(15,122,52,.28);
  --acc:#16a34a;
  --acc-soft:#86efac;
  --td:#0f172a;
  --tb:#334155;
  --tl:#64748b;
  --tm:#94a3b8;
  --bd:#e2e8f0;
  --bd-s:#cbd5e1;
  --sf:#ffffff;
  --sf2:#f8fafc;
  --bg:#f4f7f5;
  --danger:#dc2626;
  --danger-soft:#fee2e2;
  --warn:#b45309;
  --warn-soft:#fef3c7;
  --ok:#16a34a;
  --ok-soft:#d1fae5;
  --info:#2563eb;
  --info-soft:#dbeafe;
  --r-sm:10px;
  --r:14px;
  --r-lg:20px;
  --r-xl:26px;
  --r-2xl:32px;
  --r-3xl:40px;
  --r-p:999px;
  --e:cubic-bezier(.22,1,.36,1);
  --e-bounce:cubic-bezier(.34,1.56,.64,1);
  --sh-xs:0 1px 2px rgba(15,23,42,.05);
  --sh-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh:0 4px 12px rgba(15,23,42,.07),0 2px 4px rgba(15,23,42,.04);
  --sh-md:0 8px 24px rgba(15,23,42,.09),0 3px 8px rgba(15,23,42,.05);
  --sh-lg:0 12px 28px rgba(15,23,42,.09),0 4px 10px rgba(15,23,42,.05);
  --sh-xl:0 20px 48px rgba(15,23,42,.12),0 6px 16px rgba(15,23,42,.06);
  --sh-brand:0 10px 30px -8px var(--p-glow);
  --sh-brand-lg:0 20px 50px -10px rgba(15,122,52,.4);
  --ring:0 0 0 4px rgba(15,122,52,.14);
  --nav-h:68px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

[data-theme="dark"]{
  --p:#22c55e;
  --p-h:#16a34a;
  --p-d:#86efac;
  --p-l:#064e3b;
  --p-ll:#022c22;
  --p-glow:rgba(34,197,94,.32);
  --acc:#22c55e;
  --acc-soft:#065f46;
  --td:#f1f5f9;
  --tb:#cbd5e1;
  --tl:#94a3b8;
  --tm:#64748b;
  --bd:#1e293b;
  --bd-s:#334155;
  --sf:#0f172a;
  --sf2:#1e293b;
  --bg:#020617;
  --danger:#f87171;
  --danger-soft:#450a0a;
  --warn:#fbbf24;
  --warn-soft:#422006;
  --ok:#34d399;
  --ok-soft:#064e3b;
  --info:#60a5fa;
  --info-soft:#1e3a8a;
  --sh-xs:0 1px 2px rgba(0,0,0,.5);
  --sh-sm:0 1px 3px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.4);
  --sh:0 4px 12px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.4);
  --sh-md:0 8px 24px rgba(0,0,0,.65),0 3px 8px rgba(0,0,0,.5);
  --sh-lg:0 12px 28px rgba(0,0,0,.7),0 4px 10px rgba(0,0,0,.5);
  --sh-xl:0 20px 48px rgba(0,0,0,.8),0 6px 16px rgba(0,0,0,.6);
  --sh-brand:0 10px 30px -8px rgba(34,197,94,.4);
  --sh-brand-lg:0 20px 50px -10px rgba(34,197,94,.35);
  --ring:0 0 0 4px rgba(34,197,94,.22);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--tb);height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}

#app{position:fixed;inset:0;overflow:hidden;display:flex;justify-content:center;}
.screen-wrap{
  width:100%;max-width:720px;height:100%;position:relative;
  display:flex;flex-direction:column;background:var(--sf);
  box-shadow:0 0 60px rgba(15,23,42,.06);
}
@media(min-width:721px){
  body{background:linear-gradient(135deg,#eef7f0 0%,#e0f2e6 50%,#d5ecdc 100%);}
  [data-theme="dark"] body{background:linear-gradient(135deg,#020617 0%,#0f172a 50%,#020617 100%);}
  .screen-wrap{margin:0 auto;height:100dvh;border-radius:0;}
}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--sf);
  opacity:0;transform:translateY(20px) scale(0.985);
  transition:opacity .4s var(--e),transform .5s var(--e);
  pointer-events:none;will-change:opacity,transform;
}
.screen.active{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;z-index:5;}
@keyframes pageSlideIn{
  from{opacity:.4;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px);scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none;}

#splash{background:#000;z-index:100;display:flex;align-items:center;justify-content:center;opacity:1;transform:none;pointer-events:auto;}
#splash img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease-in-out;}
#splash.show img{opacity:1;}
#splash .brand-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(var(--safe-t) + 40px) 24px calc(var(--safe-b) + 40px);
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 40%,transparent 60%,rgba(0,0,0,.55) 100%);
  pointer-events:none;opacity:0;transition:opacity 1s ease-in-out;
}
#splash.show .brand-overlay{opacity:1;}
#splash .brand-top{text-align:center;color:#fff;}
#splash .brand-top .leaf{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;font-size:34px;
  margin:0 auto 12px;box-shadow:0 12px 30px rgba(0,0,0,.3);
}
#splash .brand-top h1{font-size:34px;font-weight:900;letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.5);}
#splash .brand-top p{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.95;margin-top:6px;}
#splash .brand-bottom{text-align:center;color:#fff;}
#splash .brand-bottom h2{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.25;text-shadow:0 2px 14px rgba(0,0,0,.5);}

.topbar{padding:calc(var(--safe-t) + 14px) 18px 10px;display:flex;align-items:center;gap:12px;background:var(--sf);flex-shrink:0;}
.topbar.bordered{border-bottom:1px solid var(--bd);}
.tb-back{
  width:38px;height:38px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s var(--e);
}
.tb-back:active{transform:scale(.92);background:var(--p-l);border-color:var(--p);}
.tb-back svg{width:18px;height:18px;fill:var(--td);}
.tb-title{flex:1;font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--td);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-actions{display:flex;gap:8px;align-items:center;}
.tb-btn{
  width:38px;height:38px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;transition:all .2s var(--e);position:relative;
}
.tb-btn:active{transform:scale(.92);background:var(--p-l);}
.tb-btn svg{width:18px;height:18px;fill:var(--td);}
.tb-btn.danger{background:var(--danger-soft);border-color:rgba(220,38,38,.3);}
.tb-btn.danger svg{fill:var(--danger);}
.tb-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid #fff;}
.tb-avatar{
  width:44px;height:44px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,var(--p),var(--p-d));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  flex-shrink:0;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.tb-avatar img{width:100%;height:100%;object-fit:cover;}

.weather-card{
  margin:0 18px 14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0f7a34 0%,#0b5f28 60%,#084d20 100%);
  border-radius:var(--r-2xl);padding:20px;color:#fff;box-shadow:var(--sh-brand-lg);
}
.weather-card::before{content:'';position:absolute;top:-30px;right:-20px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.22) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
.weather-card::after{content:'';position:absolute;bottom:-40px;left:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(134,239,172,.25) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
.wc-head{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.wc-profile{display:flex;align-items:center;gap:12px;}
.wc-profile-pic{
  width:48px;height:48px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.25);
  border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:#fff;flex-shrink:0;
}
.wc-profile-pic img{width:100%;height:100%;object-fit:cover;}
.wc-greeting{font-size:12px;font-weight:700;opacity:.9;letter-spacing:.02em;}
.wc-name{font-size:20px;font-weight:900;letter-spacing:-.02em;line-height:1.2;margin-top:2px;}
.wc-name span{color:#a7f3d0;}
.wc-loc{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;opacity:.95;margin-top:8px;}
.wc-loc svg{width:13px;height:13px;fill:#fff;}
.wc-temp{font-size:42px;font-weight:900;letter-spacing:-.04em;line-height:1;margin:10px 0 4px;position:relative;z-index:1;}
.wc-desc{font-size:13px;font-weight:600;opacity:.92;position:relative;z-index:1;}
.wc-range{font-size:12px;font-weight:600;opacity:.85;margin-top:3px;position:relative;z-index:1;}
.wc-icon{position:absolute;top:14px;right:16px;font-size:46px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));animation:bob 3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.qa-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 18px 16px;}
.qa{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;
  border-radius:var(--r-lg);background:var(--sf2);border:1px solid var(--bd);
  transition:all .22s var(--e);position:relative;
}
.qa:active{transform:scale(.94);background:var(--p-l);border-color:var(--p);}
.qa-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.08);}
.qa-lb{font-size:9.5px;font-weight:800;letter-spacing:.02em;color:var(--td);text-transform:uppercase;text-align:center;}
.qa-ic.c1{background:linear-gradient(145deg,#d1fae5,#10b981)}
.qa-ic.c2{background:linear-gradient(145deg,#dbeafe,#2563eb)}
.qa-ic.c3{background:linear-gradient(145deg,#ffedd5,#ea580c)}
.qa-ic.c4{background:linear-gradient(145deg,#ede9fe,#7c3aed)}
.qa-ic.c5{background:linear-gradient(145deg,#fef3c7,#d97706)}

.sec-h{padding:4px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.sec-h h3{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--td);}
.sec-h button{font-size:12px;font-weight:700;color:var(--p);display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--r-p);transition:background .2s var(--e);}
.sec-h button:active{background:var(--p-l);}

.mf-row{display:flex;gap:10px;padding:0 18px 14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.mf-row::-webkit-scrollbar{display:none;}
.mf-card{
  flex:0 0 162px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);
  overflow:hidden;scroll-snap-align:start;transition:transform .22s var(--e);
  box-shadow:var(--sh-sm);cursor:pointer;
}
.mf-card:active{transform:scale(.97);}
.mf-img{height:88px;background:var(--sf2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:42px;}
.mf-img img{width:100%;height:100%;object-fit:cover;}
.mf-body{padding:10px 11px 12px;}
.mf-name{font-size:12.5px;font-weight:800;color:var(--td);letter-spacing:-.01em;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mf-sub{font-size:10.5px;color:var(--tl);font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mf-tag{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:var(--r-p);margin-top:6px;background:var(--p-l);color:var(--p-d);}
.mf-tag.warn{background:var(--warn-soft);color:#92400e}
.mf-tag.ok{background:var(--ok-soft);color:#065f46}
.mf-tag.ready{background:#ffedd5;color:#9a3412}
.mf-days{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:var(--p);margin-top:4px;}
.mf-dot{width:5px;height:5px;border-radius:50%;background:var(--p);animation:lcPulse 1.5s infinite;}
.mf-add{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 8px;text-align:center;border-style:dashed !important;}
.mf-plus{font-size:32px;margin-bottom:6px;}
.mf-lb{font-size:11.5px;font-weight:800;color:var(--p);}

.service-hero{
  margin:0 18px 12px;position:relative;overflow:hidden;border-radius:var(--r-2xl);height:180px;
  display:flex;flex-direction:column;justify-content:flex-end;padding:20px;cursor:pointer;color:#fff;
  transition:transform .25s var(--e);box-shadow:var(--sh-xl);
}
.service-hero:active{transform:scale(.985);}
.sh-bg{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,#0f7a34 0%,#084d20 100%);}
.sh-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.6) 100%);}
.sh-art{position:absolute;top:-14px;right:-14px;width:220px;height:200px;display:flex;align-items:center;justify-content:center;font-size:140px;line-height:1;opacity:.92;transform:rotate(-8deg);z-index:1;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35));}
.sh-content{position:relative;z-index:2;}
.sh-title{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;}
.sh-ic{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(10px);}
.sh-sub{font-size:12.5px;font-weight:600;opacity:.95;margin-top:5px;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.sh-cta{position:absolute;top:18px;right:18px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:var(--r-p);background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.32);}

.hero-weather-col{
  text-align:center;flex-shrink:0;min-width:76px;
  display:flex;flex-direction:column;align-items:center;
  padding:0;
}
.hero-weather-icon{font-size:34px;line-height:1;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));}
.hero-weather-temp{font-size:22px;font-weight:900;margin-top:2px;text-shadow:0 2px 8px rgba(0,0,0,.45);letter-spacing:-.02em;}
.hero-weather-desc{font-size:9.5px;font-weight:700;opacity:.92;margin-top:1px;line-height:1.2;max-width:82px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.4);}

.hero-windmill-inline{
  display:flex;align-items:center;gap:9px;flex-shrink:0;
  padding:7px 12px 7px 10px;border-radius:16px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(6px);
}
.hero-wind-val{font-size:13px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.4);line-height:1;}
.hero-wind-val span{font-size:8.5px;font-weight:700;opacity:.85;margin-left:1px;}
.hero-wind-lb{font-size:7.5px;font-weight:800;opacity:.8;letter-spacing:.1em;margin-top:2px;}

.hero-windmill{width:34px;height:34px;position:relative;flex-shrink:0;}
.hero-windmill .windmill-tower{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:4px;height:20px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.55));border-radius:2px;
}
.hero-windmill .windmill-blades{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:28px;height:28px;animation:windmillSpin 2s linear infinite;
}
.hero-windmill .windmill-blades::before,
.hero-windmill .windmill-blades::after,
.hero-windmill .windmill-blades .blade3{
  content:'';position:absolute;top:50%;left:50%;width:3px;height:13px;
  background:rgba(255,255,255,.92);border-radius:2px;transform-origin:center bottom;
}
.hero-windmill .windmill-blades::before{transform:translate(-50%,-100%) rotate(0deg);}
.hero-windmill .windmill-blades::after{transform:translate(-50%,-100%) rotate(120deg);}
.hero-windmill .windmill-blades .blade3{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-100%) rotate(240deg);
}

.hero-profile-pic{
  width:52px;height:52px;border-radius:50%;overflow:hidden;
  background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.65);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:#fff;flex-shrink:0;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.hero-profile-pic img{width:100%;height:100%;object-fit:cover;}
.hero-name{font-size:17px;font-weight:900;line-height:1.15;margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero-city-line{font-size:11.5px;font-weight:700;opacity:.95;margin-top:4px;display:flex;align-items:flex-start;gap:4px;line-height:1.4;text-shadow:0 1px 6px rgba(0,0,0,.4);}
.hero-divider{height:1px;background:rgba(255,255,255,.22);margin:10px 0;}

.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 14px;}
.service-card{position:relative;overflow:hidden;border-radius:var(--r-xl);height:140px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;cursor:pointer;color:#fff;transition:transform .25s var(--e);box-shadow:var(--sh-md);}
.service-card:active{transform:scale(.97);}
.sc-bg{position:absolute;inset:0;z-index:0;}
.sc-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.6) 100%);}
.sc-art{position:absolute;top:-8px;right:-14px;width:130px;height:130px;display:flex;align-items:center;justify-content:center;font-size:82px;line-height:1;opacity:.88;z-index:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3));}

.sheet-overlay{position:fixed;inset:0;z-index:600;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;}

.si-ico{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#0f7a34,#0b5f28);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 3px 10px rgba(15,122,52,.3);}

.farm-grid-wrap{margin:0 18px 14px;border-radius:var(--r-xl);overflow:hidden;border:1.5px solid var(--bd);background:var(--sf);padding:16px;box-shadow:var(--sh-md);}

.box-estimate-card{margin:0 18px 14px;padding:18px;border-radius:var(--r-xl);background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);border:1.5px solid rgba(234,88,12,.22);box-shadow:0 8px 24px -8px rgba(234,88,12,.3);position:relative;overflow:hidden;}

.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 14px;}

.select-trigger{width:100%;padding:14px 16px;border:1.5px solid var(--bd);border-radius:var(--r-lg);background:var(--sf);font-size:15px;font-weight:500;color:var(--td);outline:none;transition:all .2s var(--e);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;box-shadow:var(--sh-xs);}

.frm{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;}

.fld .inp{width:100%;padding:14px 16px;border:1.5px solid var(--bd);border-radius:var(--r-lg);background:var(--sf);font-size:15px;font-weight:500;color:var(--td);outline:none;transition:all .2s var(--e);-webkit-appearance:none;appearance:none;box-shadow:var(--sh-xs);}

.fld .inp:focus{border-color:var(--p);box-shadow:var(--ring);background:var(--sf);}

.btn{width:100%;padding:15px 20px;border-radius:var(--r-p);font-size:14.5px;font-weight:800;letter-spacing:-.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .22s var(--e);}

.btn-o:active:not(:disabled){background:var(--p-l);}
.btn-s{background:var(--sf);color:var(--td);border:1.5px solid var(--bd);}

.btn-danger{background:var(--danger-soft);color:var(--danger);border:1.5px solid rgba(220,38,38,.25);}
.btn-row{display:flex;gap:10px;padding:0 18px 18px;}
.btn-row .btn{flex:1;}

.success-burst{text-align:center;padding:20px 0;}

.success-burst h2{font-size:22px;font-weight:900;color:var(--td);letter-spacing:-.03em;margin-bottom:8px;}
.success-burst p{font-size:13.5px;color:var(--tl);line-height:1.55;margin-bottom:14px;}

.batch-result{padding:18px;border-radius:var(--r-xl);margin:0 0 16px;background:linear-gradient(135deg,#e6f5eb 0%,#d1fae5 100%);border:1.5px solid rgba(15,122,52,.18);text-align:left;box-shadow:var(--sh-md);}
[data-theme="dark"] .batch-result{background:linear-gradient(135deg,#064e3b 0%,#065f46 100%);border-color:rgba(34,197,94,.25);}
.br-lb{font-size:10.5px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.br-num{font-family:'SF Mono','Roboto Mono',monospace;font-size:16px;font-weight:900;color:var(--p-d);letter-spacing:.02em;word-break:break-all;margin-bottom:12px;}

.br-row:last-child{border-bottom:none;}
.br-row span:first-child{color:var(--p);font-weight:700;}
.br-row span:last-child{color:var(--td);font-weight:800;text-align:right;}
[data-theme="dark"] .br-row span:last-child{color:#86efac;}

.details-toggle{width:100%;padding:15px;border-radius:var(--r-lg);background:var(--sf2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:var(--td);margin-bottom:8px;transition:all .2s var(--e);}

.knowledge-block{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);padding:15px;margin-bottom:10px;box-shadow:var(--sh-xs);}
.knowledge-block h4{font-size:12.5px;font-weight:900;color:var(--td);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.knowledge-block p{font-size:12.5px;color:var(--tb);line-height:1.55;font-weight:500;}
.knowledge-block ul{list-style:none;padding:0;margin-top:6px;}
.knowledge-block ul li{font-size:12px;color:var(--tb);font-weight:600;padding:5px 0;padding-left:16px;position:relative;line-height:1.45;}
.knowledge-block ul li::before{content:'●';color:var(--p);font-size:8px;position:absolute;left:2px;top:8px;}

.info-table{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-xs);}
.info-row{display:flex;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--bd);font-size:12.5px;}
.info-row:last-child{border-bottom:none;}
.ir-k{color:var(--tl);font-weight:700;flex-shrink:0;}
.ir-v{color:var(--td);font-weight:800;text-align:right;word-break:break-word;max-width:60%;}

.detail-hero{height:180px;background:var(--sf2);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:80px;}
.detail-hero img{width:100%;height:100%;object-fit:cover;}
.detail-body{padding:18px 18px 24px;}
.detail-body h1{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--td);margin-bottom:6px;}
.d-sc{font-size:13px;color:var(--tl);font-weight:600;margin-bottom:12px;}

.batch-num-box{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#e6f5eb 0%,#d1fae5 100%);border:1px solid rgba(15,122,52,.18);border-radius:var(--r-lg);margin-bottom:14px;}
[data-theme="dark"] .batch-num-box{background:linear-gradient(135deg,#064e3b,#065f46);border-color:rgba(34,197,94,.25);}
.bn-lb{font-size:10px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.05em;}
.bn-v{font-family:'SF Mono','Roboto Mono',monospace;font-size:13px;font-weight:800;color:var(--p-d);letter-spacing:.02em;margin-top:2px;word-break:break-all;}
.bn-est{font-size:11px;font-weight:800;color:#9a3412;background:#fef3c7;padding:3px 9px;border-radius:var(--r-p);margin-left:8px;display:inline-block;}
[data-theme="dark"] .bn-est{background:#422006;color:#fbbf24;}

.d-section{margin-bottom:16px;}
.d-section h3{font-size:12.5px;font-weight:900;color:var(--td);letter-spacing:-.01em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.d-section h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent);}

.timeline-stage{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:var(--r);background:var(--sf2);border:1px solid var(--bd);margin-bottom:6px;}
.ts-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;background:var(--bd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px;}
.timeline-stage.done .ts-dot{background:var(--p);}
.timeline-stage.active{background:var(--p-ll);border-color:var(--p);}
.timeline-stage.active .ts-dot{background:var(--p);box-shadow:0 0 0 4px rgba(15,122,52,.15);}
.ts-lb{font-size:12.5px;font-weight:700;color:var(--td);text-transform:capitalize;}
.timeline-stage.done .ts-lb{color:var(--p-d);}
.ts-dur{font-size:10.5px;color:var(--tl);font-weight:600;margin-top:2px;}

.schedule-row{display:flex;justify-content:space-between;gap:10px;padding:11px 13px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:6px;}
.sr-left{flex:1;min-width:0;}
.sr-title{font-size:12.5px;font-weight:800;color:var(--td);}
.sr-sub{font-size:10.5px;color:var(--tl);font-weight:600;margin-top:2px;line-height:1.4;}
.sr-right{text-align:right;flex-shrink:0;max-width:45%;}
.sr-rate{font-size:12.5px;font-weight:900;color:var(--p-d);}
.sr-time{font-size:10px;color:var(--tl);font-weight:700;margin-top:2px;}

.harvest-box{margin:0 18px 14px;padding:18px;border-radius:var(--r-xl);background:linear-gradient(135deg,#ffedd5 0%,#fed7aa 100%);border:1.5px solid rgba(234,88,12,.18);box-shadow:var(--sh-md);}
[data-theme="dark"] .harvest-box{background:linear-gradient(135deg,#422006 0%,#78350f 100%);border-color:rgba(251,191,36,.3);}
.harvest-box h4{font-size:13px;font-weight:900;color:#9a3412;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
[data-theme="dark"] .harvest-box h4{color:#fb923c;}
.harvest-input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.harvest-input-box{background:var(--sf);border:1.5px solid rgba(234,88,12,.22);border-radius:var(--r-lg);padding:14px;text-align:center;}
.harvest-input-box label{display:block;font-size:10.5px;font-weight:800;color:#9a3412;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
[data-theme="dark"] .harvest-input-box label{color:#fb923c;}
.harvest-input-box input{width:100%;border:none;background:none;outline:none;text-align:center;font-size:26px;font-weight:900;color:var(--td);letter-spacing:-.03em;}
.hib-unit{font-size:10.5px;color:#9a3412;font-weight:800;margin-top:4px;letter-spacing:.03em;}
[data-theme="dark"] .hib-unit{color:#fb923c;}

.compare-card{margin:0 18px 14px;padding:16px;border-radius:var(--r-lg);background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh-sm);}
.compare-card h4{font-size:12px;font-weight:900;color:var(--td);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.compare-bar-row{margin-bottom:10px;}
.cbr-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--tb);margin-bottom:4px;}
.cbr-top span:first-child{color:var(--tl);font-weight:700;}
.compare-bar-track{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;}
.compare-bar-fill{height:100%;border-radius:5px;transition:width .8s var(--e);}
.compare-bar-fill.expected{background:linear-gradient(90deg,#86efac,#16a34a);}
.compare-bar-fill.actual{background:linear-gradient(90deg,#fdba74,#ea580c);}

.info-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);margin-bottom:8px;cursor:pointer;transition:all .2s var(--e);box-shadow:var(--sh-xs);}
.info-card:active{transform:scale(.98);background:var(--p-l);border-color:var(--p);}
.info-card .ic-ico{width:44px;height:44px;border-radius:12px;background:var(--p-l);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.info-card .ic-tx{flex:1;min-width:0;}
.info-card .ic-title{font-size:13.5px;font-weight:800;color:var(--td);}
.info-card .ic-sub{font-size:11px;color:var(--tl);font-weight:600;margin-top:2px;}
.info-card .ic-arrow{width:24px;height:24px;color:var(--tm);display:flex;align-items:center;justify-content:center;}
.info-card .ic-arrow svg{width:16px;height:16px;fill:currentColor;}

   IMPRESSIVE FARM SETUP UI
   ============================================================ */
.farm-setup-card{

/* ============================================================
   SUN ARC / WINDMILL / HUMIDITY
   ============================================================ */
.sun-arc-wrap{margin:0 18px 14px;padding:20px;border-radius:var(--r-xl);background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 100%);border:1.5px solid rgba(234,88,12,.18);box-shadow:var(--sh-md);position:relative;overflow:hidden;}
[data-theme="dark"] .sun-arc-wrap{background:linear-gradient(135deg,#1e293b,#0f172a);border-color:rgba(148,163,184,.2);}
.sun-arc-title{font-size:11.5px;font-weight:800;color:#9a3412;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
[data-theme="dark"] .sun-arc-title{color:#fbbf24;}
.sun-arc-svg{width:100%;height:auto;display:block;}

.windmill-wrap{margin:0 18px 14px;padding:20px;border-radius:var(--r-xl);background:linear-gradient(135deg,#ecfeff 0%,#cffafe 100%);border:1.5px solid rgba(8,145,178,.18);box-shadow:var(--sh-md);display:flex;align-items:center;gap:18px;}
[data-theme="dark"] .windmill-wrap{background:linear-gradient(135deg,#164e63,#0e7490);border-color:rgba(34,211,238,.25);}
.windmill{width:80px;height:80px;position:relative;flex-shrink:0;}
.windmill-tower{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:8px;height:44px;background:linear-gradient(180deg,#94a3b8,#64748b);border-radius:2px;}
.windmill-blades{position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:60px;animation:windmillSpin 2s linear infinite;}
.windmill-blades::before,.windmill-blades::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:28px;background:#0891b2;border-radius:2px;transform-origin:center bottom;}
.windmill-blades::before{transform:translate(-50%,-100%) rotate(0deg);}
.windmill-blades::after{transform:translate(-50%,-100%) rotate(120deg);}
.windmill-blades .blade3{position:absolute;top:50%;left:50%;width:4px;height:28px;background:#0891b2;border-radius:2px;transform-origin:center bottom;transform:translate(-50%,-100%) rotate(240deg);}
@keyframes windmillSpin{from{transform:translateX(-50%) rotate(0deg)}to{transform:translateX(-50%) rotate(360deg)}}
.windmill-info{flex:1;}
.windmill-info .wi-title{font-size:11px;font-weight:800;color:#155e75;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
[data-theme="dark"] .windmill-info .wi-title{color:#67e8f9;}
.windmill-info .wi-val{font-size:28px;font-weight:900;color:#0e7490;letter-spacing:-.03em;line-height:1;}
[data-theme="dark"] .windmill-info .wi-val{color:#22d3ee;}
.windmill-info .wi-unit{font-size:12px;font-weight:800;color:#155e75;margin-top:2px;}
[data-theme="dark"] .windmill-info .wi-unit{color:#67e8f9;}
.windmill-info .wi-sub{font-size:11px;color:#155e75;font-weight:600;margin-top:6px;line-height:1.4;}
[data-theme="dark"] .windmill-info .wi-sub{color:#a5f3fc;}

.humidity-card{margin:0 18px 14px;padding:18px;border-radius:var(--r-xl);background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);border:1.5px solid rgba(37,99,235,.18);box-shadow:var(--sh-md);}
[data-theme="dark"] .humidity-card{background:linear-gradient(135deg,#1e3a8a,#1e40af);border-color:rgba(96,165,250,.3);}
.humidity-title{font-size:11px;font-weight:800;color:#1e40af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
[data-theme="dark"] .humidity-title{color:#93c5fd;}
.humidity-bar{height:14px;border-radius:7px;background:rgba(37,99,235,.15);overflow:hidden;margin-bottom:6px;}
.humidity-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .8s var(--e);}
.humidity-val{font-size:28px;font-weight:900;color:#1e3a8a;letter-spacing:-.03em;line-height:1;}
[data-theme="dark"] .humidity-val{color:#dbeafe;}
.humidity-sub{font-size:11px;color:#1e40af;font-weight:600;margin-top:4px;}
[data-theme="dark"] .humidity-sub{color:#bfdbfe;}

.ma-header{margin:0 18px 14px;padding:20px;border-radius:var(--r-xl);background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);color:#fff;box-shadow:var(--sh-xl);position:relative;overflow:hidden;}
.ma-header::before{content:'';position:absolute;top:-40px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 70%);border-radius:50%;}

.ma-stat .ms-lb{font-size:10.5px;font-weight:800;color:var(--tl);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.ma-stat .ms-v{font-size:22px;font-weight:900;color:var(--td);letter-spacing:-.03em;line-height:1;}
.ma-stat .ms-sub{font-size:11px;color:var(--tl);font-weight:600;margin-top:4px;}

.ma-section{margin:0 18px 14px;padding:16px;border-radius:var(--r-lg);background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh-sm);}
.ma-section h3{font-size:12.5px;font-weight:900;color:var(--td);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}

.ma-bar-row{margin-bottom:10px;}
.ma-bar-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--tb);margin-bottom:4px;}
.ma-bar-top span:first-child{color:var(--tl);font-weight:700;}
.ma-bar-track{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;}
.ma-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#86efac,#16a34a);transition:width .8s var(--e);}

.demand-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-p);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}

.market-board-page{
  background:

.market-tabs{display:flex;gap:6px;padding:8px 18px 12px;overflow-x:auto;scrollbar-width:none;}
.market-tabs::-webkit-scrollbar{display:none}
.market-tab{flex-shrink:0;padding:9px 16px;border-radius:var(--r-p);background:var(--sf);border:1.5px solid var(--bd);font-size:12px;font-weight:800;color:var(--tb);transition:all .2s var(--e);}
.market-tab.active{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 4px 12px -4px var(--p-glow);}

.market-tab-square{

  border:2px solid var(--bd);

}
.market-tab-square:active{transform:scale(.96);}
.market-tab-square.active{background:linear-gradient(135deg,#12903e,#0f7a34);color:#fff;border-color:var(--p);box-shadow:0 8px 20px -6px var(--p-glow);}

.market-card{margin:0 18px 10px;padding:14px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-xl);box-shadow:var(--sh-sm);display:flex;gap:12px;cursor:pointer;transition:all .2s var(--e);}
.market-card:active{transform:scale(.985);box-shadow:var(--sh-md);}
.mc-thumb{width:64px;height:64px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--sf2);box-shadow:0 3px 10px rgba(0,0,0,.06);overflow:hidden;}
.mc-body{flex:1;min-width:0;}
.mc-title{font-size:14px;font-weight:900;color:var(--td);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mc-meta{font-size:11px;color:var(--tl);font-weight:600;margin-top:3px;line-height:1.4;}
.mc-price{display:flex;align-items:baseline;gap:5px;margin-top:6px;}
.mc-price strong{font-size:16px;font-weight:900;letter-spacing:-.02em;color:var(--p-d);}
.mc-price small{font-size:10.5px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.03em;}
.mc-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex-shrink:0;gap:6px;}
.mc-badge{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:var(--r-p);}
.mc-badge.mine{background:#fef3c7;color:#9a3412;}
[data-theme="dark"] .mc-badge.mine{background:#422006;color:#fbbf24;}
.mc-badge.now{background:var(--ok-soft);color:#065f46;}
[data-theme="dark"] .mc-badge.now{background:#064e3b;color:#34d399;}
.mc-badge.later{background:var(--info-soft);color:#1e40af;}
[data-theme="dark"] .mc-badge.later{background:#1e3a8a;color:#93c5fd;}
.mc-badge.pending{background:#fef3c7;color:#9a3412;}
[data-theme="dark"] .mc-badge.pending{background:#422006;color:#fbbf24;}
.mc-badge.available{background:var(--ok-soft);color:#065f46;}
[data-theme="dark"] .mc-badge.available{background:#064e3b;color:#34d399;}
.mc-badge.sold{background:#ede9fe;color:#5b21b6;}
[data-theme="dark"] .mc-badge.sold{background:#4c1d95;color:#c4b5fd;}
.mc-badge.confirm{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;animation:confirmPulse 1.4s infinite;}
@keyframes confirmPulse{0%,100%{box-shadow:0 0 0 0 rgba(234,88,12,.5)}50%{box-shadow:0 0 0 6px rgba(234,88,12,0)}}
.mc-time{font-size:10px;color:var(--tm);font-weight:700;white-space:nowrap;}
.mc-countdown{font-size:11px;font-weight:900;color:#9a3412;font-variant-numeric:tabular-nums;margin-top:4px;display:flex;align-items:center;gap:4px;background:#fef3c7;padding:3px 8px;border-radius:var(--r-p);display:inline-block;}
[data-theme="dark"] .mc-countdown{background:#422006;color:#fbbf24;}
.mc-contact{font-size:10.5px;font-weight:700;color:#065f46;margin-top:3px;display:flex;align-items:center;gap:4px;}
[data-theme="dark"] .mc-contact{color:#34d399;}

.city-chips{display:flex;gap:6px;padding:6px 18px 14px;overflow-x:auto;scrollbar-width:none;}
.city-chips::-webkit-scrollbar{display:none}
.city-chip{flex-shrink:0;padding:8px 14px;border-radius:var(--r-p);background:var(--sf);border:1.5px solid var(--bd);font-size:12px;font-weight:800;color:var(--tb);transition:all .2s var(--e);white-space:nowrap;}
.city-chip.active{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 4px 12px -4px var(--p-glow);}

.harvest-log-row{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:6px;}
.hlr-date{font-size:11.5px;font-weight:800;color:var(--td);flex-shrink:0;min-width:60px;}
.hlr-boxes{font-size:14px;font-weight:900;color:var(--p-d);flex-shrink:0;}
.hlr-note{flex:1;font-size:11px;color:var(--tl);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hlr-del{width:28px;height:28px;border-radius:50%;background:var(--danger-soft);color:var(--danger);font-size:12px;font-weight:900;flex-shrink:0;display:flex;align-items:center;justify-content:center;}

.filter-row{display:flex;gap:8px;padding:8px 18px 12px;overflow-x:auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none}
.filter-pill{flex-shrink:0;padding:8px 14px;border-radius:var(--r-p);background:var(--sf);border:1.5px solid var(--bd);font-size:11.5px;font-weight:800;color:var(--tb);transition:all .2s var(--e);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.filter-pill.active{background:var(--p);color:#fff;border-color:var(--p);}

.trend-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(135deg,#fef3c7,#fde68a);border:1.5px solid rgba(180,83,9,.25);border-radius:var(--r-lg);margin-bottom:8px;}
[data-theme="dark"] .trend-card{background:linear-gradient(135deg,#422006,#78350f);border-color:rgba(251,191,36,.3);}
.trend-ic{width:44px;height:44px;border-radius:14px;background:var(--sf);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.trend-body{flex:1;min-width:0;}
.trend-name{font-size:13px;font-weight:900;color:#92400e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
[data-theme="dark"] .trend-name{color:#fbbf24;}
.trend-market{font-size:10.5px;font-weight:700;color:#b45309;margin-top:2px;}
[data-theme="dark"] .trend-market{color:#fcd34d;}
.trend-price{text-align:right;flex-shrink:0;}
.trend-price strong{display:block;font-size:15px;font-weight:900;color:#7c2d12;letter-spacing:-.02em;}
[data-theme="dark"] .trend-price strong{color:#fef3c7;}
.trend-price small{display:block;font-size:9.5px;font-weight:800;color:#b45309;text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}
[data-theme="dark"] .trend-price small{color:#fcd34d;}

.info-block{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:8px;font-size:12px;line-height:1.5;font-weight:600;color:var(--tb);}
.info-block strong{font-weight:900;color:var(--td);}

.img-upload-section{margin:0 18px 14px;}
.img-upload-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.img-upload-title{font-size:11.5px;font-weight:800;color:var(--tl);text-transform:uppercase;letter-spacing:.05em;}
.img-upload-count{font-size:10.5px;font-weight:800;color:var(--tl);}
.img-upload-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:200px;}
.img-slot{aspect-ratio:1/1;border-radius:12px;overflow:hidden;position:relative;background:var(--sf2);border:2px dashed var(--bd);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.img-slot.filled{border-style:solid;border-color:var(--p);background:#000;}
.img-slot img{width:100%;height:100%;object-fit:cover;}
.img-slot-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tl);font-size:9.5px;font-weight:800;width:100%;height:100%;cursor:pointer;}
.img-slot-add .ic{font-size:24px;}
.img-slot-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,.3);}
.img-slot-remove:active{transform:scale(.9);}

.farm-photo-picker{display:flex;align-items:center;gap:12px;}
.farm-photo-preview{position:relative;height:64px;flex:1;min-width:0;border-radius:10px;overflow:hidden;background:#000;display:none;}
.farm-photo-preview.show{display:block;}
.farm-photo-preview img{width:100%;height:100%;object-fit:cover;}
.farm-photo-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,.3);}

.planting-banner{
  margin:0 18px 12px;padding:12px 14px;
  background:linear-gradient(135deg,#e6f5eb,#d1fae5);
  border:1px solid rgba(15,122,52,.25);
  border-radius:var(--r-lg);
  display:flex;align-items:center;gap:10px;
}
[data-theme="dark"] .planting-banner{
  background:linear-gradient(135deg,#064e3b,#065f46);
  border-color:rgba(34,197,94,.3);
}
.planting-banner .pb-ico{font-size:22px;flex-shrink:0;}
.planting-banner .pb-txt{flex:1;font-size:12px;font-weight:700;color:var(--p-d);line-height:1.4;}
[data-theme="dark"] .planting-banner .pb-txt{color:#86efac;}

.hidden{display:none !important;}

/* ============================================================
   DELIVERY VEHICLES
   ============================================================ */
.delivery-intro{
  margin:0 18px 14px;padding:18px;border-radius:var(--r-xl);
  background:linear-gradient(135deg,#0f7a34 0%,#084d20 100%);
  color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--sh-brand-lg);
}
[data-theme="dark"] .delivery-intro{background:linear-gradient(135deg,#064e3b,#022c22);}
.delivery-intro::before{content:'';position:absolute;top:-30px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 65%);border-radius:50%;pointer-events:none;}
.delivery-intro h2{font-size:19px;font-weight:900;letter-spacing:-.02em;position:relative;z-index:1;display:flex;align-items:center;gap:8px;}
.delivery-intro p{font-size:12px;font-weight:600;opacity:.92;margin-top:6px;line-height:1.5;position:relative;z-index:1;}
.delivery-intro .di-city{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;padding:5px 12px;border-radius:var(--r-p);
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);
  font-size:11px;font-weight:800;letter-spacing:.03em;

}

.delivery-filter-row{
  display:grid;

.delivery-filter-pill{
  display:flex;flex-direction:column;align-items:center;gap:4px;

}
.delivery-filter-pill:active{transform:scale(.94);}
.delivery-filter-pill.active{

  box-shadow:0 6px 16px -4px var(--p-glow);
}

.delivery-filter-pill .dfp-lb{

}

.delivery-filter-pill .dfp-cnt{

.delivery-section-label{

}

}

.delivery-section-label.unavailable{color:var(--tl);}
.delivery-section-label.unavailable .dsl-dot{background:var(--tm);}
.delivery-section-label .dsl-cnt{
  margin-left:auto;padding:2px 8px;border-radius:var(--r-p);

}
.delivery-section-label.available .dsl-cnt{background:var(--ok-soft);color:#065f46;}

.delivery-partner-card{
  margin:0 18px 10px;
  padding:14px;
  background:var(--sf);
  border:1.5px solid var(--bd);
  border-radius:var(--r-xl);
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--sh-sm);
  cursor:pointer;
  transition:all .2s var(--e);
  position:relative;
}
.delivery-partner-card:active{transform:scale(.985);box-shadow:var(--sh-md);}
.delivery-partner-card.available{border-color:rgba(22,163,74,.28);background:linear-gradient(135deg,var(--sf) 0%,#f0fdf4 100%);}
[data-theme="dark"] .delivery-partner-card.available{background:linear-gradient(135deg,var(--sf) 0%,#052e1b 100%);}
.delivery-partner-card.unavailable{opacity:.75;background:var(--sf2);}
.delivery-partner-card.unavailable:active{opacity:.85;}

.dpc-avatar{

}

.dpc-avatar .dpc-dot{
  position:absolute;bottom:0;right:0;
  width:14px;height:14px;border-radius:50%;
  border:2.5px solid var(--sf);
  background:var(--tm);
}
.dpc-avatar .dpc-dot.online{background:var(--ok);box-shadow:0 0 0 2px rgba(22,163,74,.22);}

.dpc-body{flex:1;min-width:0;}
.dpc-name{
  font-size:14.5px;font-weight:900;color:var(--td);
  letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dpc-meta{
  font-size:11px;color:var(--tl);font-weight:600;
  margin-top:3px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.dpc-vehicle-chip{
  display:inline-flex;align-items:center;gap:3px;

  background:var(--sf2);color:var(--tb);
  font-weight:800;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.03em;
}
.dpc-availability{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 7px;border-radius:var(--r-p);
  font-weight:800;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.03em;
}
.dpc-availability.online{background:#d1fae5;color:#065f46;}
.dpc-availability.offline{background:#f1f5f9;color:#475569;}
[data-theme="dark"] .dpc-availability.online{background:#064e3b;color:#34d399;}
[data-theme="dark"] .dpc-availability.offline{background:#1e293b;color:#cbd5e1;}

.dpc-call-btn{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;

  background:linear-gradient(145deg,#22c55e,#15803d);
  color:#fff;
  box-shadow:0 6px 16px -4px rgba(34,197,94,.5);
  transition:transform .2s var(--e);
  text-decoration:none;
}
.dpc-call-btn:active{transform:scale(.9);}
.dpc-call-btn svg{width:18px;height:18px;fill:#fff;}
.dpc-call-btn.disabled{
  background:var(--sf2);color:var(--tm);box-shadow:none;
  pointer-events:none;
}
.dpc-call-btn.disabled svg{fill:var(--tm);}

.delivery-detail-hero{
  margin:0 18px 16px;padding:26px 22px 22px;
  border-radius:var(--r-2xl);
  background:linear-gradient(135deg,#0f7a34 0%,#084d20 100%);

  position:relative;overflow:hidden;
  box-shadow:var(--sh-brand-lg);
}
[data-theme="dark"] .delivery-detail-hero{background:linear-gradient(135deg,#064e3b 0%,#022c22 100%);}
.delivery-detail-hero::before{content:'';position:absolute;top:-50px;right:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.2) 0%,transparent 65%);border-radius:50%;pointer-events:none;}
.ddh-avatar{
  width:88px;height:88px;border-radius:50%;margin:0 auto 14px;
  background:rgba(255,255,255,.22);border:3px solid #fff;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;
  position:relative;z-index:1;
}
.ddh-avatar img{width:100%;height:100%;object-fit:cover;}
.ddh-name{
  font-size:20px;font-weight:900;letter-spacing:-.03em;
  position:relative;z-index:1;
}
.ddh-role{
  font-size:10.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.05em;opacity:.85;margin-top:4px;
  position:relative;z-index:1;
}
.ddh-status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.05em;
  padding:5px 14px;border-radius:var(--r-p);

}

.ddh-status.offline{background:rgba(0,0,0,.28);color:#fff;}

.ddh-call-btn{

  margin:16px auto 0;
  padding:14px 20px;
  border-radius:var(--r-p);
  background:#fff;color:var(--p-d);
  font-size:14px;font-weight:900;
  letter-spacing:.02em;text-decoration:none;

  transition:transform .2s var(--e);

.ddh-call-btn svg{width:18px;height:18px;fill:var(--p-d);}

.delivery-note{
  margin:0 18px 14px;padding:14px 16px;
  border-radius:var(--r-lg);

  border:1px solid rgba(180,83,9,.22);

[data-theme="dark"] .delivery-note svg{fill:#fbbf24;}
[data-theme="dark"] .delivery-note .dn-tx{color:#fcd34d;}

.delivery-gallery{

  padding:0 18px 14px;

.delivery-photo-item{
  position:relative;

.delivery-empty{

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180;
  const dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function vehicleLabel(v) {
  if (v === 'bicycle') return 'Bicycle';
  if (v === 'bike' || v === 'rider' || v === 'motorbike') return 'Bike';
  if (v === 'car') return 'Car';
  if (v === 'truck') return 'Truck';

function vehicleEmoji(v) {
  if (v === 'bicycle') return '🚲';
  if (v === 'bike' || v === 'rider' || v === 'motorbike') return '🏍️';

function partnerDisplayName(p) {
  const fn = (p.firstName || '').trim();
  const ln = (p.lastName || '').trim();
  const full = (fn + ' ' + ln).trim();
  return full || p.name || p.businessName || 'Delivery Partner';
}
function partnerPhone(p) {
  return p.phone || p.phoneNumber || '';
}
function partnerIsAvailable(p) {
  const flag = p.available === true || p.online === true;
  if (!flag) return false;
  const ts = p.availableChangedAt || p.onlineChangedAt || p.updatedAt;
  if (ts) {
    const age = Date.now() - ts;
    if (age > 90 * 60 * 1000) return false;
  }
  return true;
}
function partnerCity(p) {
  return String(p.city || p.town || '').trim();
}
function partnerMatchesCity(p, targetCity, farmerCoords) {
  const pc = partnerCity(p);
  if (pc && targetCity && pc.toLowerCase() === targetCity.toLowerCase()) return true;
  if (p.location && isFinite(p.location.lat) && isFinite(p.location.lng) && farmerCoords && isFinite(farmerCoords.lat)) {
    const dist = haversine(farmerCoords.lat, farmerCoords.lng, p.location.lat, p.location.lng);
    return dist <= 40000;
  }
  if (!pc && !(p.location && p.location.lat)) return true;
  return false;
}
function partnerVehiclePhotos(p) {
  const type = p.vehicleType || '';
  const photos = [];
  if (type === 'bicycle') {
    if (p.vehiclePhoto) photos.push({ label: 'Bicycle', url: p.vehiclePhoto });
    if (p.profileUrl)    photos.push({ label: 'Partner', url: p.profileUrl });

    if (p.licenseUrl)    photos.push({ label: 'Licence', url: p.licenseUrl });
    if (p.profileUrl)    photos.push({ label: 'Partner', url: p.profileUrl });

function getBusinessesFromProducts() {
  const map = {};
  (S.agroProducts || []).forEach(p => {
    if (p.available === false) return;
    const sid = p.sellerId || ('name_' + String(p.sellerName || 'unknown').toLowerCase());
    if (!map[sid]) {
      map[sid] = {
        id: sid,
        name: p.sellerName || 'Agro Dealer',
        phone: p.sellerPhone || '',
        logo: p.sellerLogo || '',
        city: p.city || '',
        products: []
      };
    }
    map[sid].products.push(p);
    if (!map[sid].phone && p.sellerPhone) map[sid].phone = p.sellerPhone;
    if (!map[sid].logo && p.sellerLogo) map[sid].logo = p.sellerLogo;
    if (!map[sid].city && p.city) map[sid].city = p.city;
  });
  const arr = Object.values(map);
  arr.sort((a, b) => b.products.length - a.products.length);
  return arr;
}

function startFarmsListener() {
  if (!S.user) return;
  if (S.farmsUnsub) S.farmsUnsub();
  S.farmsUnsub = onValue(ref(db, `users/${S.user.uid}/farms`), (snap) => {
    const data = snap.val() || {};
    const arr = Object.entries(data).map(([id, v]) => ({ id, ...v }));
    arr.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.farms = arr;
    if (S.currentFarmId && !arr.find(f => f.id === S.currentFarmId)) {
      S.currentFarmId = arr[0]?.id || null;
    }
    if (!S.currentFarmId && arr.length) {
      S.currentFarmId = arr[0].id;
    }
    if (['farm-picker', 'farm'].includes(S.screen)) route();
  });
}

async function ensureFarmAsync() {
  if (S.currentFarmId && S.farms.find(f => f.id === S.currentFarmId)) return S.currentFarmId;
  if (S.farms.length) {
    S.currentFarmId = S.farms[0].id;
    try { await update(ref(db, 'users/' + S.user.uid), { currentFarmId: S.currentFarmId }); } catch (e) {}
    return S.currentFarmId;
  }
  const newRef = push(ref(db, `users/${S.user.uid}/farms`));
  const farm = { name: 'My Farm', city: S.weatherCity || S.userLocation || 'Lusaka', createdAt: nowMs() };
  await set(newRef, farm);
  S.currentFarmId = newRef.key;
  try { await update(ref(db, 'users/' + S.user.uid), { currentFarmId: S.currentFarmId }); } catch (e) {}
  S.farms.push({ id: newRef.key, ...farm });
  return S.currentFarmId;
}

async function migrateLegacyBatches() {
  if (!S.user || !S.farms.length) return;
  const farmId = S.farms[0].id;
  const legacy = S.myBatches.filter(b => !b.farmId);
  for (const b of legacy) {
    try {
      await update(ref(db, 'batches/' + b.id), { farmId });
      b.farmId = farmId;
    } catch (e) {}
  }
}

window.openFarmPhotoUpload = (context) => {
  if (!window.cloudinary || !window.cloudinary.createUploadWidget) {

  try {
    const widget = window.cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      sources: ['local', 'camera', 'url'],
      multiple: false,
      maxFiles: 1,
      cropping: true,
      croppingAspectRatio: 16/9,
      folder: 'agricare/farms',
      resourceType: 'image',
      clientAllowedFormats: ['jpg','jpeg','png','webp'],
      maxFileSize: 8000000
    }, (error, result) => {
      if (error) { console.warn('farm upload', error); toast('Upload failed'); return; }
      if (result && result.event === 'success') {
        S.tempFarmPhoto = result.info.secure_url;
        const prefix = context === 'edit' ? 'ef' : 'cf';

        if (img) img.src = S.tempFarmPhoto;

    widget.open();
  } catch (e) { console.warn('farm upload init', e); toast('Upload unavailable'); }
};

window.doDeleteFarm = async (farmId) => {
  if (!farmId) return;
  showLoader('Deleting farm…', 'Removing all batches & listings');
  try {
    const batchesToDelete = (S.myBatches || []).filter(b => b.farmId === farmId);
    for (const b of batchesToDelete) {
      const listing = getActiveListingForBatch(b.id);
      if (listing) {
        try { await update(ref(db, 'marketListings/' + listing.id), { status:'removed', availabilityStatus:'removed', removedAt: nowMs() }); } catch(e) {}
      }
      try { await remove(ref(db, 'batches/' + b.id)); } catch (e) {}
    }
    await remove(ref(db, `users/${S.user.uid}/farms/${farmId}`));
    S.myBatches = (S.myBatches || []).filter(b => b.farmId !== farmId);
    S.farms = (S.farms || []).filter(f => f.id !== farmId);
    S.currentFarmId = S.farms[0]?.id || null;
    try {
      if (S.currentFarmId) await update(ref(db, 'users/' + S.user.uid), { currentFarmId: S.currentFarmId });
      else await update(ref(db, 'users/' + S.user.uid), { currentFarmId: null });
    } catch (e) {}
    hideLoader();
    closeModal();
    toast('Farm & batches deleted');
    if (S.farms.length) showScreen('farm');
    else showScreen('farm-picker');
  } catch (e) {
    hideLoader();
    toast('Failed: ' + (e.message || e));
  }
};

function gradFor(str) {
  let h = 0;
  for (let i = 0; i < (str||'').length; i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return GRADS[h % GRADS.length];
}

/* ============================================================
   METRIC / UNIT SYSTEM
   ============================================================ */
function getHarvestUnit(cropName, category) {
  const n = String(cropName || '').toLowerCase();
  const cat = String(category || '').toLowerCase();

  if (cat.includes('poultry')) {
    if (n.includes('layer') || n.includes('hen')) {
      return { unit: 'trays', unitLabel: 'trays (30 eggs)', perUnit: 30, note: '~300 eggs per bird per year' };
    }
    return { unit: 'birds', unitLabel: 'birds', perUnit: 1, note: 'ready for market' };
  }
  if (cat.includes('livestock')) {
    if (n.includes('rabbit')) return { unit: 'head', unitLabel: 'head (rabbits)', perUnit: 1, note: '~2.5 kg meat per rabbit' };
    return { unit: 'head', unitLabel: 'head (animals)', perUnit: 1, note: 'per animal' };
  }
  if (cat.includes('fisher')) {
    return { unit: 'kg', unitLabel: 'kg (fresh weight)', perUnit: 1, note: 'fresh weight' };
  }

  if (n.includes('tomato')) return { unit: 'boxes', unitLabel: 'boxes (20 kg)', perUnit: 20, note: '20 kg per box' };
  if (n.includes('maize') || n.includes('corn')) return { unit: 'bags', unitLabel: 'bags (50 kg)', perUnit: 50, note: '50 kg per bag' };
  if (n.includes('groundnut') || n.includes('peanut')) return { unit: 'bags', unitLabel: 'bags (50 kg)', perUnit: 50, note: '50 kg per bag' };
  if (n.includes('green bean')) return { unit: 'crates', unitLabel: 'crates (10 kg)', perUnit: 10, note: '10 kg per crate' };
  if (n.includes('bean')) return { unit: 'bags', unitLabel: 'bags (50 kg)', perUnit: 50, note: '50 kg per bag' };
  if (n.includes('rice')) return { unit: 'bags', unitLabel: 'bags (50 kg)', perUnit: 50, note: '50 kg per bag' };
  if (n.includes('soy')) return { unit: 'bags', unitLabel: 'bags (50 kg)', perUnit: 50, note: '50 kg per bag' };
  if (n.includes('wheat')) return { unit: 'bags', unitLabel: 'bags (50 kg)', perUnit: 50, note: '50 kg per bag' };
  if (n.includes('millet') || n.includes('sorghum')) return { unit: 'bags', unitLabel: 'bags (50 kg)', perUnit: 50, note: '50 kg per bag' };

/* ============================================================
   HARVEST ESTIMATION
   ============================================================ */
const ESTIMATION = {
  crop: {
    tomato: { mid: 30000, low: 25000, high: 40000 },
    maize: { mid: 5000, low: 3000, high: 7000 },
    default: { mid: 15000, low: 10000, high: 20000 }
  },
  livestock: {
    cattle: { meatPerHead: 200, low: 150, high: 250 },
    goat: { meatPerHead: 20, low: 15, high: 25 },
    pig: { meatPerHead: 70, low: 55, high: 85 },
    sheep: { meatPerHead: 25, low: 18, high: 32 },
    rabbit: { meatPerHead: 2.5, low: 2, high: 3 },
    default: { meatPerHead: 40, low: 30, high: 50 }
  },
  poultry: {
    broiler: { meatPerBird: 2, low: 1.5, high: 2.5 },
    layer: { eggsPerBird: 300, low: 250, high: 350 },
    default: { meatPerBird: 2, low: 1.5, high: 2.5 }
  },
  fisheries: {
    tilapia: { kgPerM2: 5, low: 3, high: 7 },
    catfish: { kgPerM2: 8, low: 5, high: 11 },
    default: { kgPerM2: 5, low: 3, high: 7 }
  }
};

function estimateHarvest(category, lengthM, widthM, cropName, animalCount) {
  const cat = String(category || 'Crop').toLowerCase();
  const name = String(cropName || '').toLowerCase();
  const unitInfo = getHarvestUnit(cropName, category);

  if (cat.includes('livestock') || cat.includes('poultry')) {
    const count = parseInt(animalCount) || 0;
    if (cat.includes('poultry')) {
      if (name.includes('layer') || name.includes('hen')) {
        const eggs = count * 300;
        return {
          quantity: Math.max(1, Math.round(eggs/30)),
          low: Math.max(1, Math.round(count*250/30)),
          high: Math.max(1, Math.round(count*350/30)),
          totalKg: eggs * 0.06,
          unit: 'trays',
          unitLabel: 'trays (30 eggs)',
          note: '~300 eggs per bird per year'
        };
      }
      return {
        quantity: count, low: count, high: count,
        totalKg: count * 2,
        unit: 'birds', unitLabel: 'birds',
        note: 'ready for market'
      };
    }
    let e;
    if (name.includes('cattle') || name.includes('cow')) e = ESTIMATION.livestock.cattle;
    else if (name.includes('goat')) e = ESTIMATION.livestock.goat;
    else if (name.includes('pig')) e = ESTIMATION.livestock.pig;
    else if (name.includes('sheep')) e = ESTIMATION.livestock.sheep;
    else if (name.includes('rabbit')) e = ESTIMATION.livestock.rabbit;
    else e = ESTIMATION.livestock.default;
    const totalKg = count * e.meatPerHead;
    return {
      quantity: count, low: count, high: count, totalKg,
      unit: 'head', unitLabel: 'head (animals)',
      note: `~${e.meatPerHead} kg meat per animal`
    };
  }

  if (cat.includes('fisher')) {
    const m2 = (parseFloat(lengthM)||0) * (parseFloat(widthM)||0);
    const key = name.includes('catfish') ? 'catfish' : 'tilapia';
    const e = ESTIMATION.fisheries[key];
    const totalKg = m2 * e.kgPerM2;
    return {
      quantity: Math.max(1, Math.round(totalKg)),
      low: Math.max(1, Math.round(m2*e.low)),
      high: Math.max(1, Math.round(m2*e.high)),
      totalKg,
      unit: 'kg', unitLabel: 'kg (fresh weight)',
      note: `~${e.kgPerM2} kg per m² of pond`
    };
  }

  const m2 = (parseFloat(lengthM)||0) * (parseFloat(widthM)||0);
  const ha = m2 / 10000;
  const key = name.includes('tomato') ? 'tomato' : name.includes('maize') ? 'maize' : 'default';
  const e = ESTIMATION.crop[key];
  const totalKg = ha * e.mid;
  const perUnit = unitInfo.perUnit || 1;
  return {
    quantity: Math.max(1, Math.round(totalKg / perUnit)),
    low: Math.max(1, Math.round(ha * e.low / perUnit)),
    high: Math.max(1, Math.round(ha * e.high / perUnit)),
    totalKg,
    unit: unitInfo.unit,
    unitLabel: unitInfo.unitLabel,
    note: unitInfo.note
  };
}
function computeArea(length, width) {
  const L = parseFloat(length) || 0, W = parseFloat(width) || 0;
  const m2 = L * W;
  return { m2, ha: m2/10000 };
}

/* ============================================================
   BATCH NUMBER
   ============================================================ */
async function generateBatchNumber() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const dateKey = `${y}_${m}_${d}`;
  let seq = 1;
  try {
    const snap = await get(ref(db, 'batches'));
    if (snap.exists()) {
      const all = snap.val() || {};
      let maxToday = 0;
      Object.values(all).forEach(b => {
        if (b && b.batchDateKey === dateKey) {
          const n = parseInt(b.batchSeq || 0, 10);
          if (n > maxToday) maxToday = n;
        }
      });
      seq = maxToday + 1;
    }
  } catch (e) {}
  return { batchNumber: `BATCH-${String(seq).padStart(3,'0')}_${dateKey}`, batchSeq: seq, batchDateKey: dateKey };
}

async function loadWeatherByCoords(lat, lng) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`;
    const r = await fetch(url);
    const j = await r.json();
    return {
      temp: Math.round(j.current.temperature_2m),
      hum: j.current.relative_humidity_2m,
      wind: Math.round(j.current.wind_speed_10m),
      code: j.current.weather_code,
      isDay: j.current.is_day === 1,
      hi: Math.round(j.daily.temperature_2m_max[0]),
      lo: Math.round(j.daily.temperature_2m_min[0]),
      daily: j.daily.time.map((d,i) => ({
        day: new Date(d).toLocaleDateString('en-GB', { weekday:'short' }),
        hi: Math.round(j.daily.temperature_2m_max[i]),
        lo: Math.round(j.daily.temperature_2m_min[i]),
        code: j.daily.weather_code[i]
      }))
    };
  } catch (e) { return null; }
}
function weatherIconFor(code, isDay) {
  if (code === 0) return isDay ? '☀️' : '🌙';
  if (code === 1) return isDay ? '🌤️' : '🌙';
  if (code === 2) return isDay ? '⛅' : '☁️';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 55) return '🌦️';
  if (code <= 65) return '🌧️';
  if (code <= 77) return '🌨️';
  if (code <= 82) return '🌧️';
  return '⛈️';
}
function weatherDescFor(code) {
  if (code === 0) return 'Clear sky';
  if (code === 1) return 'Mainly clear';
  if (code === 2) return 'Partly cloudy';
  if (code === 3) return 'Overcast';
  if (code <= 48) return 'Foggy';
  if (code <= 55) return 'Drizzle';
  if (code <= 65) return 'Rain';
  if (code <= 77) return 'Snow';
  if (code <= 82) return 'Rain showers';
  return 'Thunderstorm';
}
async function reverseGeocodeCity(lat, lng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=12&accept-language=en`;
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return null;
    const j = await r.json();
    const a = j.address || {};
    return { city: a.city || a.town || a.village || a.municipality || a.county || a.state_district || '', country: a.country || '' };
  } catch (e) { return null; }
}
async function detectUserCityAndWeather(force) {
  if (!navigator.geolocation) {
    S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
    S.weatherCity = S.userLocation;
    return;
  }
  return new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      S.userCoords = { lat, lng };
      const place = await reverseGeocodeCity(lat, lng);
      if (place && place.city) { S.weatherCity = place.city; S.userLocation = place.city; }
      S.weather = await loadWeatherByCoords(lat, lng);
      if (S.screen === 'home') route();
      if (S.screen === 'delivery') route();
      resolve();
    }, async () => {
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if (S.screen === 'home') route();
      if (S.screen === 'delivery') route();
      resolve();
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 300000 });
  });
}

function buildScreen(id) {
  const wrap = document.querySelector('.screen-wrap');
  let el = document.getElementById('screen-' + id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'screen';
    el.id = 'screen-' + id;
    wrap.appendChild(el);
  }
  return el;
}

function showScreen(id, data = {}, pushHistory = true) {
  S.screenData = data || {};
  const target = buildScreen(id);
  if (activeScreenEl && activeScreenEl !== target) activeScreenEl.classList.remove('active');
  void target.offsetWidth;
  target.classList.add('active');
  activeScreenEl = target;
  S.screen = id;
  _suppressContentAnim = true;
  route();
  _suppressContentAnim = false;
  if (pushHistory) {
    try {
      history.pushState({ screen:id, data }, '', '#' + id);
    } catch (e) {}
  } else {
    try {
      history.replaceState({ screen:id, data }, '', '#' + id);
    } catch (e) {}
  }
  const sc = target.querySelector('.scroll');
  if (sc) sc.scrollTop = 0;
  if (id === 'weather-detail') startWeatherClock();
  if (id === 'marketplace' || id === 'my-posts') startCountdownTicker();
}

            group: v.group || category || '', category, subgroup: subgroup || '',
            enterpriseType: v.enterpriseType || category || 'Crop',
            icon: pickIcon(v.name), grad: gradFor(v.name),
            stages: v.stages || [], indicativeDuration: v.indicativeDuration || '',
            managementNotes: v.managementNotes || '', risks: v.risks || [],
            harvestSignal: v.harvestSignal || '', outputUnits: v.outputUnits || [],
            systems: v.systems || []
          });
        }
      });
    };
    if (data.crops?.fieldCrops) push(data.crops.fieldCrops, 'Field Crops', 'cereals');
    if (data.crops?.pulses) push(data.crops.pulses, 'Pulses', 'legumes');
    if (data.crops?.vegetables) push(data.crops.vegetables, 'Vegetables', 'vegetables');
    if (data.crops?.fruits) push(data.crops.fruits, 'Fruits', 'fruits');
    if (data.livestock) push(data.livestock, 'Livestock', 'livestock');
    if (data.poultry) push(data.poultry, 'Poultry', 'poultry');
    if (data.fisheries?.aquaculture) push(data.fisheries.aquaculture, 'Fisheries', 'aquaculture');
    if (data.fisheries?.capture) push(data.fisheries.capture, 'Fisheries', 'capture');
    S.catalogue = cat;
    S.varieties = data.varieties || {};
    S.cropSpacing = data.cropSpacing || {};
    S.fertilizerSchedules = data.fertilizerSchedules || {};
    S.soilTypes = data.soilTypes || [];
    S.irrigationTypes = data.irrigationTypes || [];
    S.detailedStages = data.detailedStages || {};
    return true;
  } catch (e) { console.warn('agri', e); return false; }
}

/* ============================================================
   LOAD USER DATA
   ============================================================ */
async function loadUserData(uid) {
  const out = { profile:null, activities:[], listings:[], following:{}, batches:[] };
  try {
    const p = await get(ref(db, 'users/' + uid));
    if (p.exists()) {
      out.profile = p.val();
      if (out.profile.following) out.following = out.profile.following;
    }
    const a = await get(ref(db, 'farmActivities'));
    if (a.exists()) {
      Object.entries(a.val()).forEach(([k,v]) => {
        if (v && v.owner_user_id === uid) out.activities.push({ id:k, ...v });
      });
    }
    const l = await get(ref(db, 'marketListings'));
    if (l.exists()) {
      Object.entries(l.val()).forEach(([k,v]) => {
        if (v && v.seller_id === uid) out.listings.push({ id:k, ...v });
      });
    }
    const b = await get(ref(db, 'batches'));
    if (b.exists()) {
      Object.entries(b.val()).forEach(([k,v]) => {
        if (v && v.ownerId === uid) out.batches.push({ id:k, ...v });
      });
      out.batches.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    }
  } catch (e) { console.warn('loadUserData', e); }
  return out;
}

async function loadMarketplace() {
  const out = [];
  try {
    const l = await get(ref(db, 'marketListings'));
    if (l.exists()) {
      Object.entries(l.val()).forEach(([k,v]) => { if (v) out.push({ id:k, ...v }); });
    }
  } catch (e) {}
  return out.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
}

function startAllBatchesListener() {
  if (S.allBatchesUnsub) S.allBatchesUnsub();
  S.allBatchesUnsub = onValue(ref(db, 'batches'), (snap) => {
    const data = snap.val() || {};
    const arr = Object.entries(data).map(([id,v]) => ({ id, ...v }));
    arr.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    S.allFarmersBatches = arr;
    if (S.user) S.myBatches = arr.filter(b => b.ownerId === S.user.uid);
    if (['marketplace','market-analysis','farmers-by-city','selected-crop-analysis','preview-market','farm-analysis','farm-picker','farm','batch-detail'].includes(S.screen)) route();
  });
}

function startMarketplaceListener() {
  if (S.marketplaceUnsub) S.marketplaceUnsub();
  S.marketplaceUnsub = onValue(ref(db, 'marketListings'), (snap) => {
    const data = snap.val() || {};
    const arr = Object.entries(data).map(([id,v]) => ({ id, ...v })).filter(l => !!l);
    arr.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    S.marketplace = arr;
    if (S.user) {
      S.myListings = arr.filter(l =>
        l.seller_id === S.user.uid &&
        l.status !== 'removed' &&
        l.availabilityStatus !== 'removed' &&
        l.availabilityStatus !== 'sold'
      );
    }
    if (['marketplace','my-posts','preview-market','market-analysis','batch-detail'].includes(S.screen)) route();
  });
}

function startAgroProductsListener() {
  if (S.agroProductsUnsub) S.agroProductsUnsub();
  S.agroProductsUnsub = onValue(ref(db, 'agroProducts'), (snap) => {
    const data = snap.val() || {};
    const arr = Object.entries(data).map(([id,v]) => ({ id, ...v }));
    arr.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    S.agroProducts = arr;
    if (['agro-dealers', 'product-detail', 'business-detail'].includes(S.screen)) route();
  });
}

function route() {
  const id = S.screen;

  if (!el) return;

  switch (id) {
    case 'home': el.innerHTML = renderHome(); break;
    case 'farm-picker': el.innerHTML = renderFarmPicker(); break;
    case 'farm': el.innerHTML = renderFarm(); break;
    case 'plant-loader': el.innerHTML = renderPlantLoader(); break;
    case 'plant-step-1': el.innerHTML = renderPlantStep1(); break;
    case 'plant-step-3': el.innerHTML = renderPlantStep3(); break;
    case 'plant-step-4': el.innerHTML = renderPlantStep4(); break;
    case 'plant-confirm': el.innerHTML = renderPlantConfirm(); break;
    case 'plant-success': el.innerHTML = renderPlantSuccess(S.screenData); break;
    case 'batch-detail': el.innerHTML = renderBatchDetail(S.screenData.id, S.screenData.tab); break;
    case 'harvest-record': el.innerHTML = renderHarvestRecord(S.screenData.id); break;
    case 'post-harvest-goods': el.innerHTML = renderPostHarvestGoods(S.screenData.id); break;
    case 'edit-listing': el.innerHTML = renderEditListing(S.screenData.id); break;
    case 'marketplace': el.innerHTML = renderMarketplace(); break;
    case 'my-posts': el.innerHTML = renderMyPosts(); break;
    case 'agro-dealers': el.innerHTML = renderAgroDealers(); break;
    case 'product-detail': el.innerHTML = renderProductDetail(); break;
    case 'business-detail': el.innerHTML = renderBusinessDetail(); break;
    case 'delivery': el.innerHTML = renderDelivery(); break;
    case 'delivery-detail': el.innerHTML = renderDeliveryDetail(S.screenData.id); break;
    case 'profile': el.innerHTML = renderProfile(); break;
    case 'weather-detail': el.innerHTML = renderWeatherDetail(); break;
    case 'market-analysis': el.innerHTML = renderMarketAnalysis(); break;
    case 'farm-analysis': el.innerHTML = renderFarmAnalysis(); break;
    case 'farmers-by-city': el.innerHTML = renderFarmersByCity(); break;
    case 'government': el.innerHTML = renderGovernment(); break;
    case 'selected-crop-analysis': el.innerHTML = renderSelectedCropAnalysis(); break;
    case 'preview-market': el.innerHTML = renderPreviewMarket(); break;
    default: el.innerHTML = renderHome();
  }
  updateNav(id);

  if (!_suppressContentAnim) {
    const sc = el.querySelector('.scroll');
    if (sc) {
      sc.style.animation = 'none';
      void sc.offsetWidth;
      sc.style.animation = 'pageSlideIn 0.38s cubic-bezier(.22,1,.36,1)';
    }
  }
}

function renderFarmHarvest() {
  const farmBatches = currentFarmBatches();
  const ready = farmBatches.filter(b => b.stage === 'harvesting');

  return `

      <div class="empty">

function renderBatchCard(b, mode = 'manage') {
  const crop = S.catalogue.find(c => c.id === b.cropId);
  const ic = crop ? pickIcon(crop.name) : '🌱';
  const grad = crop ? gradFor(crop.name) : gradFor(b.cropName || '');
  const stage = b.stage || 'planted';
  const statusLabel = { planted:'Planted', growing:'Growing', flowering:'Flowering', fruiting:'Fruiting', harvesting:'Ready', harvested:'Finished' }[stage] || stage;
  const actual = b.actualBoxes || 0;
  const unit = unitForBatch(b);
  return `
  <div class="batch-card" onclick="openBatch('${esc(b.id)}','${esc(mode)}')">
    <div class="bc-top">
      <div class="bc-crop-ic" style="background:${grad}">${b.coverUrl ? `<img src="${esc(b.coverUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:18px">` : ic}</div>

        <div class="bc-variety">${esc(b.varietyName || '')}</div>
        <div class="bc-batch-num">${esc(b.batchNumber || '')}</div>
        ${actual ? `<span class="bc-est-boxes">📦 ${actual.toLocaleString()} ${esc(unit)} harvested</span>` : (b.estimatedBoxes ? `<span class="bc-est-boxes">📦 Est. ${b.estimatedBoxes.toLocaleString()} ${esc(unit)}</span>` : '')}

      </div>

  </div>`;
}

/* ============================================================

   ============================================================ */
window.startPlantFlow = async () => {
  if (!S.farms.length || !S.currentFarmId) {
    S.plantingFlowMode = true;
    navTo('farm-picker');
    return;
  }
  S.plantWizard = { step:1, cropId:null, varietyName:null, length:null, width:null, town:null, animalCount:0 };
  showScreen('plant-loader');
  let dots = 0;
  const loaderInterval = setInterval(() => {
    dots = (dots + 1) % 4;
    const el = document.getElementById('plant-loader-dots');
    if (el) el.textContent = '.'.repeat(dots);
  }, 400);
  setTimeout(() => {
    clearInterval(loaderInterval);
    showScreen('plant-step-1');
  }, 3000);
};

function renderPlantStep3() {
  const w = S.plantWizard;
  const crop = S.catalogue.find(c => c.id === w.cropId);
  const isLivestock = crop && (crop.category.includes('Livestock') || crop.category.includes('Poultry'));
  const isFisheries = crop && crop.category.includes('Fisheries');
  const area = computeArea(w.length, w.width);
  const est = (w.length > 0 && w.width > 0) ? estimateHarvest(crop ? crop.category : 'Crop', w.length, w.width, crop ? crop.name : '', w.animalCount) : null;

  if (isLivestock) {
    return `
    <div class="scroll">
      <div class="topbar bordered">
        <button class="tb-back" onclick="showScreen('plant-step-1')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
