function stopOngoingTracking(){
  if(S.ongoingTrackUnsub){ try{ S.ongoingTrackUnsub(); }catch(e){} S.ongoingTrackUnsub = null; }
  if(S.ongoingStatusUnsub){ try{ S.ongoingStatusUnsub(); }catch(e){} S.ongoingStatusUnsub = null; }
  if(S.ongoingRouteRefreshTimer){ clearInterval(S.ongoingRouteRefreshTimer); S.ongoingRouteRefreshTimer = null; }
  S.ongoingTrackDeliveryId = null; S.ongoingTrackStage = null; S.ongoingLastProviderPos = null;
  S.ongoingRouteLastFrom = null; S.ongoingRouteFitted = false; S.ongoingRouteBusy = false;
  if(S.ongoingProviderMarker && S.ongoingMap){ try{ S.ongoingMap.removeLayer(S.ongoingProviderMarker); }catch(e){} }
  if(S.ongoingPickupMarker && S.ongoingMap){ try{ S.ongoingMap.removeLayer(S.ongoingPickupMarker); }catch(e){} }
  if(S.ongoingDropoffMarker && S.ongoingMap){ try{ S.ongoingMap.removeLayer(S.ongoingDropoffMarker); }catch(e){} }
  if(S.ongoingRouteLayer && S.ongoingMap){ try{ S.ongoingMap.removeLayer(S.ongoingRouteLayer); }catch(e){} }
  S.ongoingProviderMarker = null; S.ongoingPickupMarker = null; S.ongoingDropoffMarker = null; S.ongoingRouteLayer = null;
}
function startOngoingTracking(delivery){
  if(S.ongoingTrackDeliveryId === delivery.id && S.ongoingTrackStage === delivery.status) return;
  stopOngoingTracking();
  S.ongoingTrackDeliveryId = delivery.id;
  S.ongoingTrackStage = delivery.status;
  const wrap = document.getElementById('ongoingTrackWrap');
  if(wrap) wrap.classList.add('show');
  if(!S.ongoingMap) initOngoingMap();
  if(!S.ongoingMap) return;
  if(delivery.pickup && isFinite(delivery.pickup.lat)){
    const pickupIcon = L.divIcon({className:'', html:'<div class="ongoing-pickup-leaf"></div>', iconSize:[26,26], iconAnchor:[13,26]});
    S.ongoingPickupMarker = L.marker([delivery.pickup.lat, delivery.pickup.lng], {icon: pickupIcon, zIndexOffset: 500}).addTo(S.ongoingMap);
  }
  if(delivery.dropoff && isFinite(delivery.dropoff.lat)){
    const dropoffIcon = L.divIcon({className:'', html:'<div class="ongoing-drop-leaf"></div>', iconSize:[26,26], iconAnchor:[13,26]});
    S.ongoingDropoffMarker = L.marker([delivery.dropoff.lat, delivery.dropoff.lng], {icon: dropoffIcon, zIndexOffset: 500}).addTo(S.ongoingMap);
  }
  updateOngoingTrackBadge(delivery.status);
  const providerId = delivery.providerId;
  if(providerId){
    S.ongoingTrackUnsub = onValue(ref(db, `users/${providerId}/location`), (snap)=>{
      if(!snap.exists()) return;
      const loc = snap.val();
      if(!loc || !isFinite(loc.lat) || !isFinite(loc.lng)) return;
      updateOngoingProviderMarker(loc.lat, loc.lng, loc.heading || 0);
      maybeRefreshOngoingRoute(loc.lat, loc.lng);
    });
  }
  S.ongoingStatusUnsub = onValue(ref(db, 'deliveryRequests/' + delivery.id), (snap)=>{
    if(!snap.exists()) return;
    const d = snap.val();
    const id = delivery.id;
    const idx = (S.allDeliveries || []).findIndex(x=>x.id === id);
    if(idx >= 0) S.allDeliveries[idx] = {id, ...d};
    updateOngoingTrackBadge(d.status);
    if(S.screen === 'ongoing-deliveries'){
      const cardEl = document.querySelector('.od-card[data-odid="'+id+'"]');
      if(cardEl){
        const statusEl = cardEl.querySelector('.od-status-tag');
        if(statusEl){ statusEl.textContent = (d.status || '').replace(/_/g,' '); statusEl.className = 'od-status-tag ' + d.status; }
      }
    }
    if(d.status !== S.ongoingTrackStage){
      S.ongoingTrackStage = d.status;
      S.ongoingRouteLastFrom = null;
      S.ongoingRouteFitted = false;
      if(S.ongoingLastProviderPos) redrawOngoingRoute(S.ongoingLastProviderPos.lat, S.ongoingLastProviderPos.lng);
    }
    if((d.status === 'delivered' || d.status === 'completed') && !d.farmerRating){
      setTimeout(()=>openRatingModal(d, id), 900);
    }
    if(d.status === 'cancelled'){
      toast('Delivery was cancelled');
      stopOngoingTracking();
      if(wrap) wrap.classList.remove('show');
    }
  });
  S.ongoingRouteRefreshTimer = setInterval(()=>{
    if(S.ongoingLastProviderPos) redrawOngoingRoute(S.ongoingLastProviderPos.lat, S.ongoingLastProviderPos.lng);
  }, 12000);
}
function updateOngoingTrackBadge(status){
  const badge = document.getElementById('ongoingTrackBadge');
  const txt = document.getElementById('ongoingTrackBadgeText');
  if(!badge || !txt) return;
  badge.classList.remove('info','success','cancel');
  let label = 'Tracking provider…';
  if(status === 'accepted'){ label = 'Provider heading to pickup'; badge.classList.add('info'); }
  else if(status === 'arrived'){ label = 'Provider arrived at pickup'; badge.classList.add('success'); }
  else if(status === 'in_progress' || status === 'picked_up'){ label = 'Provider heading to drop-off'; badge.classList.add('info'); }
  else if(status === 'delivered' || status === 'completed'){ label = 'Delivery complete'; badge.classList.add('success'); }
  else if(status === 'cancelled'){ label = 'Delivery cancelled'; badge.classList.add('cancel'); }
  txt.textContent = label;
}
function updateOngoingProviderMarker(lat, lng, heading){
  if(!S.ongoingMap) return;
  S.ongoingLastProviderPos = {lat, lng};
  if(S.ongoingProviderMarker){ S.ongoingProviderMarker.setLatLng([lat, lng]); }
  else {
    const icon = L.divIcon({className:'ongoing-provider-wrap', html:'<div class="ongoing-provider-marker">🚚</div>', iconSize:[46,46], iconAnchor:[23,23]});
    S.ongoingProviderMarker = L.marker([lat, lng], {icon, zIndexOffset: 1000}).addTo(S.ongoingMap);
  }
}
function maybeRefreshOngoingRoute(lat, lng){
  if(!S.ongoingRouteLastFrom){ redrawOngoingRoute(lat, lng); return; }
  const moved = haversineMeters(S.ongoingRouteLastFrom.lat, S.ongoingRouteLastFrom.lng, lat, lng);
  if(moved < 40) return;
  redrawOngoingRoute(lat, lng);
}
async function redrawOngoingRoute(providerLat, providerLng){
  if(S.ongoingRouteBusy) return;
  if(!S.ongoingMap) return;
  S.ongoingRouteBusy = true;
  S.ongoingRouteLastFrom = {lat: providerLat, lng: providerLng};
  const id = S.ongoingTrackDeliveryId;
  const d = (S.allDeliveries || []).find(x=>x.id === id);
  if(!d){ S.ongoingRouteBusy = false; return; }
  let target = null;
  if(d.status === 'accepted' || d.status === 'arrived') target = d.pickup;
  else if(d.status === 'in_progress' || d.status === 'picked_up') target = d.dropoff;
  if(!target || !isFinite(target.lat) || !isFinite(target.lng)){ S.ongoingRouteBusy = false; return; }
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${providerLng},${providerLat};${target.lng},${target.lat}?overview=full&geometries=geojson`;
    const r = await fetch(url);
    const j = await r.json();
    if(!j.routes || !j.routes.length){ S.ongoingRouteBusy = false; return; }
    const coords = j.routes[0].geometry.coordinates.map(([lng, lat])=>[lat, lng]);
    if(S.ongoingRouteLayer) S.ongoingMap.removeLayer(S.ongoingRouteLayer);
    S.ongoingRouteLayer = L.layerGroup().addTo(S.ongoingMap);
    L.polyline(coords, {color:'#ffffff', weight:8, opacity:.95, lineJoin:'round', lineCap:'round'}).addTo(S.ongoingRouteLayer);
    L.polyline(coords, {color:'#0f7a34', weight:4.5, opacity:1, lineJoin:'round', lineCap:'round'}).addTo(S.ongoingRouteLayer);
    if(!S.ongoingRouteFitted){
      S.ongoingMap.fitBounds(L.latLngBounds(coords), {padding:[40,40], maxZoom:16});
      S.ongoingRouteFitted = true;
    }
  } catch(e){ console.warn('ongoing route err', e); }
  finally { S.ongoingRouteBusy = false; }
}

function updateRatingStars(){

  $ratingStarsRow.querySelectorAll('.rating-star').forEach(btn=>{

function openRatingModal(delivery, deliveryId){
  if(!delivery || !deliveryId) return;
  if(delivery.farmerRating) return;
  S.pendingRatingDelivery = { ...delivery, id: deliveryId };
  S.pendingRatingStars = 0;
  updateRatingStars();
  $ratingComment.value = '';
  $ratingProviderName.textContent = `How was ${delivery.providerName || 'your transporter'}?`;
  if(delivery.providerPhoto){ $ratingProviderAvatar.innerHTML = `<img src="${esc(delivery.providerPhoto)}" alt="">`; }

window.openRatingModalById = (id)=>{
  const d = (S.allDeliveries || []).find(x=>x.id === id);
  if(!d) return;
  openRatingModal(d, id);
};
window.closeRatingModal = ()=>{
  $ratingOverlay.classList.remove('open');
  S.pendingRatingDelivery = null;
  S.pendingRatingStars = 0;
};
window.submitDeliveryRating = async ()=>{
  if(!S.pendingRatingDelivery || !S.pendingRatingStars) return;
  const d = S.pendingRatingDelivery;
  const providerId = d.providerId;
  if(!providerId){ closeRatingModal(); return; }
  const stars = S.pendingRatingStars;
  const comment = $ratingComment.value.trim();
  $ratingSubmitBtn.disabled = true;
  $ratingSubmitBtn.textContent = 'Saving…';
  try{
    await update(ref(db, 'deliveryRequests/'+d.id), {
      farmerRating: stars, farmerRatingComment: comment, farmerRatedAt: Date.now()
    });
    const providerRatingRef = push(ref(db, `users/${providerId}/ratingsReceived`));
    await set(providerRatingRef, {
      rating: stars, comment, deliveryId: d.id,
      raterId: S.user.uid,
      raterName: (S.profile.firstName||'') + ' ' + (S.profile.lastName||''),
      createdAt: Date.now()
    });
    const snap = await get(ref(db, `users/${providerId}/ratingsReceived`));
    const ratings = snap.val() || {};
    const vals = Object.values(ratings).map(r=>Number(r.rating)).filter(v=>isFinite(v) && v > 0);
    const avg = vals.length ? vals.reduce((a,b)=>a+b, 0) / vals.length : 0;
    await update(ref(db, `users/${providerId}`), { ratingAverage: Math.round(avg * 10) / 10, ratingCount: vals.length }).catch(()=>{});
    await update(ref(db, 'deliveryRequests/'+d.id), { providerRatingAverage: Math.round(avg * 10) / 10, providerRatingCount: vals.length }).catch(()=>{});
    const idx = (S.allDeliveries||[]).findIndex(x=>x.id === d.id);
    if(idx >= 0){
      S.allDeliveries[idx].farmerRating = stars;
      S.allDeliveries[idx].farmerRatingComment = comment;
      S.allDeliveries[idx].providerRatingAverage = Math.round(avg * 10) / 10;
      S.allDeliveries[idx].providerRatingCount = vals.length;
    }
    toast('Thanks for your feedback! ⭐');
    closeRatingModal();
    if(S.screen === 'ongoing-deliveries') route();
    if(S.screen === 'delivery-history') route();
  }catch(e){
    toast('Could not save rating');
    $ratingSubmitBtn.disabled = false;
    $ratingSubmitBtn.textContent = 'Submit';
  }
};

let delMap = null, delPickupMarker = null, delDropoffMarker = null, delRouteLayer = null;
let delSearchAbort = null, delSearchMode = 'dropoff';
let delPickupLoc = null, delDropoffLoc = null, delRouteInfo = null;
function wireRequestDelivery(){
  setTimeout(async ()=>{
    initDeliveryMap();
    setupDeliverySearch();
    await useCurrentForDelivery('pickup', true);
  }, 250);
}
function initDeliveryMap(){
  const mapEl = document.getElementById('deliveryMap');
  if(!mapEl) return;
  if(delMap){ try{ delMap.remove(); }catch(e){} delMap = null; }
  delMap = L.map('deliveryMap', {zoomControl:false, attributionControl:false}).setView([-15.4167, 28.2833], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, subdomains:'abc'}).addTo(delMap);
  delMap.on('click', (e)=>{
    if(delSearchMode === 'pickup') setDeliveryPoint('pickup', e.latlng.lat, e.latlng.lng);
    else if(delSearchMode === 'dropoff') setDeliveryPoint('dropoff', e.latlng.lat, e.latlng.lng);
  });
  if(S.userCoords) delMap.setView([S.userCoords.lat, S.userCoords.lng], 14);
  if(delPickupLoc) setDeliveryPoint('pickup', delPickupLoc.lat, delPickupLoc.lng, delPickupLoc.label);
  if(delDropoffLoc) setDeliveryPoint('dropoff', delDropoffLoc.lat, delDropoffLoc.lng, delDropoffLoc.label);
  document.getElementById('del-locate-btn')?.addEventListener('click', ()=>{ if(S.userCoords) delMap.setView([S.userCoords.lat, S.userCoords.lng], 16); });
  document.getElementById('del-fit-btn')?.addEventListener('click', fitDeliveryRoute);
}
function setupDeliverySearch(){
  const pickupInput = document.getElementById('del-pickup');
  const dropoffInput = document.getElementById('del-dropoff');
  const pickupRow = document.getElementById('del-pickup-row');
  const dropoffRow = document.getElementById('del-dropoff-row');
  const results = document.getElementById('del-search-results');
  if(!pickupInput || !dropoffInput) return;
  const onFocus = (mode)=>{
    delSearchMode = mode;
    pickupRow?.classList.toggle('active', mode === 'pickup');
    dropoffRow?.classList.toggle('active', mode === 'dropoff');
    const badge = document.getElementById('del-map-badge');
    if(badge) badge.innerHTML = `📍 Tap map or search to set ${mode === 'pickup' ? 'pickup' : 'drop-off'}`;
  };
  pickupInput.addEventListener('focus', ()=>onFocus('pickup'));
  dropoffInput.addEventListener('focus', ()=>onFocus('dropoff'));
  const debounce = (fn, ms)=>{ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };
  const runSearch = async (q, mode)=>{
    if(!q || q.length < 3){ results.classList.remove('open'); return; }
    if(delSearchAbort) delSearchAbort.abort();
    delSearchAbort = new AbortController();
    try{
      let query = q;
      if(S.weatherCity && !q.toLowerCase().includes(S.weatherCity.toLowerCase())) query = q + ', ' + S.weatherCity;
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=10&addressdetails=1&accept-language=en&q=${encodeURIComponent(query)}`;
      const r = await fetch(url, {signal: delSearchAbort.signal});
      const arr = await r.json();
      if(!arr.length){ results.classList.remove('open'); return; }
      results.innerHTML = arr.map((p, i)=>{
        const name = p.name || (p.display_name || '').split(',')[0];
        const dist = S.userCoords ? haversineMeters(S.userCoords.lat, S.userCoords.lng, parseFloat(p.lat), parseFloat(p.lon)) : null;
        return `<button type="button" class="map-search-item" data-idx="${i}">
          <span class="ms-ic">📍</span>
          <span class="ms-body">
            <span class="ms-name">${esc(name)}</span>
            <span class="ms-sub">${esc(p.display_name || '')}</span>
          </span>
          ${dist != null ? `<span class="ms-dist">${dist < 1000 ? Math.round(dist)+' m' : (dist/1000).toFixed(1)+' km'}</span>`:''}
        </button>`;
      }).join('');
      results.classList.add('open');
      results.querySelectorAll('.map-search-item').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const p = arr[parseInt(btn.dataset.idx, 10)];
          if(!p) return;
          setDeliveryPoint(mode, parseFloat(p.lat), parseFloat(p.lon), p.display_name);
          results.classList.remove('open');
        });
      });
    }catch(e){ if(e.name !== 'AbortError') console.warn(e); }
  };
  pickupInput.addEventListener('input', debounce(()=>runSearch(pickupInput.value.trim(), 'pickup'), 320));
  dropoffInput.addEventListener('input', debounce(()=>runSearch(dropoffInput.value.trim(), 'dropoff'), 320));
}
async function setDeliveryPoint(mode, lat, lng, label){
  const place = await reverseGeocodePrecise(lat, lng);
  const finalLabel = label || (place ? place.label : `${lat.toFixed(4)}, ${lng.toFixed(4)}`);
  if(mode === 'pickup'){
    delPickupLoc = {lat, lng, label: finalLabel, address: place?.address || finalLabel};
    const el = document.getElementById('del-pickup');
    if(el) el.value = finalLabel;
    if(delPickupMarker && delMap) delMap.removeLayer(delPickupMarker);
    if(delMap){
      delPickupMarker = L.marker([lat, lng], {icon: L.divIcon({
        className:'', html:'<div style="width:20px;height:20px;border-radius:50%;background:#0f7a34;border:3px solid #fff;box-shadow:0 2px 10px rgba(15,122,52,.5)"></div>',
        iconSize:[20,20], iconAnchor:[10,10]
      })}).addTo(delMap);
    }
  } else {
    delDropoffLoc = {lat, lng, label: finalLabel, address: place?.address || finalLabel};
    const el = document.getElementById('del-dropoff');
    if(el) el.value = finalLabel;
    if(delDropoffMarker && delMap) delMap.removeLayer(delDropoffMarker);
    if(delMap){
      delDropoffMarker = L.marker([lat, lng], {icon: L.divIcon({
        className:'', html:'<div style="width:20px;height:20px;background:#2563eb;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);border-radius:50% 50% 50% 0;transform:rotate(-45deg)"></div>',
        iconSize:[20,20], iconAnchor:[10,20]
      })}).addTo(delMap);
    }
  }
  if(delPickupLoc && delDropoffLoc){
    try{ await fetchDeliveryRoute(); drawStaticRoute(); }catch(e){}
  }
}
window.useCurrentForDelivery = async (mode, silent)=>{
  const input = document.getElementById(mode === 'pickup' ? 'del-pickup' : 'del-dropoff');
  if(input) input.value = 'Locating precisely…';
  if(!navigator.geolocation){ if(!silent) toast('Geolocation not supported'); if(input) input.value=''; return; }
  try{
    const pos = await new Promise((resolve, reject)=>{
      navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
    });
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    S.userCoords = {lat, lng};
    await setDeliveryPoint(mode, lat, lng);
    if(!silent) toast('Precise location set ✓');
  }catch(err){
    if(S.userCoords){ await setDeliveryPoint(mode, S.userCoords.lat, S.userCoords.lng); }
    else { if(input) input.value = ''; if(!silent) toast('Could not get location'); }
  }
};
async function fetchDeliveryRoute(){
  if(!delPickupLoc || !delDropoffLoc) return null;
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${delPickupLoc.lng},${delPickupLoc.lat};${delDropoffLoc.lng},${delDropoffLoc.lat}?overview=full&geometries=geojson`;
    const r = await fetch(url);
    const j = await r.json();
    if(!j.routes || !j.routes.length) return null;
    delRouteInfo = { distance: j.routes[0].distance, duration: j.routes[0].duration };
    return j.routes[0].geometry.coordinates.map(([lng, lat])=>[lat, lng]);
  }catch(e){ return null; }
}
function drawStaticRoute(){
  if(!delMap || !delPickupLoc || !delDropoffLoc) return;
  fetchDeliveryRoute().then(coords=>{
    if(!coords) return;
    if(delRouteLayer) delMap.removeLayer(delRouteLayer);
    delRouteLayer = L.layerGroup().addTo(delMap);
    L.polyline(coords, {color:'#ffffff', weight:8, opacity:.95, lineJoin:'round', lineCap:'round'}).addTo(delRouteLayer);
    L.polyline(coords, {color:'#0f7a34', weight:4.5, opacity:1, lineJoin:'round', lineCap:'round'}).addTo(delRouteLayer);
    const badge = document.getElementById('del-map-badge');
    const distKm = (delRouteInfo.distance/1000).toFixed(1);
    const durMin = Math.round(delRouteInfo.duration/60);
    if(badge) badge.innerHTML = `🛣️ ${distKm} km · ~${durMin} min`;
    delMap.fitBounds(L.latLngBounds(coords), {padding: [30, 30]});
  });
}
function fitDeliveryRoute(){
  if(!delMap) return;
  const pts = [];
  if(delPickupLoc) pts.push([delPickupLoc.lat, delPickupLoc.lng]);
  if(delDropoffLoc) pts.push([delDropoffLoc.lat, delDropoffLoc.lng]);
  if(pts.length === 2) delMap.fitBounds(L.latLngBounds(pts), {padding: [40, 40]});
}
function animateRouteThenShowVehicles(delData, coords){
  if(!delMap){ showVehicleSheet(delData); return; }
  if(delRouteLayer){ try{ delMap.removeLayer(delRouteLayer); }catch(e){} }
  delRouteLayer = L.layerGroup().addTo(delMap);
  const bgLine = L.polyline([], {color:'#ffffff', weight:9, opacity:.95, lineJoin:'round', lineCap:'round'}).addTo(delRouteLayer);
  const fgLine = L.polyline([], {color:'#0f7a34', weight:5, opacity:1, lineJoin:'round', lineCap:'round'}).addTo(delRouteLayer);
  try{ delMap.fitBounds(L.latLngBounds(coords), {padding: [40, 40]}); }catch(e){}
  const step = Math.max(1, Math.floor(coords.length / 60));
  let i = 0;
  const timer = setInterval(()=>{
    i += step;
    if(i >= coords.length){
      i = coords.length;
      clearInterval(timer);
      bgLine.setLatLngs(coords); fgLine.setLatLngs(coords);
      const badge = document.getElementById('del-map-badge');
      if(badge && delRouteInfo){
        const distKm = (delRouteInfo.distance/1000).toFixed(1);
        const durMin = Math.round(delRouteInfo.duration/60);
        badge.innerHTML = `🛣️ ${distKm} km · ~${durMin} min`;
      }
      setTimeout(()=>showVehicleSheet(delData), 500);
      return;
    }
    const slice = coords.slice(0, i);
    bgLine.setLatLngs(slice); fgLine.setLatLngs(slice);
  }, 30);
}
window.submitDelivery = async (ev)=>{
  ev.preventDefault();
  const err = document.getElementById('del-error');
  err.style.display='none';
  const btn = document.getElementById('del-submit');
  btn.disabled = true;
  if(!delPickupLoc){ await useCurrentForDelivery('pickup', true); }
  if(!delDropoffLoc){
    const v = document.getElementById('del-dropoff').value.trim();
    if(v){
      try{
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(v)}`;
        const r = await fetch(url); const arr = await r.json();
        if(arr[0]) await setDeliveryPoint('dropoff', parseFloat(arr[0].lat), parseFloat(arr[0].lon));
      }catch(e){}
    }
  }
  if(!delPickupLoc || !delDropoffLoc){ err.textContent = 'Please set both pickup and drop-off locations.'; err.style.display='block'; btn.disabled=false; return; }
  if(!delRouteInfo){ try{ await fetchDeliveryRoute(); }catch(e){} }
  if(!delRouteInfo){
    const straight = haversineMeters(delPickupLoc.lat, delPickupLoc.lng, delDropoffLoc.lat, delDropoffLoc.lng);
    delRouteInfo = { distance: straight, duration: (straight/1000) / 30 * 3600 };
  }
  const sender = document.getElementById('del-sender').value.trim();
  const senderPhone = document.getElementById('del-sender-phone').value.trim();
  const receiver = document.getElementById('del-receiver').value.trim();
  const receiverPhone = document.getElementById('del-receiver-phone').value.trim();
  const cargo = document.getElementById('del-cargo').value.trim();
  const weight = document.getElementById('del-weight').value;
  const date = document.getElementById('del-date').value;
  const notes = document.getElementById('del-notes').value.trim();
  if(!sender || !senderPhone || !receiver || !receiverPhone || !cargo || !weight){
    err.textContent = 'Please fill in all sender, receiver & goods fields.';
    err.style.display='block'; btn.disabled=false; return;
  }
  const delData = {
    sender, senderPhone, receiver, receiverPhone, cargo, weight: Number(weight),
    date, notes, pickup: delPickupLoc, dropoff: delDropoffLoc,
    distance: delRouteInfo.distance, duration: delRouteInfo.duration
  };
  const frmEl = document.getElementById('del-form');
  const locBlock = document.getElementById('del-locations-block');
  const searchRes = document.getElementById('del-search-results');
  if(searchRes) searchRes.classList.remove('open');
  if(frmEl) frmEl.classList.add('frm-hidden');
  if(locBlock) locBlock.classList.add('frm-hidden');
  let coords = await fetchDeliveryRoute();
  if(!coords) coords = [[delPickupLoc.lat, delPickupLoc.lng], [delDropoffLoc.lat, delDropoffLoc.lng]];
  setTimeout(()=>{ animateRouteThenShowVehicles(delData, coords); btn.disabled = false; }, 500);
};

window.chooseDeliveryVehicle = async (vehicleId)=>{

  closeVsheet();
  const vehicle = DELIVERY_VEHICLES[vehicleId];
  const fare = computeDeliveryFare(vehicleId, delData.distance, delData.duration);
  const id = 'DLV-' + Date.now().toString(36).toUpperCase();
  try{
    await set(ref(db, 'deliveryRequests/'+id), {
      requester_id: S.user.uid,
      requesterName: (S.profile.firstName||'')+' '+(S.profile.lastName||''),
      requesterPhone: delData.senderPhone,
      pickup: delData.pickup, dropoff: delData.dropoff,
      pickupLabel: delData.pickup.label, dropoffLabel: delData.dropoff.label,
      senderName: delData.sender, senderPhone: delData.senderPhone,
      receiverName: delData.receiver, receiverPhone: delData.receiverPhone,
      cargo: delData.cargo, weight: delData.weight,
      vehicleType: vehicleId, vehicleLabel: vehicle.label,
      distance: delData.distance, duration: delData.duration,
      fare, date: delData.date, notes: delData.notes,
      status: 'searching', createdAt: Date.now()
    });

    $searchingSubtitle.textContent = `Looking for a ${vehicle.label.toLowerCase()} near your pickup…`;
    $searchingOverlay.classList.add('open');
    S.delActiveId = id;
    if(!S.allDeliveries) S.allDeliveries = [];
    S.allDeliveries.unshift({
      id, requester_id: S.user.uid,
      pickup: delData.pickup, dropoff: delData.dropoff,
      pickupLabel: delData.pickup.label, dropoffLabel: delData.dropoff.label,
      cargo: delData.cargo, weight: delData.weight,
      vehicleType: vehicleId, vehicleLabel: vehicle.label,
      distance: delData.distance, duration: delData.duration,

      senderName: delData.sender, senderPhone: delData.senderPhone,
      receiverName: delData.receiver, receiverPhone: delData.receiverPhone,
      status:'searching', createdAt: Date.now()
    });

function showLocationPermissionModal(){
  return new Promise((resolve)=>{
    modal(`<div style="text-align:center">
      <div style="font-size:48px;margin-bottom:12px">📍</div>
      <h3>Enable Location</h3>
      <p>AgriCare needs your location to show accurate weather and detect your city.</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
        <button class="btn btn-p" id="loc-allow-btn">Allow Location</button>
        <button class="btn btn-s" id="loc-skip-btn">Not Now</button>
      </div>
    </div>`);
    document.getElementById('loc-allow-btn').addEventListener('click', ()=>{ closeModal(); resolve(true); });
    document.getElementById('loc-skip-btn').addEventListener('click', ()=>{ closeModal(); resolve(false); });
  });
}
async function detectUserCityAndWeather(forcePrompt){
  if(!S.locationPermissionAsked && !forcePrompt){
    S.locationPermissionAsked = true;
    const allowed = await showLocationPermissionModal();
    if(!allowed){
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if(S.screen === 'home'){ const el = document.getElementById('screen-home'); if(el) el.innerHTML = renderHome(); }
      return;
    }
  }
  if(!navigator.geolocation){
    S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
    S.weatherCity = S.userLocation;
    return;
  }
  return new Promise((resolve)=>{
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      S.userCoords = {lat, lng};
      const place = await reverseGeocodeCity(lat, lng);
      if(place && place.city){ S.weatherCity = place.city; S.userLocation = place.city; }
      else { S.weatherCity = S.userLocation; }
      S.weather = await loadWeatherByCoords(lat, lng);
      if(S.screen === 'home'){ const el = document.getElementById('screen-home'); if(el) el.innerHTML = renderHome(); }
      resolve();
    }, async ()=>{
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if(S.screen === 'home'){ const el = document.getElementById('screen-home'); if(el) el.innerHTML = renderHome(); }
      resolve();
    }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 300000});
  });
}

function renderBanned(reason){
  return `<div class="screen-wrap" style="display:flex;align-items:center;justify-content:center"><div class="state-screen"><div class="st-ic danger">🚫</div><h1>Account Banned</h1><p>${esc(reason||'Contact support.')}</p><button class="btn btn-s" onclick="doLogout()">Sign Out</button></div></div>`;
}
function renderMaintenance(){
  return `<div class="screen-wrap" style="display:flex;align-items:center;justify-content:center"><div class="state-screen"><div class="st-ic warn">🔧</div><h1>Under Maintenance</h1><p>AgriCare is getting an update. Please try again in a few minutes.</p></div></div>`;
}
async function checkSystemState(){
  let maint = false, banned = false, banReason = '';
  try{ const m = await get(ref(db,'system/maintenance')); if(m.exists() && m.val().enabled) maint = true; }catch(e){}
  try{
    const u = await get(ref(db,'users/'+S.user.uid));
    if(u.exists()){
      const v = u.val();
      if(v.banned){ banned = true; banReason = v.banReason || 'Contact support'; }
    }
  }catch(e){}
  return { maint, banned, banReason };
}
async function startApp(){
  const splash = document.getElementById('splash');
  requestAnimationFrame(()=> splash.classList.add('show'));
  onAuthStateChanged(auth, async (user)=>{
    await new Promise(r=>setTimeout(r, 2500));
    if(!user){ window.location.href = 'index.html'; return; }
    S.user = user;
    const st = await checkSystemState();
    if(st.maint){ document.getElementById('app').innerHTML = renderMaintenance(); return; }
    if(st.banned){ document.getElementById('app').innerHTML = renderBanned(st.banReason); return; }
    const agri = await loadAgriKnowledge();
    S.agri = agri;
    const ud = await loadUserData(user.uid);
    S.profile = ud.profile || {};
    S.myActivities = ud.activities || [];
    S.myListings = ud.listings || [];
    S.following = ud.following || {};
    S.myBatches = ud.batches || [];
    if(S.profile.location) S.userLocation = S.profile.location;
    if(S.profile.city) S.weatherCity = S.profile.city;
    const [acts, mkt, sup] = await Promise.all([loadAllActivities(), loadMarketplace(), loadSuppliers()]);
    S.allActivities = acts; S.marketplace = mkt; S.suppliers = sup;
    loadAllDeliveries();
    startDeliveriesLiveListener();
    startSupplierProductsListener();
    startNotificationsListener();
    startContentNotificationListeners();
    startFollowingListener();
    const app = document.getElementById('app');
    app.innerHTML = `<div class="screen-wrap"></div>`;
    const wrap = app.querySelector('.screen-wrap');
    const home = document.createElement('div');
    home.className = 'screen'; home.id = 'screen-home';
    wrap.appendChild(home);
    activeScreenEl = home; S.screen = 'home';
    home.classList.add('active');
    route();
    try{ history.replaceState({screen:'home'}, '', '#home'); }catch(e){}
    await detectUserCityAndWeather();
    startWeatherRefresh();
  });
}
function startFollowingListener(){
  if(!S.user) return;
  if(S.followUnsub) S.followUnsub();
  S.followUnsub = onValue(ref(db, `users/${S.user.uid}/following`), (snap)=>{
    S.following = snap.val() || {};
  });
}
function startWeatherRefresh(){
  clearInterval(S.weatherRefreshTimer);
  S.weatherRefreshTimer = setInterval(async ()=>{
    if(S.userCoords){
      S.weather = await loadWeatherByCoords(S.userCoords.lat, S.userCoords.lng);
      if(S.screen === 'home'){ const el = document.getElementById('screen-home'); if(el) el.innerHTML = renderHome(); }
    }
  }, 30 * 60 * 1000);
}
function startDeliveriesLiveListener(){
  if(!S.user) return;
  onValue(ref(db, 'deliveryRequests'), (snap)=>{
    const data = snap.val() || {};
    const mine = [];
    Object.entries(data).forEach(([id, d])=>{ if(d.requester_id === S.user.uid) mine.push({id, ...d}); });
    mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.allDeliveries = mine;
    S.myDeliveries = mine;
    if(S.screen === 'ongoing-deliveries'){
      const scrollEl = document.getElementById('ongoingScroll');
      if(!scrollEl) return;
      const listContainer = scrollEl.querySelector('div[style*="padding:14px 18px 18px"]');
      if(listContainer){
        const ongoing = mine.filter(d=>['searching','accepted','arrived','in_progress','picked_up'].includes(d.status));
        listContainer.innerHTML = ongoing.length ? ongoing.map(d=>renderOngoingCard(d)).join('') : `<div class="empty"><div class="e-ic">⏱️</div><h3>No ongoing deliveries</h3></div>`;
        const trackWrap = document.getElementById('ongoingTrackWrap');
        const hasTracking = ongoing.some(d => ['accepted','arrived','in_progress','picked_up'].includes(d.status));
        if(trackWrap){ if(hasTracking) trackWrap.classList.add('show'); else trackWrap.classList.remove('show'); }
        const active = ongoing.find(d => ['accepted','arrived','in_progress','picked_up'].includes(d.status));
        if(active && S.ongoingTrackDeliveryId !== active.id){ initOngoingMap(); startOngoingTracking(active); }
      }
    }
    if(S.screen === 'delivery'){ const el = document.getElementById('screen-delivery'); if(el) el.innerHTML = renderDelivery(); wireDeliveryHeroMap(); }
  });
}
async function loadAllDeliveries(){
  try{
    const snap = await get(ref(db, 'deliveryRequests'));
    if(!snap.exists()){ S.allDeliveries = []; return; }
    const data = snap.val();
    const mine = [];
    Object.entries(data).forEach(([id, d])=>{ if(d.requester_id === S.user.uid) mine.push({id, ...d}); });
    mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.allDeliveries = mine;
    S.myDeliveries = mine;
  }catch(e){}
}
startApp();
setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash && splash.parentNode){
    setTimeout(()=>{
      splash.classList.remove('show');
      setTimeout(()=>{ if(splash.parentNode) splash.parentNode.removeChild(splash); }, 1000);
    }, 300);
  }
}, 2700);
window.addEventListener('unhandledrejection', e=>{ console.warn('Unhandled:', e.reason); });
window.addEventListener('beforeunload', ()=>{
  S.notifListeners.forEach(u=>{ try{u();}catch(e){} });
  if(S.heroDriverListener){ try{S.heroDriverListener();}catch(e){} }
  if(S.delActiveUnsub){ try{S.delActiveUnsub();}catch(e){} }
  if(S.followUnsub){ try{S.followUnsub();}catch(e){} }
  if(S.ongoingTrackUnsub){ try{S.ongoingTrackUnsub();}catch(e){} }
  if(S.ongoingStatusUnsub){ try{S.ongoingStatusUnsub();}catch(e){} }
  if(S.ongoingRouteRefreshTimer){ clearInterval(S.ongoingRouteRefreshTimer); }
});
</script>
