<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f7a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AgriCare · Farmer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js"
  }
}
</script>

<style>
:root{
  --p:#0f7a34; --p-h:#0b5f28; --p-d:#084d20;
  --p-l:#e6f5eb; --p-ll:#f1faf4;
  --p-glow:rgba(15,122,52,.28);
  --acc:#16a34a; --acc-soft:#86efac;
  --td:#0f172a; --tb:#334155; --tl:#64748b; --tm:#94a3b8;
  --bd:#e2e8f0; --bd-s:#cbd5e1;
  --sf:#ffffff; --sf2:#f8fafc; --bg:#f4f7f5;
  --danger:#dc2626; --warn:#b45309; --ok:#16a34a; --info:#2563eb;
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px; --r-p:999px;
  --e:cubic-bezier(.22,1,.36,1);
  --sh-xs:0 1px 2px rgba(15,23,42,.05);
  --sh-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh:0 4px 12px rgba(15,23,42,.07),0 2px 4px rgba(15,23,42,.04);
  --sh-lg:0 12px 28px rgba(15,23,42,.09),0 4px 10px rgba(15,23,42,.05);
  --sh-brand:0 10px 30px -8px var(--p-glow);
  --ring:0 0 0 4px rgba(15,122,52,.14);
  --nav-h:64px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--tb);height:100dvh;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

#app{position:fixed;inset:0;overflow:hidden;display:flex;justify-content:center}
.screen-wrap{
  width:100%;max-width:720px;height:100%;position:relative;
  display:flex;flex-direction:column;background:var(--sf);
  box-shadow:0 0 60px rgba(15,23,42,.06);
}
@media(min-width:721px){
  body{background:linear-gradient(135deg,#eef7f0 0%,#e0f2e6 50%,#d5ecdc 100%)}
  .screen-wrap{margin:0 auto;height:100dvh;border-radius:0}
}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--sf);opacity:0;transform:translateY(14px);
  transition:opacity .35s var(--e),transform .4s var(--e);
  pointer-events:none;will-change:opacity,transform;
}
.screen.active{opacity:1;transform:translateY(0);pointer-events:auto;z-index:5}
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}
.scroll.no-nav{padding-bottom:var(--safe-b)}

#splash{
  background:#000;z-index:100;
  display:flex;align-items:center;justify-content:center;
  opacity:1;transform:none;pointer-events:auto;
}
#splash img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease-in-out}
#splash.show img{opacity:1}
#splash .brand-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:space-between;padding:calc(var(--safe-t) + 40px) 24px calc(var(--safe-b) + 40px);
  background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 40%,transparent 60%,rgba(0,0,0,.55) 100%);
  pointer-events:none;opacity:0;transition:opacity 1s ease-in-out;
}
#splash.show .brand-overlay{opacity:1}
#splash .brand-top{text-align:center;color:#fff}
#splash .brand-top .leaf{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;font-size:34px;
  margin:0 auto 12px;box-shadow:0 12px 30px rgba(0,0,0,.3);
}
#splash .brand-top h1{font-size:34px;font-weight:900;letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#splash .brand-top p{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.95;margin-top:6px}
#splash .brand-bottom{text-align:center;color:#fff}
#splash .brand-bottom h2{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.25;text-shadow:0 2px 14px rgba(0,0,0,.5)}

.topbar{
  padding:calc(var(--safe-t) + 14px) 18px 10px;
  display:flex;align-items:center;gap:12px;
  background:var(--sf);flex-shrink:0;
}
.topbar.bordered{border-bottom:1px solid var(--bd)}
.topbar .tb-back{
  width:38px;height:38px;border-radius:50%;
  background:var(--sf2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .2s var(--e);
}
.topbar .tb-back:active{transform:scale(.92);background:var(--p-l);border-color:var(--p)}
.topbar .tb-back svg{width:18px;height:18px;fill:var(--td)}
.topbar .tb-title{
  flex:1;font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--td);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topbar .tb-actions{display:flex;gap:8px;align-items:center}
.topbar .tb-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--sf2);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--e);position:relative;
}
.topbar .tb-btn:active{transform:scale(.92);background:var(--p-l)}
.topbar .tb-btn svg{width:18px;height:18px;fill:var(--td)}
.topbar .tb-btn .dot{
  position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);border:1.5px solid #fff;
}
.topbar .tb-avatar{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,var(--p),var(--p-d));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;flex-shrink:0;cursor:pointer;
  border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.topbar .tb-avatar img{width:100%;height:100%;object-fit:cover}

.badge-count{
  position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  padding:0 4px;border:2px solid var(--sf);
}

.greet{padding:4px 18px 12px}
.greet h2{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--td);line-height:1.2}
.greet h2 span{color:var(--p)}
.greet p{font-size:12.5px;color:var(--tl);margin-top:2px;font-weight:500}

.live-clock{
  display:flex;align-items:center;gap:8px;padding:0 18px 10px;
  font-size:12px;color:var(--tl);font-weight:700;
}
.live-clock .lc-dot{
  width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 3px rgba(22,163,74,.15);
  animation:lcPulse 2s ease-in-out infinite;
}
@keyframes lcPulse{0%,100%{opacity:1}50%{opacity:.4}}

.weather-card{
  margin:0 18px 16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0f7a34 0%,#0b5f28 60%,#084d20 100%);
  border-radius:var(--r-lg);padding:18px 18px 16px;color:#fff;
  box-shadow:var(--sh-brand);
}
.weather-card::before{
  content:'';position:absolute;top:-30px;right:-20px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(255,255,255,.22) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.weather-card::after{
  content:'';position:absolute;bottom:-40px;left:-30px;width:120px;height:120px;
  background:radial-gradient(circle,rgba(134,239,172,.25) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.wc-head{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.wc-loc{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;opacity:.95}
.wc-loc svg{width:13px;height:13px;fill:#fff}
.wc-temp{font-size:38px;font-weight:900;letter-spacing:-.04em;line-height:1;margin:8px 0 4px;position:relative;z-index:1}
.wc-desc{font-size:13px;font-weight:600;opacity:.92;position:relative;z-index:1}
.wc-range{font-size:12px;font-weight:600;opacity:.85;margin-top:3px;position:relative;z-index:1}
.wc-icon{
  position:absolute;top:14px;right:16px;font-size:44px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.2));
  animation:bob 3s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.qa-row{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  padding:0 18px 18px;
}
.qa{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 4px 10px;border-radius:var(--r);
  background:var(--sf2);border:1px solid var(--bd);
  transition:all .22s var(--e);position:relative;
}
.qa:active{transform:scale(.94);background:var(--p-l);border-color:var(--p)}
.qa .qa-ic{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;
}
.qa .qa-lb{font-size:9.5px;font-weight:800;letter-spacing:.02em;color:var(--td);text-transform:uppercase;text-align:center}
.qa-ic.c1{background:linear-gradient(145deg,#fef3c7,#f59e0b)}
.qa-ic.c2{background:linear-gradient(145deg,#fee2e2,#dc2626)}
.qa-ic.c3{background:linear-gradient(145deg,#dbeafe,#2563eb)}
.qa-ic.c4{background:linear-gradient(145deg,#fef3c7,#d97706)}
.qa-ic.c5{background:linear-gradient(145deg,#d1fae5,#10b981)}

.sec-h{padding:4px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h h3{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--td)}
.sec-h button{
  font-size:12px;font-weight:700;color:var(--p);
  display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;
}
.sec-h button:active{background:var(--p-l)}

.mf-row{
  display:flex;gap:10px;padding:0 18px 6px;overflow-x:auto;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.mf-row::-webkit-scrollbar{display:none}
.mf-card{
  flex:0 0 148px;background:var(--sf);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;scroll-snap-align:start;
  transition:transform .22s var(--e);
  box-shadow:var(--sh-xs);cursor:pointer;
}
.mf-card:active{transform:scale(.97)}
.mf-card .mf-img{
  height:84px;background:var(--sf2);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:38px;
}
.mf-card .mf-img img{width:100%;height:100%;object-fit:cover}
.mf-card .mf-body{padding:9px 10px 10px}
.mf-card .mf-name{font-size:12.5px;font-weight:800;color:var(--td);letter-spacing:-.01em;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mf-card .mf-sub{font-size:10.5px;color:var(--tl);font-weight:600;line-height:1.35}
.mf-card .mf-tag{
  display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 8px;border-radius:var(--r-p);margin-top:6px;
  background:var(--p-l);color:var(--p-d);
}
.mf-card .mf-tag.warn{background:#fef3c7;color:#92400e}
.mf-card .mf-tag.ok{background:#d1fae5;color:#065f46}
.mf-card .mf-tag.ready{background:#dbeafe;color:#1e40af}
.mf-card .mf-days{
  display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;
  color:var(--p);margin-top:4px;
}
.mf-days .mf-dot{width:5px;height:5px;border-radius:50%;background:var(--p);animation:lcPulse 1.5s infinite}

.cta-banner{
  margin:14px 18px 16px;padding:16px 18px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 100%);
  border:1px solid rgba(15,122,52,.14);
  display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;
}
.cta-banner .cta-txt{flex:1;min-width:0}
.cta-banner h4{font-size:14px;font-weight:900;color:var(--p-d);letter-spacing:-.02em;margin-bottom:3px}
.cta-banner p{font-size:11.5px;color:var(--p);font-weight:600;line-height:1.4}
.cta-banner .cta-arrow{
  width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 6px 14px -4px var(--p-glow);
}
.cta-banner .cta-arrow svg{width:16px;height:16px;fill:#fff}

.feed-mini{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
.feed-mini .fm-item{
  display:flex;gap:10px;padding:10px;border-radius:var(--r);
  background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh-xs);
  cursor:pointer;transition:transform .2s var(--e);
}
.feed-mini .fm-item:active{transform:scale(.98)}
.feed-mini .fm-thumb{
  width:52px;height:52px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  background:var(--sf2);overflow:hidden;
}
.feed-mini .fm-thumb img{width:100%;height:100%;object-fit:cover}
.feed-mini .fm-body{flex:1;min-width:0}
.feed-mini .fm-name{font-size:12.5px;font-weight:800;color:var(--td);letter-spacing:-.01em}
.feed-mini .fm-sub{font-size:11px;color:var(--tl);font-weight:600;margin-top:2px;line-height:1.4}
.feed-mini .fm-meta{display:flex;gap:8px;margin-top:5px;font-size:10px;color:var(--tm);font-weight:600}
.feed-mini .fm-tag{
  display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:var(--r-p);background:var(--p-l);color:var(--p-d);margin-left:auto;
}

/* ============ BOTTOM NAV ============ */
.bnav{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-around;
  z-index:20;
}
.bnav.hidden{display:none}
.bnav .bn{
  flex:1;height:var(--nav-h);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--tm);transition:color .25s var(--e);position:relative;padding:0 2px;
}
.bnav .bn svg{
  width:20px;height:20px;fill:currentColor;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.bnav .bn .bn-lb{
  font-size:9px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
  transition:color .25s var(--e);
}
.bnav .bn.active{color:var(--p)}
.bnav .bn.active svg{transform:scale(1.45)}
.bnav .bn.active .bn-lb{color:var(--p)}
.bnav .bn.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--p);
  box-shadow:0 2px 6px -1px var(--p-glow);
}
.bnav .bn:active svg{transform:scale(.92)}
.bnav .bn.active:active svg{transform:scale(1.3)}
.bnav .bn .bn-badge{
  position:absolute;top:8px;right:calc(50% - 18px);
  min-width:16px;height:16px;padding:0 4px;
  background:var(--danger);color:#fff;font-size:9px;font-weight:800;
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--sf);
}

.card{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px;box-shadow:var(--sh-xs);
}
.card + .card{margin-top:10px}

.cat-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  padding:0 18px 18px;
}
.cat-card{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;transition:transform .2s var(--e);cursor:pointer;
  box-shadow:var(--sh-xs);
}
.cat-card:active{transform:scale(.97)}
.cat-card .cc-top{
  height:86px;display:flex;align-items:center;justify-content:center;
  font-size:44px;position:relative;overflow:hidden;
}
.cat-card .cc-top img{width:100%;height:100%;object-fit:cover}
.cat-card .cc-body{padding:10px 11px 12px}
.cat-card .cc-name{font-size:13px;font-weight:800;color:var(--td);letter-spacing:-.01em;line-height:1.2}
.cat-card .cc-sub{font-size:10.5px;color:var(--tl);font-weight:600;margin-top:3px;line-height:1.35}
.cat-card .cc-tag{
  display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:var(--r-p);background:var(--p-l);color:var(--p-d);margin-top:6px;
}

.chips-row{
  display:flex;gap:7px;padding:0 18px 12px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.chips-row::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:var(--r-p);
  background:var(--sf2);border:1px solid var(--bd);
  font-size:12px;font-weight:700;color:var(--tb);
  transition:all .2s var(--e);white-space:nowrap;
}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 4px 10px -2px var(--p-glow)}

.frm{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.fld{position:relative}
.fld label{
  display:block;font-size:11.5px;font-weight:800;color:var(--tl);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;
}
.fld .inp{
  width:100%;padding:13px 15px;border:1.5px solid var(--bd);border-radius:var(--r);
  background:var(--sf);font-size:15px;font-weight:500;color:var(--td);
  outline:none;transition:all .2s var(--e);-webkit-appearance:none;appearance:none;
}
.fld .inp:focus{border-color:var(--p);box-shadow:var(--ring);background:#fbfdfb}
.fld textarea.inp{resize:vertical;min-height:82px;line-height:1.5}

.select-trigger{
  width:100%;padding:13px 15px;border:1.5px solid var(--bd);border-radius:var(--r);
  background:var(--sf);font-size:15px;font-weight:500;color:var(--td);
  outline:none;transition:all .2s var(--e);text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  cursor:pointer;
}
.select-trigger:focus{border-color:var(--p);box-shadow:var(--ring)}
.select-trigger .st-arrow{font-size:11px;color:var(--tm);transition:transform .25s var(--e)}
.select-trigger.open .st-arrow{transform:rotate(180deg)}
.select-options{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;
  background:#fff;border:1.5px solid var(--bd);border-radius:var(--r);
  box-shadow:0 16px 40px -8px rgba(15,23,42,.18);
  max-height:280px;overflow-y:auto;
  opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:all .22s var(--e);
}
.select-options.open{opacity:1;visibility:visible;transform:translateY(0)}
.select-option{
  padding:12px 15px;font-size:14px;font-weight:600;color:var(--td);
  cursor:pointer;transition:background .15s var(--e);
  display:flex;align-items:center;gap:10px;
}
.select-option:active{background:var(--p-l)}

.up-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.fa-card{

.fa-card .fa-imgs > div{

}
.fa-card .fa-imgs img{width:100%;height:100%;object-fit:cover}
.fa-card .fa-head{display:flex;align-items:center;gap:9px;padding:11px 12px 6px}
.fa-card .fa-av{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--p),var(--p-d));color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;overflow:hidden;
}
.fa-card .fa-av img{width:100%;height:100%;object-fit:cover}
.fa-card .fa-who{flex:1;min-width:0}
.fa-card .fa-nm{font-size:13px;font-weight:800;color:var(--td);letter-spacing:-.01em}
.fa-card .fa-lc{font-size:10.5px;color:var(--tl);font-weight:600;margin-top:1px}
.fa-card .fa-tag{

.fa-card .fa-bd{padding:6px 12px 12px}
.fa-card .fa-desc{font-size:12px;color:var(--tb);font-weight:600;line-height:1.5}
.fa-card .fa-meta{display:flex;gap:12px;margin-top:8px;font-size:10.5px;color:var(--tl);font-weight:700;flex-wrap:wrap}
.fa-card .fa-meta svg{width:12px;height:12px;fill:var(--tm);vertical-align:-2px;margin-right:3px}
.fa-card .fa-acts{display:flex;gap:6px;padding:0 12px 12px}
.fa-card .fa-acts button{

}

.post{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);

}

.post .p-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.post .p-av{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--p),var(--p-d));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;overflow:hidden;
  cursor:pointer;
}
.post .p-av img{width:100%;height:100%;object-fit:cover}
.post .p-who{flex:1;min-width:0}
.post .p-nm{font-size:13px;font-weight:800;color:var(--td);letter-spacing:-.01em}
.post .p-tm{font-size:10.5px;color:var(--tm);font-weight:600;margin-top:1px;display:flex;align-items:center;gap:5px}

.post .p-imgs{display:grid;gap:2px;grid-template-columns:1fr;border-radius:10px;overflow:hidden;margin-bottom:9px}
.post .p-imgs.multi{grid-template-columns:1fr 1fr}
.post .p-imgs.three{grid-template-columns:1fr 1fr 1fr}
.post .p-imgs > div{

}
.post .p-acts{

}
.post .p-acts button{

}
.post .p-acts button:active{background:var(--sf2);color:var(--p)}
.post .p-acts button.liked{color:var(--danger)}
.post .p-acts svg{width:15px;height:15px;fill:currentColor}
.post .p-acts .p-acts-right{margin-left:auto;display:flex;gap:6px}

.comments-wrap{
  margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);

}
.comments-wrap.open{display:block}
.comment-input-row{

}
.comment-input-row input{

}

  font-size:12px;font-weight:800;
}
.comment-input-row button:disabled{opacity:.5}
.comment{
  display:flex;gap:8px;padding:6px 0;
}
.comment .c-av{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;

}

.mk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 18px}

}

.mk-card .mk-img .mk-status{

.mk-card .mk-bd{padding:10px 11px 12px}
.mk-card .mk-nm{font-size:12.5px;font-weight:800;color:var(--td);line-height:1.25;letter-spacing:-.01em}
.mk-card .mk-sz{font-size:10.5px;color:var(--tl);font-weight:600;margin-top:3px}
.mk-card .mk-pr{font-size:14px;font-weight:900;color:var(--p-d);letter-spacing:-.02em;margin-top:6px}
.mk-card .mk-ct{font-size:10px;color:var(--tm);font-weight:600;margin-top:2px}

.sup-row{

}

.sup-btn{

  transition:all .2s var(--e);cursor:pointer;
}

.sup-btn.active{background:var(--p-l);border-color:var(--p)}

}

.prof-hero{

  background:linear-gradient(135deg,#0f7a34 0%,#0b5f28 100%);

}
.prof-hero::before{

  background:radial-gradient(circle,rgba(255,255,255,.2) 0%,transparent 70%);border-radius:50%;
}
.prof-hero .p-av{

}

.prof-hero .p-ver{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  background:rgba(255,255,255,.2);padding:4px 10px;border-radius:var(--r-p);

}

.prof-hero .p-loc{font-size:12px;font-weight:600;opacity:.92;margin-top:8px;position:relative;z-index:1}
.prof-stats{

}

.prof-stats .ps-n{font-size:20px;font-weight:900;letter-spacing:-.03em}
.prof-stats .ps-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85;margin-top:2px}

.nrc-strip{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;

}

}
.nrc-tile .nrc-img{

}

.nrc-tile .nrc-lbl{

}
.nrc-tile .nrc-edit{
  position:absolute;top:12px;right:12px;

  display:flex;align-items:center;justify-content:center;font-size:11px;
}

.menu-list{padding:0 18px 18px}
.menu-item{
  display:flex;align-items:center;gap:12px;padding:14px 14px;
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);

}

}

.menu-item .mi-tt{font-size:13.5px;font-weight:800;color:var(--td);letter-spacing:-.01em}
.menu-item .mi-sb{font-size:11px;color:var(--tl);font-weight:600;margin-top:2px}
.menu-item .mi-ar svg{width:16px;height:16px;fill:var(--tm)}

.detail-hero{
  height:200px;background:var(--sf2);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:96px;
}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-body{padding:16px 18px 24px}
.detail-body h1{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--td);margin-bottom:5px}
.detail-body .d-sc{font-size:13px;color:var(--tl);font-weight:600;font-style:italic;margin-bottom:12px}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.dtag{
  font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:5px 11px;border-radius:var(--r-p);background:var(--p-l);color:var(--p-d);
}
.dtag.amber{background:#fef3c7;color:#92400e}
.dtag.blue{background:#dbeafe;color:#1e40af}
.dtag.red{background:#fee2e2;color:#991b1b}

.d-section{margin-bottom:16px}
.d-section h3{
  font-size:13px;font-weight:900;color:var(--td);letter-spacing:-.01em;
  text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.d-section h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.d-section p{font-size:13px;color:var(--tb);line-height:1.6;font-weight:500}
.d-list{list-style:none}
.d-list li{
  padding:8px 12px;background:var(--sf2);border:1px solid var(--bd);

}
.d-list li::before{content:'●';color:var(--p);font-size:9px;margin-top:5px;flex-shrink:0}

/* Cart floating button */
.cart-float{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  z-index:30;padding:12px 18px;border-radius:var(--r-p);
  background:linear-gradient(180deg,#12903e 0%,var(--p) 100%);color:#fff;
  font-size:13px;font-weight:800;display:none;align-items:center;gap:8px;
  box-shadow:0 12px 30px -8px var(--p-glow),0 0 0 4px rgba(255,255,255,.9);
  animation:cartIn .35s var(--e);
}
.cart-float.show{display:flex}
@keyframes cartIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.cart-float .cf-count{
  background:#fff;color:var(--p);border-radius:50%;
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;
}

/* Notifications panel */
.notif-panel{
  position:fixed;top:0;right:0;bottom:0;z-index:400;
  width:min(420px,92vw);background:var(--sf);
  transform:translateX(100%);transition:transform .38s var(--e);
  box-shadow:-16px 0 40px rgba(15,23,42,.18);
  display:flex;flex-direction:column;
}
.notif-panel.open{transform:translateX(0)}
.notif-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:399;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
}
.notif-overlay.open{opacity:1;visibility:visible}
.notif-head{
  padding:calc(var(--safe-t) + 16px) 18px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--bd);flex-shrink:0;
}
.notif-head h2{font-size:18px;font-weight:900;letter-spacing:-.02em;color:var(--td)}
.notif-head button{
  width:34px;height:34px;border-radius:50%;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  transition:all .2s var(--e);
}
.notif-head button:active{transform:scale(.9);background:var(--p-l)}
.notif-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0}
.notif-item{
  display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bd);
  transition:background .2s var(--e);cursor:pointer;position:relative;
}
.notif-item:active{background:var(--sf2)}
.notif-item.unread{background:var(--p-ll)}
.notif-item.unread::before{
  content:'';position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:50%;background:var(--p);
}
.notif-item .n-ic{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:var(--p-l);color:var(--p);
}
.notif-item .n-ic.warn{background:#fef3c7;color:#92400e}
.notif-item .n-ic.info{background:#dbeafe;color:#1e40af}
.notif-item .n-ic.danger{background:#fee2e2;color:#991b1b}
.notif-item .n-body{flex:1;min-width:0}
.notif-item .n-title{font-size:13px;font-weight:800;color:var(--td);letter-spacing:-.01em;line-height:1.3}
.notif-item .n-text{font-size:12px;color:var(--tb);margin-top:3px;line-height:1.45;font-weight:500}
.notif-item .n-time{font-size:10.5px;color:var(--tm);font-weight:600;margin-top:5px}
.notif-empty{
  padding:60px 24px;text-align:center;color:var(--tl);
}
.notif-empty .ne-ic{font-size:52px;opacity:.4;margin-bottom:12px}

/* Modal */
.modal{
  position:fixed;inset:0;background:rgba(15,23,42,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:500;
  animation:fadeIn .22s ease;
}
.modal.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  background:#ffffff !important;border-radius:var(--r-xl);width:100%;max-width:420px;
  padding:24px;text-align:center;
  box-shadow:0 30px 70px -20px rgba(15,23,42,.35);
  animation:modalIn .32s cubic-bezier(.34,1.4,.64,1);
  max-height:85vh;overflow-y:auto;
  color:var(--td);
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-card h3{font-size:17px;font-weight:900;color:var(--td);margin-bottom:8px;letter-spacing:-.02em}
.modal-card p{font-size:13px;color:var(--tl);line-height:1.55;margin-bottom:16px}
.modal-card .inp{
  width:100%;padding:13px 15px;border:1.5px solid var(--bd);border-radius:var(--r);
  background:#fff;font-size:15px;font-weight:500;color:var(--td);
  outline:none;transition:all .2s var(--e);text-align:left;
}
.modal-card .inp:focus{border-color:var(--p);box-shadow:var(--ring)}
.modal-card .select-trigger{background:#fff}

/* Toast */
.toast{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);left:50%;
  transform:translate(-50%,30px);background:rgba(15,23,42,.94);color:#fff;
  padding:11px 20px;border-radius:var(--r-p);font-size:13px;font-weight:700;
  opacity:0;pointer-events:none;transition:all .3s var(--e);z-index:600;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.4);max-width:calc(100vw - 40px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.state-screen{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 28px;text-align:center;gap:16px;
}
.state-screen .st-ic{
  width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:42px;
}
.state-screen h1{font-size:22px;font-weight:900;color:var(--td);letter-spacing:-.03em;line-height:1.25}
.state-screen p{font-size:14px;color:var(--tl);line-height:1.6;max-width:360px}
.st-ic.danger{background:linear-gradient(145deg,#fecaca,#dc2626);color:#fff}
.st-ic.warn{background:linear-gradient(145deg,#fde68a,#d97706);color:#fff}
.st-ic.ok{background:linear-gradient(145deg,#a7f3d0,#0f7a34);color:#fff}

.empty{padding:40px 24px;text-align:center;color:var(--tl)}
.empty .e-ic{font-size:56px;margin-bottom:12px;opacity:.5}
.empty h3{font-size:15px;font-weight:800;color:var(--td);margin-bottom:6px}
.empty p{font-size:12.5px;line-height:1.5}

/* Map */
#deliveryMap{width:100%;height:100%;min-height:280px;border-radius:var(--r);background:#e8eaed}
.map-wrap{
  margin:0 18px 14px;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--bd);box-shadow:var(--sh-sm);height:280px;position:relative;
}
.map-wrap .map-badge{
  position:absolute;top:10px;left:10px;z-index:400;
  background:rgba(15,122,52,.9);color:#fff;
  font-size:10.5px;font-weight:800;letter-spacing:.04em;
  padding:6px 11px;border-radius:var(--r-p);
  display:inline-flex;align-items:center;gap:6px;
  max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.map-wrap .map-badge i{font-size:10px}
.map-actions{
  position:absolute;right:10px;bottom:10px;z-index:400;display:flex;flex-direction:column;gap:6px;
}
.map-actions button{
  width:38px;height:38px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.14);
  transition:all .2s var(--e);
}
.map-actions button:active{transform:scale(.92)}
.map-actions button.active{background:var(--p);color:#fff}

.location-input{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:var(--r);background:var(--sf2);
  border:1.5px solid var(--bd);margin-bottom:10px;
}
.location-input .loc-dot{
  width:10px;height:10px;border-radius:50%;background:var(--p);
  flex-shrink:0;box-shadow:0 0 0 3px rgba(15,122,52,.15);
}
.location-input .loc-dot.dest{background:var(--info);box-shadow:0 0 0 3px rgba(37,99,235,.15);border-radius:3px}
.location-input input{
  flex:1;min-width:0;border:none;background:none;outline:none;
  font-size:13.5px;font-weight:600;color:var(--td);
}
.location-input input::placeholder{color:var(--tm);font-weight:500}
.location-input .loc-clear{
  width:22px;height:22px;border-radius:50%;background:var(--bd);color:var(--tl);
  display:flex;align-items:center;justify-content:center;font-size:11px;
}

.map-search-results{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);
  margin:0 18px 14px;overflow:hidden;display:none;max-height:280px;overflow-y:auto;
}
.map-search-results.open{display:block}
.map-search-item{
  display:flex;align-items:center;gap:11px;padding:11px 14px;
  border-bottom:1px solid var(--bd);cursor:pointer;transition:background .2s;
  text-align:left;width:100%;
}
.map-search-item:last-child{border-bottom:none}
.map-search-item:active{background:var(--p-l)}
.map-search-item .ms-ic{
  width:32px;height:32px;border-radius:50%;background:var(--sf2);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.map-search-item .ms-body{flex:1;min-width:0}
.map-search-item .ms-name{
  font-size:12.5px;font-weight:800;color:var(--td);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.map-search-item .ms-sub{
  font-size:10.5px;color:var(--tl);font-weight:600;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.map-search-item .ms-dist{
  font-size:10.5px;font-weight:800;color:var(--p);
  background:var(--p-l);padding:3px 8px;border-radius:var(--r-p);flex-shrink:0;
}

.rev-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:0 18px 14px;
}
.rev-tile{
  padding:14px;border-radius:var(--r);background:var(--sf);
  border:1px solid var(--bd);box-shadow:var(--sh-xs);
}
.rev-tile.dark{
  background:linear-gradient(135deg,var(--p) 0%,var(--p-d) 100%);
  color:#fff;border:none;
}
.rev-tile .rt-l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--tl);margin-bottom:6px}
.rev-tile.dark .rt-l{color:rgba(255,255,255,.75)}
.rev-tile .rt-v{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--td);line-height:1}
.rev-tile.dark .rt-v{color:#fff}
.rev-tile .rt-s{font-size:11px;color:var(--tl);font-weight:600;margin-top:4px}
.rev-tile.dark .rt-s{color:rgba(255,255,255,.75)}

.docs-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:0 18px 14px;
}
.doc-card{
  padding:14px;border-radius:var(--r);background:var(--sf);
  border:1px solid var(--bd);text-align:center;position:relative;
  transition:transform .2s var(--e);
}
.doc-card:active{transform:scale(.97)}
.doc-card .dc-ic{
  width:44px;height:44px;border-radius:50%;background:var(--p-l);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  margin:0 auto 8px;
}
.doc-card .dc-nm{font-size:11.5px;font-weight:800;color:var(--td);letter-spacing:-.01em}
.doc-card .dc-st{
  font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  margin-top:6px;padding:3px 8px;border-radius:var(--r-p);
  display:inline-block;
}
.doc-card .dc-st.ok{background:#d1fae5;color:#065f46}
.doc-card .dc-st.miss{background:#fee2e2;color:#991b1b}
.doc-card .dc-st.pend{background:#fef3c7;color:#92400e}

.analysis-stat{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);
  margin-bottom:10px;box-shadow:var(--sh-xs);
}
.analysis-stat .as-rank{
  width:28px;height:28px;border-radius:50%;background:var(--p-l);
  color:var(--p-d);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;flex-shrink:0;
}
.analysis-stat .as-rank.gold{background:linear-gradient(145deg,#fef3c7,#f59e0b);color:#fff}
.analysis-stat .as-rank.silver{background:linear-gradient(145deg,#e2e8f0,#94a3b8);color:#fff}
.analysis-stat .as-rank.bronze{background:linear-gradient(145deg,#fed7aa,#c2410c);color:#fff}
.analysis-stat .as-body{flex:1;min-width:0}
.analysis-stat .as-name{font-size:13px;font-weight:800;color:var(--td);letter-spacing:-.01em}
.analysis-stat .as-sub{font-size:11px;color:var(--tl);font-weight:600;margin-top:2px}
.analysis-stat .as-value{font-size:15px;font-weight:900;color:var(--p-d);flex-shrink:0}
.bar-row{
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-sm);
  margin-bottom:7px;
}
.bar-row .br-label{flex:1;font-size:12px;font-weight:700;color:var(--td);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .br-bar{flex:1;height:8px;border-radius:4px;background:var(--bd);overflow:hidden;max-width:120px}
.bar-row .br-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--acc));transition:width .8s var(--e)}
.bar-row .br-val{font-size:11px;font-weight:800;color:var(--p-d);min-width:32px;text-align:right}

.gov-site{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);
  margin-bottom:8px;transition:all .2s var(--e);cursor:pointer;
}
.gov-site:active{background:var(--p-l);border-color:var(--p)}
.gov-site .gs-ic{
  width:42px;height:42px;border-radius:12px;background:var(--p-l);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.gov-site .gs-body{flex:1;min-width:0}
.gov-site .gs-name{font-size:13px;font-weight:800;color:var(--td);letter-spacing:-.01em}
.gov-site .gs-desc{font-size:11px;color:var(--tl);font-weight:600;margin-top:2px;line-height:1.4}
.gov-site .gs-arrow{font-size:14px;color:var(--tm)}

/* ========== NEW: Delivery dashboard (NTUMENI-inspired green) ========== */
.delivery-dash{
  position:relative;
  display:flex;flex-direction:column;
  height:100%;
}
.delivery-map-half{
  flex:1 1 55%;min-height:280px;position:relative;background:#e8f5ec;overflow:hidden;
}
#deliveryHeroMap{position:absolute;inset:0;z-index:1}
.delivery-map-badge{
  position:absolute;top:12px;left:12px;z-index:400;
  background:rgba(15,122,52,.94);color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.4px;
  padding:7px 13px;border-radius:999px;
  display:inline-flex;align-items:center;gap:7px;
  max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 20px -6px rgba(15,122,52,.5);
}
.delivery-map-count{
  position:absolute;top:12px;right:12px;z-index:400;
  background:rgba(18,183,106,.94);color:#fff;
  font-size:10.5px;font-weight:800;letter-spacing:.4px;
  padding:7px 12px;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 4px 14px -4px rgba(18,183,106,.55);
}
.delivery-map-count.hidden-count{opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .3s}
.delivery-map-actions{
  position:absolute;right:12px;bottom:12px;z-index:400;display:flex;flex-direction:column;gap:8px;
}
.delivery-map-actions button{
  width:42px;height:42px;border-radius:12px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  color:var(--p);box-shadow:0 4px 14px rgba(0,0,0,.15);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.delivery-map-actions button:active{transform:scale(.92)}

.delivery-action-half{
  flex:1 1 45%;min-height:0;
  background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(var(--safe-b) + 16px);
  display:flex;flex-direction:column;gap:12px;
  border-top:1px solid var(--bd);
}
.delivery-greeting{font-size:17px;font-weight:900;letter-spacing:-.02em;color:var(--td)}
.delivery-sub{font-size:12.5px;color:var(--tl);font-weight:600;margin-top:2px;margin-bottom:4px}

.btn-delivery-main{
  width:100%;padding:18px 18px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,#16a34a 0%,#0f7a34 60%,#0b5f28 100%);
  color:#fff;display:flex;align-items:center;gap:14px;
  text-align:left;box-shadow:0 12px 30px -10px rgba(15,122,52,.55);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.btn-delivery-main:active{transform:scale(.982)}
.btn-delivery-main .dm-ico{
  width:48px;height:48px;border-radius:14px;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.btn-delivery-main .dm-txt{flex:1;min-width:0}
.btn-delivery-main .dm-txt strong{
  display:block;font-size:15px;font-weight:900;letter-spacing:-.02em;margin-bottom:3px;
}
.btn-delivery-main .dm-txt span{
  display:block;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.82);
}
.btn-delivery-main .dm-arrow{font-size:16px;color:rgba(255,255,255,.55)}

.delivery-mini-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.btn-delivery-mini{
  padding:14px 12px;border-radius:var(--r);background:#fff;
  border:1.5px solid var(--bd);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:all .22s var(--e);position:relative;
}
.btn-delivery-mini:active{transform:scale(.97);background:var(--p-l);border-color:var(--p)}
.btn-delivery-mini .dmi-ico{
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.btn-delivery-mini .dmi-ico.green{background:linear-gradient(145deg,#d1fae5,#10b981);color:#fff}
.btn-delivery-mini .dmi-ico.blue{background:linear-gradient(145deg,#dbeafe,#2563eb);color:#fff}
.btn-delivery-mini .dmi-lb{font-size:12px;font-weight:800;color:var(--td);text-align:center}
.btn-delivery-mini .dmi-count{
  position:absolute;top:8px;right:8px;
  min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}

.delivery-recent-title{
  font-size:12.5px;font-weight:800;color:var(--td);
  text-transform:uppercase;letter-spacing:.05em;margin-top:6px;
  display:flex;align-items:center;gap:8px;
}
.delivery-recent-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}

.delivery-recent-item{
  display:flex;gap:12px;padding:12px;
  background:#fff;border:1px solid var(--bd);border-radius:var(--r);
  align-items:center;cursor:pointer;transition:transform .2s var(--e);
}
.delivery-recent-item:active{transform:scale(.98)}
.delivery-recent-item .dri-ico{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:var(--p-l);color:var(--p);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.delivery-recent-item .dri-body{flex:1;min-width:0}
.delivery-recent-item .dri-title{
  font-size:12.5px;font-weight:800;color:var(--td);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.delivery-recent-item .dri-sub{
  font-size:10.5px;color:var(--tl);font-weight:600;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.delivery-recent-item .dri-tag{
  font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;

  background:var(--p-l);color:var(--p-d);
}
.delivery-recent-item .dri-tag.searching{background:#dbeafe;color:#1e40af}
.delivery-recent-item .dri-tag.accepted{background:#fef3c7;color:#92400e}
.delivery-recent-item .dri-tag.in_progress{background:#d1fae5;color:#065f46}
.delivery-recent-item .dri-tag.completed{background:#e6f5eb;color:var(--p-d)}
.delivery-recent-item .dri-tag.cancelled{background:#f1f5f9;color:#64748b}

/* Vehicle sheet for delivery prices */
.vsheet-overlay{
  position:fixed;inset:0;z-index:600;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;
  animation:fadeIn .22s ease;
}
.vsheet-overlay.open{display:flex}
.vsheet{
  background:#fff;border-radius:26px 26px 0 0;
  width:100%;max-width:560px;padding:12px 20px calc(var(--safe-b) + 26px);
  box-shadow:0 -12px 40px rgba(0,0,0,.28);
  animation:vsheetUp .42s cubic-bezier(.32,.72,0,1);
}
@keyframes vsheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.vsheet-handle{
  width:42px;height:4px;border-radius:999px;
  background:rgba(15,23,42,.14);margin:4px auto 18px;
}
.vsheet-head{text-align:center;margin-bottom:16px}
.vsheet-head h3{font-size:17px;font-weight:900;letter-spacing:-.02em;color:var(--td);margin-bottom:4px}
.vsheet-head p{font-size:12px;color:var(--tl);font-weight:600}
.vsheet-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.vsheet-item{
  width:100%;display:flex;align-items:center;gap:14px;
  padding:14px 15px;border-radius:var(--r);
  background:#fff;border:1.5px solid var(--bd);text-align:left;
  transition:all .22s var(--e);
}
.vsheet-item:active{transform:scale(.98);background:var(--p-l);border-color:var(--p)}
.vsheet-item .vsi-ico{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,#0f7a34,#0b5f28);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.vsheet-item .vsi-info{flex:1;min-width:0}
.vsheet-item .vsi-info strong{display:block;font-size:13.5px;font-weight:800;color:var(--td);margin-bottom:2px}
.vsheet-item .vsi-info span{display:block;font-size:11px;color:var(--tl);font-weight:600}
.vsheet-item .vsi-price{text-align:right;flex-shrink:0}
.vsheet-item .vsi-price strong{display:block;font-size:16px;font-weight:900;letter-spacing:-.03em;color:var(--p-d)}
.vsheet-item .vsi-price small{display:block;font-size:9.5px;color:var(--tl);font-weight:700;letter-spacing:.5px;margin-top:2px;text-transform:uppercase}
.vsheet-cancel{
  width:100%;padding:13px;border-radius:var(--r);
  background:var(--sf2);font-size:14px;font-weight:700;color:var(--td);
}

/* Searching overlay */
.searching-overlay{
  position:fixed;inset:0;z-index:550;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:24px;
  animation:fadeIn .25s ease;
}
.searching-overlay.open{display:flex}
.searching-card{
  background:#fff;border-radius:var(--r-xl);
  padding:32px 24px 24px;text-align:center;
  max-width:380px;width:100%;
  box-shadow:0 30px 70px -20px rgba(15,23,42,.4);
  animation:modalIn .35s cubic-bezier(.34,1.4,.64,1);
}
.searching-radar{
  position:relative;width:90px;height:90px;margin:0 auto 20px;
}
.searching-radar .sr-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2.5px solid var(--p);opacity:0;
  animation:radarPulse 2.4s ease-in-out infinite;
}
.searching-radar .sr-ring:nth-child(2){animation-delay:.8s}
.searching-radar .sr-ring:nth-child(3){animation-delay:1.6s}
@keyframes radarPulse{
  0%{transform:scale(.4);opacity:.85}
  100%{transform:scale(1.65);opacity:0}
}
.searching-radar .sr-center{
  position:absolute;inset:24px;border-radius:50%;
  background:linear-gradient(135deg,#16a34a,#0b5f28);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;z-index:2;

async function reverseGeocodeCity(lat, lng){
  try{
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=12&accept-language=en`;
    const r = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!r.ok) return null;
    const j = await r.json();
    const a = j.address || {};
    const city = a.city || a.town || a.village || a.municipality || a.county || a.state_district || '';
    const country = a.country || '';
    return { city, country, full: j.display_name || '', address: a };
  }catch(e){ return null; }
}

async function reverseGeocodePrecise(lat, lng){
  try{
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=19&addressdetails=1&namedetails=1&extratags=1&accept-language=en`;
    const r = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!r.ok) return null;
    const j = await r.json();
    const a = j.address || {};
    const nd = j.namedetails || {};
    const poi = j.name || nd.name || nd['name:en'] || a.amenity || a.building || a.shop || a.tourism || a.office || '';
    const house = a.house_number || '';
    const road = a.road || a.pedestrian || a.footway || a.path || a.street || a.residential || '';
    const neighbourhood = a.neighbourhood || a.quarter || a.hamlet || '';
    const suburb = a.suburb || a.city_district || '';
    const city = a.city || a.town || a.village || a.municipality || a.county || '';
    const country = a.country || '';
    let primary = poi;
    if(!primary && house && road) primary = `${house} ${road}`;
    if(!primary && road) primary = road;
    if(!primary && neighbourhood) primary = neighbourhood;
    if(!primary && city) primary = city;
    if(!primary) primary = 'Current location';
    const parts = [];
    if(poi && road && road !== poi) parts.push(road);
    if(neighbourhood && neighbourhood !== primary) parts.push(neighbourhood);
    if(suburb && suburb !== neighbourhood && suburb !== primary) parts.push(suburb);
    if(city && city !== suburb && city !== primary) parts.push(city);
    const label = parts.length ? `${primary}, ${parts.join(', ')}` : primary;
    return { lat, lng, label, primary, secondary: parts.join(', '), city, country, house, road, neighbourhood, suburb, address: j.display_name || '', poi };
  }catch(e){ return null; }
}

async function loadWeatherByCoords(lat, lng){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4`;
    const r = await fetch(url);
    const j = await r.json();
    return {
      temp: Math.round(j.current.temperature_2m),
      hum: j.current.relative_humidity_2m,
      wind: Math.round(j.current.wind_speed_10m),
      code: j.current.weather_code,
      isDay: j.current.is_day === 1,
      hi: Math.round(j.daily.temperature_2m_max[0]),
      lo: Math.round(j.daily.temperature_2m_min[0]),
      daily: j.daily.time.slice(1,4).map((d,i)=>({
        day: new Date(d).toLocaleDateString('en-GB',{weekday:'short'}),
        hi: Math.round(j.daily.temperature_2m_max[i+1]),
        lo: Math.round(j.daily.temperature_2m_min[i+1]),
        code: j.daily.weather_code[i+1]
      }))
    };
  }catch(e){ console.warn('weather', e); return null; }
}

function formatLiveClock(d){
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm} ${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()} ${d.getFullYear()}`;
}
function startLiveClock(){
  const tick = ()=>{
    const el = document.getElementById('liveClockText');
    if(el) el.textContent = formatLiveClock(new Date());
  };
  tick();
  clearInterval(S.liveClockTimer);
  S.liveClockTimer = setInterval(tick, 30000);
}

function uploadImage(folder='agri', resourceType='image'){
  return new Promise((resolve, reject)=>{
    if(typeof cloudinary === 'undefined' || !cloudinary.openUploadWidget){
      reject(new Error('Upload widget not loaded'));
      return;
    }
    cloudinary.openUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      sources:['local','camera'],
      multiple:false,
      maxFiles:1,
      maxFileSize:50000000,
      resourceType: resourceType,
      clientAllowedFormats: resourceType === 'video' ? ['mp4','mov','webm'] : ['jpg','jpeg','png','webp','heic'],
      cropping:false,
      folder:'agri/'+folder
    }, (err, res)=>{
      if(err) return reject(err);
      if(res && res.event==='success' && res.info) resolve(res.info.secure_url);
    });
  });
}

let activeScreenEl = null;
function buildScreen(id){
  const wrap = document.querySelector('.screen-wrap');
  let el = document.getElementById('screen-'+id);
  if(!el){
    el = document.createElement('div');
    el.className = 'screen';
    el.id = 'screen-'+id;
    wrap.appendChild(el);
  }
  return el;
}

function showScreen(id, data={}, pushHistory=true){
  S.screenData = data || {};
  const target = buildScreen(id);
  if(activeScreenEl && activeScreenEl !== target) activeScreenEl.classList.remove('active');
  void target.offsetWidth;
  target.classList.add('active');
  activeScreenEl = target;
  S.screen = id;
  route();
  if(pushHistory){
    try{ history.pushState({screen:id, data}, '', '#'+id); }catch(e){}
  }
  updateNav(id);
  const sc = target.querySelector('.scroll');
  if(sc) sc.scrollTop = 0;
  updateCartFloat();
  startLiveClock();
  // Cleanup delivery hero map when leaving delivery screen
  if(id !== 'delivery' && S.heroMap){
    try{ S.heroMap.remove(); }catch(e){}
    S.heroMap = null;
  }
  if(S.heroDriverListener){
    try{ S.heroDriverListener(); }catch(e){}
    S.heroDriverListener = null;
  }
}

window.addEventListener('popstate', e=>{
  if($modal.classList.contains('open')){ closeModal(); return; }
  if($vsheetOverlay.classList.contains('open')){ closeVsheet(); return; }
  if($searchingOverlay.classList.contains('open')){ closeSearching(); return; }
  const st = e.state || {};
  const id = st.screen || 'home';
  if(!document.getElementById('screen-'+id)){ showScreen('home', {}, false); return; }
  showScreen(id, st.data || {}, false);
});

function updateNav(id){
  const nav = document.getElementById('bnav');
  if(!nav) return;
  const map = {home:'home', explore:'explore', community:'community', delivery:'delivery', profile:'profile'};
  nav.querySelectorAll('.bn').forEach(b=>{
    const s = b.dataset.nav;
    b.classList.toggle('active', map[id] === s || (id==='myfarm' && s==='home'));
  });
}

function updateCartFloat(){
  const count = S.cart.reduce((s,c)=>s+c.qty,0);
  $cartCount.textContent = count;
  if(count > 0 && S.screen !== 'supplier-cart' && S.screen !== 'supplier-checkout'){
    $cartFloat.classList.add('show');
  } else {
    $cartFloat.classList.remove('show');
  }
}
window.addToSupplierCart = (productId)=>{
  const existing = S.cart.find(c=>c.productId === productId);
  if(existing) existing.qty++;
  else S.cart.push({productId, qty: 1});
  updateCartFloat();
  toast('Added to cart 🛒');
};
window.removeFromSupplierCart = (productId)=>{
  S.cart = S.cart.filter(c=>c.productId !== productId);
  updateCartFloat();
  if(S.screen === 'supplier-cart') document.getElementById('screen-supplier-cart').innerHTML = renderSupplierCart();
};
window.changeCartQty = (productId, delta)=>{
  const item = S.cart.find(c=>c.productId === productId);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) S.cart = S.cart.filter(c=>c.productId !== productId);
  updateCartFloat();
  if(S.screen === 'supplier-cart') document.getElementById('screen-supplier-cart').innerHTML = renderSupplierCart();
};
window.openSupplierCart = ()=>{
  if(S.cart.length === 0){ toast('Cart is empty'); return; }
  navTo('supplier-cart');
};

function renderNotifications(){
  if(!S.notifications.length){
    $notifBody.innerHTML = `<div class="notif-empty"><div class="ne-ic">🔔</div><div>No notifications yet</div></div>`;
    return;
  }
  $notifBody.innerHTML = S.notifications.map(n=>{
    const ic = n.type === 'order' ? '📦' : n.type === 'delivery' ? '🚚' : n.type === 'community' ? '💬' : n.type === 'weather' ? '⛅' : n.type === 'market' ? '🛒' : n.type === 'comment' ? '💬' : n.type === 'goods' ? '🌾' : n.type === 'follow' ? '👤' : '🔔';
    const cls = n.severity === 'warn' ? 'warn' : n.severity === 'info' ? 'info' : n.severity === 'danger' ? 'danger' : '';
    return `<div class="notif-item ${n.read ? '' : 'unread'}" onclick="onNotifClick('${esc(n.id)}','${esc(n.link||'')}')">

        <div class="n-text">${esc(n.text || '')}</div>

function startNotificationsListener(){
  if(!S.user) return;
  if(S.notificationsUnsub) S.notificationsUnsub();
  const r = ref(db, `users/${S.user.uid}/notifications`);
  S.notificationsUnsub = onValue(r, (snap)=>{
    const data = snap.val() || {};
    const arr = Object.entries(data).map(([id, v])=>({id, ...v}));
    arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.notifications = arr;
    S.unreadNotifCount = arr.filter(n=>!n.read).length;
    renderNotifications();
    const nav = document.getElementById('bnav');
    if(nav){
      const btn = nav.querySelector('[data-nav="community"]');
      if(btn){
        const existing = btn.querySelector('.bn-badge');
        if(S.unreadNotifCount){
          if(existing) existing.textContent = S.unreadNotifCount > 9 ? '9+' : S.unreadNotifCount;
          else btn.insertAdjacentHTML('beforeend', `<span class="bn-badge">${S.unreadNotifCount > 9 ? '9+' : S.unreadNotifCount}</span>`);
        } else if(existing) existing.remove();
      }
    }
  });
}

/* ============================================================
   NOTIFICATION LISTENERS (community, market, comments, orders, deliveries)
   ============================================================ */
function startContentNotificationListeners(){
  if(!S.user) return;
  const me = S.user.uid;

  // Load last seen timestamps
  try{
    get(ref(db, `users/${me}/lastSeen`)).then(s=>{
      if(s.exists()){
        const v = s.val() || {};
        S.lastSeen.community = v.community || 0;
        S.lastSeen.market = v.market || 0;
        S.lastSeen.myComments = v.myComments || 0;
        S.lastSeen.orders = v.orders || 0;
        S.lastSeen.deliveries = v.deliveries || 0;
      } else {
        // Initialize as now
        const now = Date.now();
        S.lastSeen = { community: now, market: now, myComments: now, orders: now, deliveries: now };
        update(ref(db, `users/${me}/lastSeen`), S.lastSeen).catch(()=>{});
      }
    }).catch(()=>{});
  }catch(e){}

  // 1. New community posts by others
  const unsubCommunity = onValue(ref(db, 'communityPosts'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.community || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([id, p])=>{
      if(!p || !p.createdAt) return;
      if(p.authorId === me) return;
      if(p.createdAt > lastSeen){
        pushNotification({
          type:'community',
          title:'💬 New community post',
          text: `${p.authorName || 'A farmer'}: ${(p.body||'').slice(0,60)}${(p.body||'').length>60?'…':''}`,
          link: 'screen:post-detail/'+id,
          severity:'info'
        });
        if(p.createdAt > latest) latest = p.createdAt;
      }
    });
    if(latest > lastSeen){
      S.lastSeen.community = latest;
      update(ref(db, `users/${me}/lastSeen`), { community: latest }).catch(()=>{});
    }
  }, ()=>{});

  // 2. New market listings by others
  const unsubMarket = onValue(ref(db, 'marketListings'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.market || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([id, m])=>{
      if(!m || !m.createdAt) return;
      if(m.seller_id === me) return;
      if(m.status === 'removed') return;
      if(m.createdAt > lastSeen){
        pushNotification({
          type:'market',
          title:'🌾 New goods posted',
          text: `${m.sellerName || 'A farmer'} listed ${m.title || m.productName || 'goods'} at ${fmtZMK(m.priceAmount)}`,
          link: 'screen:product-detail/'+id,
          severity:'info'
        });
        if(m.createdAt > latest) latest = m.createdAt;
      }
    });
    if(latest > lastSeen){
      S.lastSeen.market = latest;
      update(ref(db, `users/${me}/lastSeen`), { market: latest }).catch(()=>{});
    }
  }, ()=>{});

  // 3. New comments on my posts
  const unsubMyComments = onValue(ref(db, 'communityPosts'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.myComments || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([postId, p])=>{
      if(!p || p.authorId !== me) return;
      const comments = p.comments || {};
      Object.entries(comments).forEach(([cid, c])=>{
        if(!c || !c.createdAt) return;
        if(c.authorId === me) return;
        if(c.createdAt > lastSeen){
          pushNotification({
            type:'comment',
            title:'💬 New comment on your post',
            text: `${c.authorName || 'Someone'}: ${(c.text||'').slice(0,60)}${(c.text||'').length>60?'…':''}`,
            link: 'screen:post-detail/'+postId,
            severity:'info'
          });
          if(c.createdAt > latest) latest = c.createdAt;
        }
      });
    });
    if(latest > lastSeen){
      S.lastSeen.myComments = latest;
      update(ref(db, `users/${me}/lastSeen`), { myComments: latest }).catch(()=>{});
    }
  }, ()=>{});

  // 4. Order status changes (both orders and supplierOrders)
  const unsubOrders = onValue(ref(db, 'orders'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.orders || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([id, o])=>{
      if(!o || o.buyer_id !== me) return;
      const ts = o.updatedAt || o.createdAt || 0;
      if(ts > lastSeen){
        const statusTxt = (o.status||'pending').replace(/_/g,' ');
        pushNotification({
          type:'order',
          title:'📦 Order status',
          text: `Your order ${id} is now ${statusTxt}`,
          link: 'screen:my-posts',
          severity: o.status === 'completed' ? 'info' : 'warn'
        });
        if(ts > latest) latest = ts;
      }
    });
    if(latest > lastSeen){
      S.lastSeen.orders = latest;
      update(ref(db, `users/${me}/lastSeen`), { orders: latest }).catch(()=>{});
    }
  }, ()=>{});

  const unsubSupplierOrders = onValue(ref(db, 'supplierOrders'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.orders || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([id, o])=>{
      if(!o || o.buyerId !== me) return;
      const ts = o.updatedAt || o.createdAt || 0;
      if(ts > lastSeen){
        const statusTxt = (o.status||'pending_approval').replace(/_/g,' ');
        pushNotification({
          type:'order',
          title:'📦 Supplier order',
          text: `Order ${id} — ${statusTxt}`,
          link: 'screen:home',
          severity: o.status === 'approved' ? 'info' : 'warn'
        });
        if(ts > latest) latest = ts;
      }
    });
    if(latest > lastSeen){
      S.lastSeen.orders = latest;
      update(ref(db, `users/${me}/lastSeen`), { orders: latest }).catch(()=>{});
    }
  }, ()=>{});

  // 5. Delivery status changes
  const unsubDeliv = onValue(ref(db, 'deliveryRequests'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.deliveries || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([id, d])=>{
      if(!d || d.requester_id !== me) return;
      const ts = d.updatedAt || d.createdAt || 0;
      if(ts > lastSeen){
        const statusTxt = (d.status||'searching').replace(/_/g,' ');
        pushNotification({
          type:'delivery',
          title:'🚚 Delivery update',
          text: `Delivery ${id} — ${statusTxt}`,
          link: 'screen:delivery',
          severity: d.status === 'delivered' ? 'info' : 'warn'
        });
        if(ts > latest) latest = ts;
      }
    });
    if(latest > lastSeen){
      S.lastSeen.deliveries = latest;
      update(ref(db, `users/${me}/lastSeen`), { deliveries: latest }).catch(()=>{});
    }
  }, ()=>{});

  S.notifListeners = [unsubCommunity, unsubMarket, unsubMyComments, unsubOrders, unsubSupplierOrders, unsubDeliv];
}

/* ============================================================
   LOAD AGRIKNOWLEDGE
   ============================================================ */
async function loadAgriKnowledge(){
  try{
    const snap = await get(ref(db,'agriKnowledge'));
    if(!snap.exists()) return null;
    const data = snap.val();
    const cat = [];
    const push = (obj, groupLabel, subgroup)=>{
      if(!obj) return;
      Object.entries(obj).forEach(([k,v])=>{
        if(v && v.name){
          cat.push({
            id: k, key: k, name: v.name,
            scientificName: v.scientificName || '',
            group: v.group || groupLabel || '',
            category: groupLabel, subgroup: subgroup || '',
            enterpriseType: v.enterpriseType || groupLabel || 'Crop',
            icon: pickIcon(v.name), grad: gradFor(v.name),
            stages: v.stages || [],
            indicativeDuration: v.indicativeDuration || '',
            managementNotes: v.managementNotes || '',
            risks: v.risks || [],
            harvestSignal: v.harvestSignal || '',
            outputUnits: v.outputUnits || [],
            forecastMethod: v.forecastMethod || '',
            systems: v.systems || [],
            purpose: v.purpose || '',
            outputIndicators: v.outputIndicators || [],
            forecastApproach: v.forecastApproach || '',
            localNames: v.localNames || []
          });
        }
      });
    };
    if(data.crops?.fieldCrops) push(data.crops.fieldCrops, 'Field Crops', 'cereals');
    if(data.crops?.pulses)     push(data.crops.pulses, 'Pulses', 'legumes');
    if(data.crops?.vegetables) push(data.crops.vegetables, 'Vegetables', 'vegetables');
    if(data.crops?.fruits)     push(data.crops.fruits, 'Fruits', 'fruits');
    if(data.livestock)         push(data.livestock, 'Livestock', 'livestock');
    if(data.poultry)           push(data.poultry, 'Poultry', 'poultry');
    if(data.fisheries?.aquaculture) push(data.fisheries.aquaculture, 'Fisheries', 'aquaculture');
    if(data.fisheries?.capture)     push(data.fisheries.capture, 'Fisheries', 'capture');
    return { raw:data, catalogue:cat };
  }catch(e){ console.warn('agri', e); return null; }
}

        if(v && v.seller_id === uid) out.listings.push({id:k, ...v});
      });
    }
  }catch(e){ console.warn('loadUserData', e); }
  return out;
}

        if(v && v.role === 'supplier' && v.status === 'approved') out.push({id:k, ...v});
      });
    }
  }catch(e){}
  return out;
}

/* ============================================================
   ACTIVITY FORECAST
   ============================================================ */
function autoPredict(activity){
  if(!activity) return null;
  const k = (activity.species_or_crop_id||'').toLowerCase();
  const ag = S.catalogue.find(c=>c.id===k);
  if(!ag) return null;
  const scale = parseFloat(activity.scale_value) || 0;
  const unit = activity.scale_unit || '';
  if(ag.forecastMethod === 'area_based' && scale>0 && /ha|hectare/i.test(unit)){
    return { low: scale*1.5*1000, base: scale*2.5*1000, high: scale*4.0*1000, unit:'kg', confidence:'preliminary', note:'Planning range. Not a guarantee.' };
  }
  if(ag.forecastMethod === 'repeated_harvest' && scale>0){
    return { low: scale*2, base: scale*4, high: scale*6, unit:'kg', confidence:'preliminary', note:'Repeated harvest crop.' };
  }
  if(ag.enterpriseType === 'Livestock' || ag.enterpriseType === 'Poultry'){
    return { low: null, base: null, high: null, unit:'head', confidence:'management-dependent', note: ag.forecastApproach || 'Liveweight range.' };
  }
  if(ag.enterpriseType === 'Aquaculture'){
    return { low: null, base: null, high: null, unit:'kg biomass', confidence:'low', note:'Biomass = surviving fish × avg weight.' };
  }
  return null;
}

/* ============================================================
   STAGE TIMELINE
   ============================================================ */
const STAGE_ORDER = ['planned','planted','growing','flowering','fruiting','harvesting','ready_for_sale','completed'];
const STAGE_DAYS_FRACTION = {
  planned:0, planted:0.05, growing:0.2, flowering:0.5, fruiting:0.7, harvesting:0.9, ready_for_sale:1.0, completed:1.1
};
function getLifecycleDays(activity){
  const ag = S.catalogue.find(c=>c.id === activity.species_or_crop_id);
  if(ag && ag.indicativeDuration){
    const m = String(ag.indicativeDuration).match(/(\d+)\s*(day|week|month)/i);
    if(m){
      const num = parseInt(m[1]);
      const unit = m[2].toLowerCase();
      if(unit.startsWith('day')) return num;
      if(unit.startsWith('week')) return num * 7;
      if(unit.startsWith('month')) return num * 30;
    }
    const m2 = String(ag.indicativeDuration).match(/(\d+)\s*[-–]\s*(\d+)/);
    if(m2) return parseInt(m2[2]);
  }
  const t = (activity.enterprise_type || '').toLowerCase();
  if(t.includes('poultry')) return 45;
  if(t.includes('livestock')) return 180;
  if(t.includes('aquac')) return 150;
  return 120;
}
function computeStageInfo(activity){
  const plantedTs = activity.planted_date || activity.createdAt || Date.now();
  const daysIn = daysSince(plantedTs);
  const total = getLifecycleDays(activity);
  const currentStage = activity.stage_key || 'growing';
  const currentIdx = STAGE_ORDER.indexOf(currentStage);
  let nextStage = null, daysToNext = null;
  if(currentIdx >= 0 && currentIdx < STAGE_ORDER.length - 1){
    nextStage = STAGE_ORDER[currentIdx + 1];
    const frac = STAGE_DAYS_FRACTION[nextStage] || 1;
    const targetDay = Math.round(total * frac);
    daysToNext = Math.max(0, targetDay - daysIn);
  }
  const progressPct = Math.min(100, Math.round((daysIn / total) * 100));
  return { daysIn, total, currentStage, nextStage, daysToNext, progressPct };
}

window.toggleFollow = async (targetId, targetType, targetName, targetPhoto)=>{
  if(!S.user || !targetId) return;
  if(targetId === S.user.uid){ toast('You cannot follow yourself'); return; }
  const key = `${targetType}:${targetId}`;
  const followingRef = ref(db, `users/${S.user.uid}/following/${targetId}`);
  const existing = S.following[targetId];
  try{
    if(existing){
      await remove(followingRef);
      delete S.following[targetId];

      await set(followingRef, {
        targetId, targetType: targetType || 'farmer', targetName: targetName || 'Farmer',

window.toggleSelect = (id)=>{
  const opts = document.getElementById(id+'-options');
  const trigger = document.getElementById(id+'-trigger');
  if(!opts) return;
  opts.classList.toggle('open');
  trigger.classList.toggle('open', opts.classList.contains('open'));
};

window.selectOption = (id, value, label)=>{
  const opts = document.getElementById(id+'-options');
  const trigger = document.getElementById(id+'-trigger');
  if(trigger) trigger.querySelector('.st-value').textContent = label;
  document.getElementById(id).value = value;
  if(opts){
    opts.querySelectorAll('.select-option').forEach(o=>o.classList.remove('selected'));
    const match = opts.querySelector(`[data-value="${value}"]`);
    if(match) match.classList.add('selected');
    opts.classList.remove('open');
    trigger.classList.remove('open');
  }
};

window.switchCat = (id)=>{
  const el = document.getElementById('screen-create-activity');
  if(el) el.innerHTML = renderCreateActivity({category:id});
  wireCreateActivity();
  showScreen('create-activity', {category:id}, false);
  wireSelectOptions();
};

function wireSelectOptions(){
  document.querySelectorAll('.select-options').forEach(opts=>{
    opts.querySelectorAll('.select-option').forEach(o=>{
      o.addEventListener('click', ()=>{
        const id = opts.id.replace('-options','');
        window.selectOption(id, o.dataset.value, o.textContent.replace('✓','').trim());
      });
    });
  });
}

function wireCreateActivity(){
  wireSelectOptions();
  const box = document.getElementById('act-photo');
  if(!box) return;
  box.addEventListener('click', async()=>{
    try{
      const url = await uploadImage('activities');
      box.querySelector('.up-prev').src = url;
      box.classList.add('has-img');
      document.getElementById('act-photo-url').value = url;
    }catch(e){ if(!String(e).includes('cancel')) toast('Upload failed'); }
  });
}

window.submitActivity = async (ev)=>{
  ev.preventDefault();
  const err = document.getElementById('act-error');
  err.style.display='none';
  const btn = document.getElementById('act-submit');
  btn.disabled = true;
  const cat = document.getElementById('act-cat').value;
  const species = document.getElementById('act-species').value;
  const title = document.getElementById('act-title').value.trim();
  const variety = document.getElementById('act-variety').value.trim();
  const location = document.getElementById('act-location').value.trim();
  const scale = document.getElementById('act-scale').value;
  const unit = document.getElementById('act-unit').value;
  const start = document.getElementById('act-start').value;
  const stage = document.getElementById('act-stage').value;
  const photo = document.getElementById('act-photo-url').value;
  const vis = document.getElementById('act-vis').value;

  if(!species || !title || !scale || !start){
    err.textContent = 'Please fill in all required fields.';
    err.style.display='block';
    btn.disabled = false;
    return;
  }
  const catItem = S.catalogue.find(c=>c.id===species);
  const startTs = new Date(start).getTime();
  const durationDays = 120;
  const expectedReady = startTs + durationDays*86400000;

  const payload = {
    owner_user_id: S.user.uid,
    ownerName: (S.profile.firstName||'') + ' ' + (S.profile.lastName||''),
    ownerPhoto: S.profile.profileUrl || '',
    enterprise_type: catItem?.enterpriseType || 'Crop',
    category: cat,
    species_or_crop_id: species,
    speciesName: catItem?.name || species,
    title, variety_breed: variety, location,
    scale_value: scale, scale_unit: unit,
    planted_date: startTs,
    stage_key: stage,
    status: stage === 'ready_for_sale' ? 'ready_for_sale' : 'active',
    visibility: vis,
    coverUrl: photo,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    expected_ready_from: expectedReady
  };
  const forecast = autoPredict(payload);
  if(forecast){
    payload.forecast_low = forecast.low;
    payload.forecast_base = forecast.base;
    payload.forecast_high = forecast.high;
    payload.forecast_unit = forecast.unit;
    payload.forecast_confidence = forecast.confidence;
    payload.forecast_note = forecast.note;
  }
  try{
    const newRef = push(ref(db,'farmActivities'));
    await set(newRef, payload);
    S.myActivities.unshift({id:newRef.key, ...payload});
    toast('Activity created ✓');
    setTimeout(()=>{ navTo('myfarm'); }, 400);
  }catch(e){
    err.textContent = 'Error: ' + (e.message||e);
    err.style.display='block';
    btn.disabled = false;
  }
};

function renderFarmActivity(filter){
  filter = filter || 'all';
  let items = (S.allActivities||[]).filter(a=>a.owner_user_id !== S.user.uid);
  if(filter==='crops') items = items.filter(a=>['Field Crops','Pulses','Vegetables','Fruits','Crop'].includes(a.enterprise_type) || a.category==='crops');
  if(filter==='livestock') items = items.filter(a=>a.enterprise_type==='Livestock');
  if(filter==='poultry') items = items.filter(a=>a.enterprise_type==='Poultry');
  if(filter==='fisheries') items = items.filter(a=>a.enterprise_type?.includes('Aquaculture')||a.enterprise_type?.includes('Capture'));
