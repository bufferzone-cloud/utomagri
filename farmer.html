/* ============================================================
   WEATHER DETAIL — LIVE TIME + SUN / MOON ARC
   ============================================================ */
function pad2(n) { return String(n).padStart(2, '0'); }

function computeCelestialPosition(now) {
  const hour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  const isDay = hour >= 6 && hour < 18;
  let progress;
  if (isDay) {
    progress = (hour - 6) / 12;
  } else {
    const nightHour = hour >= 18 ? hour - 18 : hour + 6;
    progress = nightHour / 12;
  }
  progress = Math.max(0, Math.min(1, progress));
  const angle = Math.PI * (1 - progress);
  const cx = 150;
  const cy = 120;
  const r = 100;
  const x = cx - r * Math.cos(angle);
  const y = cy - r * Math.sin(angle);
  return { x, y, isDay, hour, progress };
}

function startWeatherClock() {
  clearInterval(S.weatherClockTimer);
  const tick = () => {
    const now = new Date();
    const timeEl = document.getElementById('weather-live-time');
    const dateEl = document.getElementById('weather-live-date');
    const badgeEl = document.getElementById('weather-live-badge');
    const celestialEl = document.getElementById('weather-celestial-body');
    const glowEl = document.getElementById('weather-celestial-glow');
    const sunGroup = document.getElementById('celestial-sun');
    const moonGroup = document.getElementById('celestial-moon');
    const noteEl = document.getElementById('weather-celestial-note');

    const hh = pad2(now.getHours());
    const mm = pad2(now.getMinutes());
    const ss = pad2(now.getSeconds());
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    if (timeEl) timeEl.textContent = `${hh}:${mm}:${ss}`;
    if (dateEl) dateEl.textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

    const pos = computeCelestialPosition(now);

    if (badgeEl) {
      badgeEl.textContent = pos.isDay ? '☀️ Day' : '🌙 Night';
      badgeEl.classList.toggle('night', !pos.isDay);
    }

    if (celestialEl && glowEl) {
      celestialEl.setAttribute('cx', pos.x.toFixed(1));
      celestialEl.setAttribute('cy', pos.y.toFixed(1));
      glowEl.setAttribute('cx', pos.x.toFixed(1));
      glowEl.setAttribute('cy', pos.y.toFixed(1));
    }

    if (sunGroup && moonGroup) {
      sunGroup.style.display = pos.isDay ? 'inline' : 'none';
      moonGroup.style.display = pos.isDay ? 'none' : 'inline';
    }

    if (noteEl) {
      if (pos.isDay) {
        noteEl.textContent = `Sun is ${Math.round(pos.progress * 100)}% across the sky. Sunrise 6:00 · Sunset 18:00.`;
      } else {
        noteEl.textContent = `Moon is ${Math.round(pos.progress * 100)}% across the night sky. Night runs 18:00 → 6:00.`;
      }
    }
  };
  tick();
  S.weatherClockTimer = setInterval(tick, 1000);
}

function renderMarketAnalysis() {
  const all = S.allFarmersBatches || [];
  const active = all.filter(b => b.stage !== 'harvested');
  const harvested = all.filter(b => b.stage === 'harvested');

  const byCrop = {};
  active.forEach(b => {
    byCrop[b.cropName] = (byCrop[b.cropName] || 0) + (b.estimatedBoxes || 0);
  });
  const sorted = Object.entries(byCrop).sort((a, b) => b[1] - a[1]);
  const totalBoxes = sorted.reduce((s, [, v]) => s + v, 0);

  const topCrop = sorted[0];

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="tb-title">Market Analysis</div>
    </div>

    <div class="ma-header">
      <h2>📊 Market Intelligence</h2>
      <p>What all AgriCare farmers are planting and expected supply across Zambia.</p>
    </div>

    <div class="ma-stats">
      <div class="ma-stat"><div class="ms-lb">Active Batches</div><div class="ms-v">${active.length}</div><div class="ms-sub">all farmers</div></div>
      <div class="ma-stat"><div class="ms-lb">Expected Boxes</div><div class="ms-v">${totalBoxes.toLocaleString()}</div><div class="ms-sub">in the pipeline</div></div>
      <div class="ma-stat"><div class="ms-lb">Harvested</div><div class="ms-v">${harvested.length}</div><div class="ms-sub">batches</div></div>
      <div class="ma-stat"><div class="ms-lb">Top Crop</div><div class="ms-v" style="font-size:16px">${topCrop ? esc(topCrop[0]) : '—'}</div><div class="ms-sub">${topCrop ? topCrop[1].toLocaleString() + ' boxes' : ''}</div></div>
    </div>

    <div class="ma-section">
      <h3>Supply by Crop</h3>
      ${sorted.length ? sorted.map(([name, boxes]) => {
        const pct = totalBoxes ? Math.round(boxes / totalBoxes * 100) : 0;
        const cls = pct > 50 ? 'danger' : pct > 30 ? 'warn' : '';
        return `
          <div class="ma-bar-row">
            <div class="ma-bar-top"><span>${pickIcon(name)} ${esc(name)}</span><span>${boxes.toLocaleString()} boxes (${pct}%)</span></div>
            <div class="ma-bar-track"><div class="ma-bar-fill ${cls}" style="width:${pct}%"></div></div>
          </div>`;
      }).join('') : `<div class="empty" style="padding:20px"><p>No active batches yet.</p></div>`}
    </div>

    ${sorted.length && sorted[0][1] / totalBoxes > 0.5 ? `
    <div class="ma-section">
      <div class="ma-warning">
        ⚠️ <strong>Market saturation risk:</strong> Over 50% of expected supply is <strong>${esc(sorted[0][0])}</strong>.
        Consider diversifying or negotiating contracts early.
      </div>
    </div>
    ` : ''}

    <div class="ma-section">
      <h3>Expected Harvest Windows</h3>
      ${active.slice(0, 10).map(b => `
        <div class="info-row">
          <span class="ir-k">${pickIcon(b.cropName)} ${esc(b.cropName)}</span>
          <span class="ir-v">${fmtDate(b.harvestStart)} – ${fmtDate(b.harvestEnd)}</span>
        </div>
      `).join('')}
    </div>

    <div class="ma-section">
      <h3>Your Position</h3>
      <div class="info-row"><span class="ir-k">Your active batches</span><span class="ir-v">${S.myBatches.filter(b => b.stage !== 'harvested').length}</span></div>
      <div class="info-row"><span class="ir-k">Your expected boxes</span><span class="ir-v">${S.myBatches.filter(b => b.stage !== 'harvested').reduce((s, b) => s + (b.estimatedBoxes || 0), 0).toLocaleString()}</span></div>
    </div>

    <div style="height:8px"></div>
  </div>
  ${bottomNavHTML()}`;
}

window.setFarmersCity = (city) => { S.farmersCity = city; route(); };

function renderFarmersByCity() {
  const all = (S.allFarmersBatches || []).filter(b => b.town);
  const cityMap = {};
  all.forEach(b => { cityMap[b.town] = (cityMap[b.town] || 0) + 1; });
  const cities = Object.keys(cityMap).sort((a, b) => cityMap[b] - cityMap[a]);

  const selected = S.farmersCity || S.weatherCity || (cities[0] || 'Lusaka');
  if (!S.farmersCity) S.farmersCity = selected;

  const filtered = all.filter(b => b.town === selected);

  // group by crop
  const byCrop = {};
  filtered.forEach(b => {
    if (!byCrop[b.cropName]) byCrop[b.cropName] = { expected: 0, count: 0, harvested: 0, active: 0 };
    byCrop[b.cropName].count++;
    byCrop[b.cropName].expected += b.estimatedBoxes || 0;
    if (b.stage === 'harvested') byCrop[b.cropName].harvested++;
    else byCrop[b.cropName].active++;
  });
  const cropList = Object.entries(byCrop).sort((a, b) => b[1].expected - a[1].expected);

  const totalExpected = filtered.reduce((s, b) => s + (b.estimatedBoxes || 0), 0);
  const totalFarmers = new Set(filtered.map(b => b.ownerId)).size;

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="tb-title">Farmers by City</div>
    </div>

    <div class="analysis-hero">
      <h2>🧑‍🌾 Farmers by City</h2>
      <p>See what other AgriCare farmers are planting and raising in each town.</p>
    </div>

    <div class="city-chips">
      ${cities.length ? cities.map(c => `
        <button class="city-chip ${c === selected ? 'active' : ''}" onclick="setFarmersCity('${esc(c)}')">
          📍 ${esc(c)} <span style="opacity:.7;font-weight:700">·${cityMap[c]}</span>
        </button>
      `).join('') : `<div style="color:var(--tl);font-weight:700;font-size:12px;padding:6px 12px">No farmers recorded yet.</div>`}
    </div>

    <div class="analysis-stat-grid">
      <div class="as-card highlight">
        <div class="as-ic">🧑‍🌾</div>
        <div class="as-lb">Farmers here</div>
        <div class="as-v">${totalFarmers}</div>
        <div class="as-sub">in ${esc(selected)}</div>
      </div>
      <div class="as-card">
        <div class="as-ic">🌱</div>
        <div class="as-lb">Batches</div>
        <div class="as-v">${filtered.length}</div>
        <div class="as-sub">planted here</div>
      </div>
      <div class="as-card">
        <div class="as-ic">📦</div>
        <div class="as-lb">Expected boxes</div>
        <div class="as-v">${totalExpected.toLocaleString()}</div>
        <div class="as-sub">coming to market</div>
      </div>
      <div class="as-card">
        <div class="as-ic">🥇</div>
        <div class="as-lb">Top crop</div>
        <div class="as-v" style="font-size:16px">${cropList.length ? esc(cropList[0][0]) : '—'}</div>
        <div class="as-sub">${cropList.length ? cropList[0][1].expected.toLocaleString() + ' boxes' : '—'}</div>
      </div>
    </div>

    <div class="ma-section">
      <h3>By Crop in ${esc(selected)}</h3>
      ${cropList.length ? cropList.map(([name, data], idx) => {
        const pct = totalExpected ? Math.round(data.expected / totalExpected * 100) : 0;
        return `
          <div class="analysis-crop-row">
            <div class="acr-head">
              <div class="acr-name">${pickIcon(name)} ${esc(name)}</div>
              ${idx === 0 ? `<span class="acr-top">🥇 Top</span>` : `<span style="font-size:11px;color:var(--tl);font-weight:700">${pct}%</span>`}
            </div>
            <div class="acr-bars">
              <div class="acr-bar-row">
                <span class="acr-bar-lb">Batches</span>
                <div class="acr-bar-track"><div class="acr-bar-fill exp" style="width:${Math.min(100, data.count / Math.max(1, filtered.length) * 100)}%"></div></div>
                <span class="acr-bar-val">${data.count}</span>
              </div>
              <div class="acr-bar-row">
                <span class="acr-bar-lb">Boxes</span>
                <div class="acr-bar-track"><div class="acr-bar-fill act" style="width:${Math.min(100, data.expected / Math.max(1, totalExpected) * 100)}%"></div></div>
                <span class="acr-bar-val">${data.expected.toLocaleString()}</span>
              </div>
            </div>
          </div>`;
      }).join('') : `<div class="empty" style="padding:20px"><p>No crops planted here yet.</p></div>`}
    </div>

    <div class="ma-section">
      <h3>Recent batches</h3>
      ${filtered.slice(0, 10).map(b => `
        <div class="info-row">
          <span class="ir-k">${pickIcon(b.cropName)} ${esc(b.cropName)} <span style="color:var(--tl);font-weight:600"> · ${esc(b.varietyName || '')}</span></span>
          <span class="ir-v">${fmtDate(b.plantedDate)}</span>
        </div>
      `).join('')}
    </div>

    <div style="height:8px"></div>
  </div>
  ${bottomNavHTML()}`;
}

/* ============================================================
   NEW · FARM ANALYSIS (yearly + city)
   ============================================================ */
window.setAnalysisYear = (y) => { S.analysisYear = parseInt(y); route(); };
window.setAnalysisCity = (c) => { S.analysisCity = c; route(); };

function renderFarmAnalysis() {
  const all = (S.allFarmersBatches || []).filter(b => b.plantedDate);

  const years = [...new Set(all.map(b => new Date(b.plantedDate).getFullYear()))].sort((a, b) => b - a);
  const cities = [...new Set(all.map(b => b.town).filter(Boolean))].sort();

  const selYear = S.analysisYear || (years[0] || new Date().getFullYear());
  const selCity = S.analysisCity || 'all';

  const filtered = all.filter(b => {
    const y = new Date(b.plantedDate).getFullYear();
    if (y !== selYear) return false;
    if (selCity !== 'all' && b.town !== selCity) return false;
    return true;
  });

  const totalBatches = filtered.length;
  const harvestedBatches = filtered.filter(b => b.stage === 'harvested');
  const totalExpected = filtered.reduce((s, b) => s + (b.estimatedBoxes || 0), 0);
  const totalActual = filtered.reduce((s, b) => s + (b.actualBoxes || 0), 0);
  const deltaPct = totalExpected ? Math.round((totalActual - totalExpected) / totalExpected * 100) : 0;
  const efficiency = totalExpected ? Math.round(totalActual / totalExpected * 100) : 0;

  // by crop
  const byCrop = {};
  filtered.forEach(b => {
    if (!byCrop[b.cropName]) byCrop[b.cropName] = { expected: 0, actual: 0, count: 0, harvested: 0 };
    byCrop[b.cropName].count++;
    byCrop[b.cropName].expected += b.estimatedBoxes || 0;
    byCrop[b.cropName].actual += b.actualBoxes || 0;
    if (b.stage === 'harvested') byCrop[b.cropName].harvested++;
  });

  const sortedCrops = Object.entries(byCrop).sort((a, b) => b[1].expected - a[1].expected);
  const topCrop = sortedCrops[0];

  // top farmers
  const byFarmer = {};
  filtered.forEach(b => {
    if (!byFarmer[b.ownerId]) byFarmer[b.ownerId] = { name: b.ownerName || 'Farmer', count: 0, expected: 0, actual: 0, city: b.town || '' };
    byFarmer[b.ownerId].count++;
    byFarmer[b.ownerId].expected += b.estimatedBoxes || 0;
    byFarmer[b.ownerId].actual += b.actualBoxes || 0;
  });
  const topFarmers = Object.values(byFarmer).sort((a, b) => b.actual - a.actual || b.expected - a.expected).slice(0, 5);

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="tb-title">Farm Analysis</div>
    </div>

    <div class="analysis-hero">
      <h2>📈 Farm Analysis · ${selYear}</h2>
      <p>Historical production across Zambia. Compare what was planted, expected and produced.</p>
    </div>

    <!-- Filters -->
    <div class="analysis-filters">
      <div class="af-box">
        <label>Year</label>
        <div class="af-value"><span>📅 ${selYear}</span><span class="st-arrow">▼</span></div>
        <select onchange="setAnalysisYear(this.value)">
          ${years.length ? years.map(y => `<option value="${y}" ${y === selYear ? 'selected' : ''}>${y}</option>`).join('') : `<option>${selYear}</option>`}
        </select>
      </div>
      <div class="af-box">
        <label>City</label>
        <div class="af-value"><span>📍 ${selCity === 'all' ? 'All cities' : esc(selCity)}</span><span class="st-arrow">▼</span></div>
        <select onchange="setAnalysisCity(this.value)">
          <option value="all" ${selCity === 'all' ? 'selected' : ''}>All cities</option>
          ${cities.map(c => `<option value="${esc(c)}" ${c === selCity ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
    </div>

    <!-- Stats grid -->
    <div class="analysis-stat-grid">
      <div class="as-card">
        <div class="as-ic">🌱</div>
        <div class="as-lb">Batches</div>
        <div class="as-v">${totalBatches}</div>
        <div class="as-sub">${harvestedBatches.length} harvested</div>
      </div>
      <div class="as-card">
        <div class="as-ic">📦</div>
        <div class="as-lb">Expected</div>
        <div class="as-v">${totalExpected.toLocaleString()}</div>
        <div class="as-sub">boxes planned</div>
      </div>
      <div class="as-card highlight">
        <div class="as-ic">✅</div>
        <div class="as-lb">Produced</div>
        <div class="as-v">${totalActual.toLocaleString()}</div>
        <div class="as-sub">actual boxes</div>
      </div>
      <div class="as-card">
        <div class="as-ic">${deltaPct >= 0 ? '📈' : '📉'}</div>
        <div class="as-lb">Efficiency</div>
        <div class="as-v">${efficiency}%</div>
        <div class="as-sub as-delta ${deltaPct >= 0 ? 'up' : 'down'}">${deltaPct >= 0 ? '+' : ''}${deltaPct}% vs expected</div>
      </div>
      <div class="as-card">
        <div class="as-ic">🥇</div>
        <div class="as-lb">Top crop</div>
        <div class="as-v" style="font-size:16px">${topCrop ? esc(topCrop[0]) : '—'}</div>
        <div class="as-sub">${topCrop ? topCrop[1].expected.toLocaleString() + ' boxes' : '—'}</div>
      </div>
      <div class="as-card">
        <div class="as-ic">🧑‍🌾</div>
        <div class="as-lb">Farmers</div>
        <div class="as-v">${Object.keys(byFarmer).length}</div>
        <div class="as-sub">contributed</div>
      </div>
    </div>

    <!-- Per crop -->
    <div class="ma-section">
      <h3>Production by Crop</h3>
      ${sortedCrops.length ? sortedCrops.map(([name, data], idx) => {
        const maxVal = Math.max(data.expected, data.actual, 1);
        const isTop = idx === 0;
        return `
          <div class="analysis-crop-row">
            <div class="acr-head">
              <div class="acr-name">${pickIcon(name)} ${esc(name)}</div>
              ${isTop ? `<span class="acr-top">🥇 Top</span>` : `<span style="font-size:11px;color:var(--tl);font-weight:700">${data.count} batches</span>`}
            </div>
            <div class="acr-bars">
              <div class="acr-bar-row">
                <span class="acr-bar-lb">Expected</span>
                <div class="acr-bar-track"><div class="acr-bar-fill exp" style="width:${Math.min(100, data.expected / maxVal * 100)}%"></div></div>
                <span class="acr-bar-val">${data.expected.toLocaleString()}</span>
              </div>
              <div class="acr-bar-row">
                <span class="acr-bar-lb">Actual</span>
                <div class="acr-bar-track"><div class="acr-bar-fill act" style="width:${Math.min(100, data.actual / maxVal * 100)}%"></div></div>
                <span class="acr-bar-val">${data.actual.toLocaleString()}</span>
              </div>
            </div>
          </div>`;
      }).join('') : `<div class="empty" style="padding:20px"><p>No batches recorded for this filter.</p></div>`}
    </div>

    ${topFarmers.length ? `
    <div class="ma-section">
      <h3>Top Producing Farmers</h3>
      ${topFarmers.map((f, i) => `
        <div class="info-row">
          <span class="ir-k">${i + 1}. ${esc(f.name)} <span style="color:var(--tl);font-weight:600"> · ${esc(f.city)}</span></span>
          <span class="ir-v">${f.actual.toLocaleString()} boxes</span>
        </div>
      `).join('')}
    </div>
    ` : ''}

    ${sortedCrops.length && sortedCrops[0][1].expected / Math.max(1, totalExpected) > 0.5 ? `
    <div class="ma-section">
      <div class="ma-warning">
        ⚠️ <strong>Historical saturation:</strong> Over 50% of ${selYear} output was <strong>${esc(sortedCrops[0][0])}</strong>.
        Diversify the next cycle to reduce price risk.
      </div>
    </div>
    ` : ''}

    <div style="height:8px"></div>
  </div>
  ${bottomNavHTML()}`;
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function startApp() {
  const splash = document.getElementById('splash');
  requestAnimationFrame(() => splash.classList.add('show'));

  onAuthStateChanged(auth, async (user) => {
    await new Promise(r => setTimeout(r, 2500));
    if (!user) {
      window.location.href = 'index.html';
      return;
    }

    S.user = user;
    await loadAgriKnowledge();
    const ud = await loadUserData(user.uid);
    S.profile = ud.profile || {};
    S.myListings = ud.listings || [];
    S.following = ud.following || {};
    S.myBatches = ud.batches || [];

    if (S.profile.location) S.userLocation = S.profile.location;
    if (S.profile.city) S.weatherCity = S.profile.city;

    S.marketplace = await loadMarketplace();
    startNotificationsListener();
    startAllBatchesListener();
    startMarketplaceListener();

    const app = document.getElementById('app');
    app.innerHTML = `<div class="screen-wrap"></div>`;
    const wrap = app.querySelector('.screen-wrap');
    const home = document.createElement('div');
    home.className = 'screen';
    home.id = 'screen-home';
    wrap.appendChild(home);
    activeScreenEl = home;
    S.screen = 'home';
    home.classList.add('active');
    route();
    try { history.replaceState({ screen: 'home' }, '', '#home'); } catch (e) {}

    await detectUserCityAndWeather();

    clearInterval(S.weatherRefreshTimer);
    S.weatherRefreshTimer = setInterval(async () => {
      if (S.userCoords) {
        S.weather = await loadWeatherByCoords(S.userCoords.lat, S.userCoords.lng);
        if (S.screen === 'home' || S.screen === 'weather-detail') route();
      }
    }, 30 * 60 * 1000);
  });
}

startApp();

setTimeout(() => {
  const splash = document.getElementById('splash');
  if (splash && splash.parentNode) {
    setTimeout(() => {
      splash.classList.remove('show');
      setTimeout(() => {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 1000);
    }, 300);
  }
}, 2700);

window.addEventListener('unhandledrejection', e => {
  console.warn('Unhandled:', e.reason);
});
</script>
