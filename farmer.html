function uploadImage(folder='agri'){
  return new Promise((resolve, reject)=>{
    if(typeof cloudinary === 'undefined' || !cloudinary.openUploadWidget){
      reject(new Error('Upload widget not loaded'));
      return;
    }
    cloudinary.openUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      sources: ['local','camera'],
      multiple: false,
      maxFiles: 1,
      maxFileSize: 50000000,
      resourceType: 'image',
      clientAllowedFormats: ['jpg','jpeg','png','webp','heic'],
      cropping: false,
      folder: 'agri/' + folder
    }, (err, res)=>{
      if(err) return reject(err);
      if(res && res.event === 'success' && res.info){
        resolve(res.info.secure_url);
      }
    });
  });
}

function updateCartFloat(){
  const count = S.cart.reduce((s,c)=>s+c.qty, 0);
  $cartCount.textContent = count;
  if(count > 0 && S.screen !== 'supplier-cart' && S.screen !== 'supplier-checkout'){
    $cartFloat.classList.add('show');

  }

window.addToSupplierCart = (pid)=>{
  const ex = S.cart.find(c=>c.productId === pid);
  if(ex) ex.qty++;
  else S.cart.push({productId: pid, qty: 1});
  updateCartFloat();
  toast('Added to cart 🛒');
};

window.removeFromSupplierCart = (pid)=>{
  S.cart = S.cart.filter(c=>c.productId !== pid);
  updateCartFloat();
  if(S.screen === 'supplier-cart'){
    document.getElementById('screen-supplier-cart').innerHTML = renderSupplierCart();

window.changeCartQty = (pid, d)=>{
  const item = S.cart.find(c=>c.productId === pid);
  if(!item) return;
  item.qty += d;
  if(item.qty <= 0){
    S.cart = S.cart.filter(c=>c.productId !== pid);
  }
  updateCartFloat();
  if(S.screen === 'supplier-cart'){
    document.getElementById('screen-supplier-cart').innerHTML = renderSupplierCart();
  }
};

/* ============================================================
   CONTENT NOTIFICATION LISTENERS
   ============================================================ */
function startContentNotificationListeners(){
  if(!S.user) return;
  const me = S.user.uid;

  try{
    get(ref(db, `users/${me}/lastSeen`)).then(s=>{
      if(s.exists()){
        const v = s.val() || {};
        S.lastSeen.market = v.market || 0;
        S.lastSeen.orders = v.orders || 0;
        S.lastSeen.deliveries = v.deliveries || 0;
      } else {
        const now = Date.now();
        S.lastSeen = {market: now, orders: now, deliveries: now};
        update(ref(db, `users/${me}/lastSeen`), S.lastSeen).catch(()=>{});
      }
    }).catch(()=>{});
  }catch(e){}

  const unsubMarket = onValue(ref(db, 'marketListings'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.market || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([id, m])=>{
      if(!m || !m.createdAt) return;
      if(m.seller_id === me) return;
      if(m.status === 'removed') return;
      if(m.createdAt > lastSeen){
        pushNotification({
          type:'market',
          title:'🌾 New goods posted',
          text:`${m.sellerName || 'A farmer'} listed ${m.title || m.productName || 'goods'} at ${fmtZMK(m.priceAmount)}`,
          link:'screen:product-detail/'+id,
          severity:'info'
        });
        if(m.createdAt > latest) latest = m.createdAt;
      }
    });
    if(latest > lastSeen){
      S.lastSeen.market = latest;
      update(ref(db, `users/${me}/lastSeen`), {market: latest}).catch(()=>{});
    }
  }, ()=>{});

  const unsubOrders = onValue(ref(db, 'orders'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.orders || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([id, o])=>{
      if(!o || o.buyer_id !== me) return;
      const ts = o.updatedAt || o.createdAt || 0;
      if(ts > lastSeen){
        pushNotification({
          type:'order',
          title:'📦 Order status',
          text:`Your order ${id} is now ${(o.status||'pending').replace(/_/g,' ')}`,
          link:'screen:my-posts',
          severity:o.status === 'completed' ? 'info' : 'warn'
        });
        if(ts > latest) latest = ts;
      }
    });
    if(latest > lastSeen){
      S.lastSeen.orders = latest;
      update(ref(db, `users/${me}/lastSeen`), {orders: latest}).catch(()=>{});
    }
  }, ()=>{});

  const unsubDeliv = onValue(ref(db, 'deliveryRequests'), (snap)=>{
    const data = snap.val() || {};
    const lastSeen = S.lastSeen.deliveries || 0;
    let latest = lastSeen;
    Object.entries(data).forEach(([id, d])=>{
      if(!d || d.requester_id !== me) return;
      const ts = d.updatedAt || d.createdAt || 0;
      if(ts > lastSeen){
        pushNotification({
          type:'delivery',
          title:'🚚 Delivery update',
          text:`Delivery ${id} — ${(d.status||'searching').replace(/_/g,' ')}`,
          link:'screen:ongoing-deliveries',
          severity:d.status === 'delivered' ? 'info' : 'warn'
        });
        if(ts > latest) latest = ts;
      }
    });
    if(latest > lastSeen){
      S.lastSeen.deliveries = latest;
      update(ref(db, `users/${me}/lastSeen`), {deliveries: latest}).catch(()=>{});
    }
  }, ()=>{});

  S.notifListeners = [unsubMarket, unsubOrders, unsubDeliv];
}

   LOAD KNOWLEDGE BASE FROM FIREBASE
   ============================================================ */
async function loadAgriKnowledge(){
  try{
    const snap = await get(ref(db,'agriKnowledge'));
    if(!snap.exists()) return null;
    const data = snap.val();
    const cat = [];
    const push = (obj, category, subgroup)=>{
      if(!obj) return;
      Object.entries(obj).forEach(([k,v])=>{
        if(v && v.name){
          cat.push({
            id: k,
            name: v.name,
            scientificName: v.scientificName || '',
            group: v.group || category || '',
            category,
            subgroup: subgroup || '',
            enterpriseType: v.enterpriseType || category || 'Crop',
            icon: pickIcon(v.name),
            grad: gradFor(v.name),
            stages: v.stages || [],
            indicativeDuration: v.indicativeDuration || '',
            managementNotes: v.managementNotes || '',
            risks: v.risks || [],
            harvestSignal: v.harvestSignal || '',
            outputUnits: v.outputUnits || [],
            systems: v.systems || []
          });
        }
      });
    };
    if(data.crops?.fieldCrops) push(data.crops.fieldCrops, 'Field Crops', 'cereals');
    if(data.crops?.pulses)     push(data.crops.pulses, 'Pulses', 'legumes');
    if(data.crops?.vegetables) push(data.crops.vegetables, 'Vegetables', 'vegetables');
    if(data.crops?.fruits)     push(data.crops.fruits, 'Fruits', 'fruits');
    if(data.livestock)         push(data.livestock, 'Livestock', 'livestock');
    if(data.poultry)           push(data.poultry, 'Poultry', 'poultry');
    if(data.fisheries?.aquaculture) push(data.fisheries.aquaculture, 'Fisheries', 'aquaculture');
    if(data.fisheries?.capture)     push(data.fisheries.capture, 'Fisheries', 'capture');

    S.catalogue = cat;
    S.varieties = data.varieties || {};
    S.cropSpacing = data.cropSpacing || {};
    S.fertilizerSchedules = data.fertilizerSchedules || {};
    S.soilTypes = data.soilTypes || [];
    S.irrigationTypes = data.irrigationTypes || [];
    S.detailedStages = data.detailedStages || {};
    return true;
  }catch(e){
    console.warn('agri', e);
    return false;
  }
}

async function loadUserData(uid){
  const out = {
    profile: null,
    activities: [],
    listings: [],
    following: {},
    batches: []
  };
  try{
    const p = await get(ref(db,'users/'+uid));
    if(p.exists()){
      out.profile = p.val();
      if(out.profile.following) out.following = out.profile.following;
    }
    const a = await get(ref(db,'farmActivities'));
    if(a.exists()){
      Object.entries(a.val()).forEach(([k,v])=>{
        if(v && v.owner_user_id === uid) out.activities.push({id:k, ...v});
      });
    }
    const l = await get(ref(db,'marketListings'));
    if(l.exists()){
      Object.entries(l.val()).forEach(([k,v])=>{
        if(v && v.seller_id === uid) out.listings.push({id:k, ...v});
      });
    }
    const b = await get(ref(db,'batches'));
    if(b.exists()){
      Object.entries(b.val()).forEach(([k,v])=>{
        if(v && v.ownerId === uid) out.batches.push({id:k, ...v});
      });
      out.batches.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    }
  }catch(e){
    console.warn('loadUserData', e);
  }
  return out;
}

window.toggleFollow = async (targetId, targetType, targetName, targetPhoto)=>{
  if(!S.user || !targetId) return;
  if(targetId === S.user.uid){
    toast('You cannot follow yourself');
    return;
  }
  const followingRef = ref(db, `users/${S.user.uid}/following/${targetId}`);
  const existing = S.following[targetId];
  try{
    if(existing){
      await remove(followingRef);
      delete S.following[targetId];
      toast('Unfollowed');
    } else {
      await set(followingRef, {
        targetId,
        targetType: targetType || 'farmer',
        targetName: targetName || 'Farmer',
        targetPhoto: targetPhoto || '',
        followedAt: Date.now()
      });
      S.following[targetId] = {
        targetId,
        targetType: targetType || 'farmer',
        targetName,
        targetPhoto,
        followedAt: Date.now()
      };
      toast('Following ✓');
    }
    route();
  }catch(e){
    toast('Failed: '+(e.message||e));
  }
};

/* ============================================================
   ROUTER DISPATCHER
   ============================================================ */
function route(){
  const id = S.screen;
  const el = document.getElementById('screen-'+id);
  if(!el) return;

  switch(id){
    case 'home': el.innerHTML = renderHome(); break;
    case 'farm': el.innerHTML = renderFarm(); break;

    /* Plant wizard */
    case 'plant-step-1': el.innerHTML = renderPlantStep1(); break;
    case 'plant-step-2': el.innerHTML = renderPlantStep2(); break;
    case 'plant-step-3': el.innerHTML = renderPlantStep3(); break;
    case 'plant-step-4': el.innerHTML = renderPlantStep4(); break;
    case 'plant-success': el.innerHTML = renderPlantSuccess(S.screenData); break;

    /* Batch detail + harvest + post */
    case 'batch-detail':
      el.innerHTML = renderBatchDetail(S.screenData.id, S.screenData.tab);
      wireBatchDetail(S.screenData.id);
      break;
    case 'harvest-record':
      el.innerHTML = renderHarvestRecord(S.screenData.id);
      break;
    case 'post-harvest-goods':
      el.innerHTML = renderPostHarvestGoods(S.screenData.id);
      wirePostHarvestGoods();
      break;

    /* Explore */
    case 'explore': el.innerHTML = renderExplore(S.screenData.filter); break;
    case 'catalogue-detail': el.innerHTML = renderCatalogueDetail(S.screenData.id); break;

    /* Marketplace */
    case 'marketplace': el.innerHTML = renderMarketplace(); break;
    case 'product-detail': el.innerHTML = renderProduct(S.screenData.id); break;
    case 'post-ready-goods': el.innerHTML = renderPostReadyGoods(); wirePostReadyGoods(); break;

    /* Delivery */
    case 'delivery':
      el.innerHTML = renderDelivery();
      wireDeliveryHeroMap();
      break;
    case 'request-delivery':
      el.innerHTML = renderRequestDelivery();
      wireRequestDelivery();
      break;
    case 'delivery-history': el.innerHTML = renderDeliveryHistory(); break;

    /* Buy supplies */
    case 'buy-supplies': el.innerHTML = renderBuySupplies(S.screenData.cat); break;
    case 'supplier-cart': el.innerHTML = renderSupplierCart(); break;
    case 'supplier-checkout':
      el.innerHTML = renderSupplierCheckout();
      wireSupplierCheckout();
      break;

    /* Weather, profile, lists, analysis, government */
    case 'weather': el.innerHTML = renderWeather(); break;
    case 'profile': el.innerHTML = renderProfile(); break;
    case 'my-posts': el.innerHTML = renderMyPosts(S.screenData.tab); break;
    case 'analysis': el.innerHTML = renderAnalysis(); break;
    case 'government': el.innerHTML = renderGovernment(); break;
    case 'follow-ups': el.innerHTML = renderFollowUps(); break;

    default: el.innerHTML = renderHome();
  }
}

function renderBatchCard(b, mode='manage'){
  const crop = S.catalogue.find(c=>c.id === b.cropId);
  const ic = crop ? pickIcon(crop.name) : '🌱';
  const grad = crop ? gradFor(crop.name) : gradFor(b.cropName||'');
  const stage = b.stage || 'planted';
  const totalDays = b.totalDays || 120;
  const daysIn = b.plantedDate ? Math.max(0, Math.floor((Date.now() - b.plantedDate)/86400000)) : 0;
  const pct = Math.min(100, Math.round(daysIn / totalDays * 100));
  const statusLabel = {
    planted:'Planted', growing:'Growing', flowering:'Flowering',
    fruiting:'Fruiting', harvesting:'Ready', harvested:'Harvested'
  }[stage] || stage;
  return `
  <div class="batch-card" onclick="openBatch('${esc(b.id)}','${esc(mode)}')">
    <div class="bc-top">
      <div class="bc-crop-ic" style="background:${grad}">${b.coverUrl ? `<img src="${esc(b.coverUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">` : ic}</div>

        <div class="bc-variety">${esc(b.varietyName || '')}</div>
        <div class="bc-batch-num">${esc(b.batchNumber || '')}</div>
      </div>
      <div class="bc-stat">
        <div class="bc-status ${stage}">${esc(statusLabel)}</div>
        <div class="bc-area">${b.areaHa ? b.areaHa.toFixed(2)+' ha' : ''}</div>
      </div>
    </div>
    ${mode !== 'harvested' ? `
    <div class="bc-bar-wrap">
      <div class="bc-progress">
        <div class="bc-progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="bc-progress-meta">
        <span>Day <strong>${daysIn}</strong> of ~${totalDays}</span>
        <span><strong>${pct}%</strong> to harvest</span>
      </div>
    </div>`:''}
  </div>`;
}

function renderStepsIndicator(active, total=4){
  let html = '<div class="steps-indicator">';
  for(let i=1;i<=total;i++){
    html += `<div class="step-dot ${i<active?'done':''} ${i===active?'active':''}"></div>`;
  }
  html += '</div>';
  return html;
}

window.filterTowns = (q)=>{

  });

window.finishPlanting = async ()=>{
  const w = S.plantWizard;
  if(!w.cropId || !w.varietyName || !w.length || !w.width || !w.town){
    toast('Please complete all steps');
    return;
  }
  const crop = S.catalogue.find(c=>c.id === w.cropId);
  if(!crop){ toast('Crop not found'); return; }
  const btn = document.getElementById('plant-finish');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const area = computeArea(w.length, w.width);
  const forecast = computeForecast(w.cropId, w.varietyName, area.ha);
  const {batchNumber, batchSeq, batchDateKey} = await generateBatchNumber();
  let totalDays = 120;
  const v = (S.varieties[w.cropId]||[]).find(x=>x.name === w.varietyName);
  if(v && v.maturity){
    const m = String(v.maturity).match(/(\d+)/);
    if(m) totalDays = parseInt(m[1],10);
  }
  const stages = S.detailedStages[w.cropId] || [];
  if(stages.length && stages[stages.length-1].duration){
    const dm = String(stages[stages.length-1].duration).match(/(\d+)/);
    if(dm) totalDays = Math.max(totalDays, parseInt(dm[1],10));
  }
  const plantedDate = nowMs();
  const harvestStart = plantedDate + Math.round(totalDays * 0.85) * 86400000;
  const harvestEnd = plantedDate + Math.round(totalDays * 1.15) * 86400000;
  const batch = {
    batchNumber, batchSeq, batchDateKey,
    ownerId: S.user.uid,
    ownerName: (S.profile.firstName||'')+' '+(S.profile.lastName||''),
    cropId: w.cropId, cropName: crop.name, varietyName: w.varietyName,
    lengthM: w.length, widthM: w.width,
    areaM2: area.m2, areaHa: area.ha,
    town: w.town, stage: 'planted', status: 'active',
    plantedDate, totalDays, harvestStart, harvestEnd,
    expectedYieldLowKg: forecast.lowKg,
    expectedYieldHighKg: forecast.highKg,
    expectedYieldBaseKg: forecast.baseKg,
    expectedYieldUnit: 'kg',
    createdAt: nowMs(), updatedAt: nowMs(),
    harvestRecords: []
  };
  try{
    const newRef = push(ref(db, 'batches'));
    await set(newRef, batch);
    batch.id = newRef.key;
    S.myBatches.unshift(batch);
    showScreen('plant-success', {batch});
  }catch(e){
    toast('Failed: ' + (e.message||e));
    if(btn){ btn.disabled = false; btn.textContent = 'Finish ✓'; }
  }
};

window.updateHarvestPreview = (id)=>{
  const b = S.myBatches.find(x=>x.id === id);
  if(!b) return;
  const kg = parseFloat(document.getElementById('hv-kg').value) || 0;
  const expectedBase = b.expectedYieldBaseKg || 0;
  const pct = expectedBase ? Math.min(150, Math.round(kg/expectedBase*100)) : 0;
  const bar = document.getElementById('hv-actual-bar');
  const lbl = document.getElementById('hv-actual-label');
  const pctLbl = document.getElementById('hv-pct-label');
  if(bar) bar.style.width = Math.min(100, pct) + '%';
  if(lbl) lbl.textContent = `${Math.round(kg/10)/100} t`;
  if(pctLbl) pctLbl.textContent = pct + '% of expected';
  const reasonBlock = document.getElementById('hv-reason-block');
  if(reasonBlock){
    const diff = expectedBase ? Math.abs(kg - expectedBase) / expectedBase : 0;
    reasonBlock.style.display = (kg > 0 && diff > 0.15) ? 'block' : 'none';
  }
};

window.submitHarvest = async (id)=>{
  const b = S.myBatches.find(x=>x.id === id);
  if(!b) return;
  const kg = parseFloat(document.getElementById('hv-kg').value) || 0;
  const boxes = parseFloat(document.getElementById('hv-boxes').value) || 0;
  const dateStr = document.getElementById('hv-date').value;
  const notes = document.getElementById('hv-notes').value.trim();
  const reason = document.getElementById('hv-reason').value || '';
  if(kg <= 0 && boxes <= 0){
    toast('Please enter harvest weight or boxes');
    return;
  }
  const btn = document.getElementById('hv-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const record = {
    kg, boxes, dateStr, notes, reason,
    expectedKg: b.expectedYieldBaseKg || 0,
    recordedAt: nowMs()
  };
  try{
    const newRef = push(ref(db, `batches/${id}/harvestRecords`));
    await set(newRef, record);
    const prev = b.harvestRecords || [];
    const all = [...prev, {id:newRef.key, ...record}];
    const totalKg = all.reduce((s,r)=>s + (Number(r.kg)||0), 0);
    const totalBoxes = all.reduce((s,r)=>s + (Number(r.boxes)||0), 0);
    await update(ref(db, 'batches/'+id), {
      harvestRecords: all,
      totalHarvestKg: totalKg,
      totalHarvestBoxes: totalBoxes,
      lastHarvestAt: nowMs(),
      stage: 'harvested',
      status: 'harvested',
      updatedAt: nowMs()
    });
    b.harvestRecords = all;
    b.totalHarvestKg = totalKg;
    b.totalHarvestBoxes = totalBoxes;
    b.stage = 'harvested';
    b.status = 'harvested';
    toast('Harvest saved ✓');
    setTimeout(()=>{
      showScreen('batch-detail', {id, tab:'manage'});
    }, 500);
  }catch(e){
    toast('Failed: ' + (e.message||e));
    if(btn){ btn.disabled = false; btn.textContent = 'Save Harvest'; }
  }
};

function wirePostHarvestGoods(){
  document.querySelectorAll('#screen-post-harvest-goods .up-box').forEach(box=>{
    box.addEventListener('click', async(ev)=>{
      if(ev.target.classList.contains('up-del')){
        box.classList.remove('has-img');
        box.querySelector('.up-prev').removeAttribute('src');
        box.dataset.url='';
        ev.stopPropagation();
        return;
      }
      if(box.classList.contains('has-img')) return;
      try{
        const url = await uploadImage('listings');
        box.querySelector('.up-prev').src = url;
        box.classList.add('has-img');
        box.dataset.url = url;
      }catch(e){
        if(!String(e).includes('cancel')) toast('Upload failed');
      }
    });
  });
}

   DELIVERY PRICING
   ============================================================ */
const DELIVERY_VEHICLES = {
  bicycle: {id:'bicycle', label:'Bicycle', icon:'🚲', desc:'Light, short distance', base: 5, perKm: 4, perMin: 0.3, min: 10},
  rider:   {id:'rider', label:'Motorbike rider', icon:'🏍️', desc:'Small parcels', base: 8, perKm: 6, perMin: 0.5, min: 15},
  car:     {id:'car', label:'Car', icon:'🚗', desc:'Smaller loads', base: 15, perKm: 10, perMin: 1, min: 30},
  truck:   {id:'truck', label:'Truck', icon:'🚚', desc:'Bulk / livestock', base: 30, perKm: 15, perMin: 1.5, min: 60}
};

function computeDeliveryFare(vehicleId, distanceM, durationS){
  const v = DELIVERY_VEHICLES[vehicleId] || DELIVERY_VEHICLES.rider;
  const km = (distanceM || 0) / 1000;
  const min = (durationS || 0) / 60;
  const subtotal = (v.base || 0) + km * (v.perKm || 0) + min * (v.perMin || 0);
  return Math.round(Math.max(v.min || 0, subtotal));
}

function startDeliveriesLiveListener(){
  if(!S.user) return;
  onValue(ref(db, 'deliveryRequests'), (snap)=>{
    const data = snap.val() || {};
    const mine = [];
    Object.entries(data).forEach(([id, d])=>{
      if(d.requester_id === S.user.uid) mine.push({id, ...d});
    });
    mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.allDeliveries = mine;
  });
}

async function loadAllDeliveries(){
  try{
    const snap = await get(ref(db, 'deliveryRequests'));
    if(!snap.exists()){ S.allDeliveries = []; return; }
    const data = snap.val();
    const mine = [];
    Object.entries(data).forEach(([id, d])=>{
      if(d.requester_id === S.user.uid) mine.push({id, ...d});
    });
    mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.allDeliveries = mine;
  }catch(e){}
}

  try{ await signOut(auth); }catch(e){}
  window.location.href = 'index.html';
};

/* ============================================================
   SCREEN: MY POSTS
   ============================================================ */
function renderMyPosts(tab){
  tab = tab || 'active';
  const all = S.myListings || [];
  const active = all.filter(p=>p.status === 'available');
  const sold = all.filter(p=>p.status === 'sold');
  const list = tab === 'active' ? active : tab === 'sold' ? sold : all;
  const items = list.length ? list.map(m=>`
    <div class="card" style="display:flex;gap:10px;margin-bottom:10px;align-items:center">
      <div style="width:56px;height:56px;border-radius:10px;background:${gradFor(m.title||'')};display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0">
        ${m.photoUrls?.[0]?`<img src="${esc(m.photoUrls[0])}" style="width:100%;height:100%;object-fit:cover">`:pickIcon(m.title||'')}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:800;color:var(--td)">${esc(m.title||'')}</div>
        <div style="font-size:11px;color:var(--tl);font-weight:600;margin-top:2px">${esc(m.quantity||'')} ${esc(m.unit||'')} · ${fmtZMK(m.priceAmount)}</div>
      </div>
      <button class="btn btn-s btn-sm" style="width:auto;padding:6px 10px" onclick="deleteListing('${esc(m.id)}')">🗑</button>
    </div>
  `).join('') : `<div class="empty"><div class="e-ic">📋</div><h3>No ${tab} listings</h3></div>`;
  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="tb-title">My Listings</div>
    </div>
    <div class="chips-row" style="padding-top:12px">
      <button class="chip ${tab==='active'?'active':''}" onclick="navTo('my-posts',{tab:'active'})">Active (${active.length})</button>
      <button class="chip ${tab==='sold'?'active':''}" onclick="navTo('my-posts',{tab:'sold'})">Sold (${sold.length})</button>
      <button class="chip ${tab==='all'?'active':''}" onclick="navTo('my-posts',{tab:'all'})">All (${all.length})</button>
    </div>
    <div style="padding:0 18px 18px">${items}</div>
  </div>
  ${bottomNavHTML()}`;
}

window.deleteListing = (id)=>{
  modal(`<h3>Delete listing?</h3><p>This cannot be undone.</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDeleteListing('${esc(id)}')">Delete</button>
    </div>`);
};

window.confirmDeleteListing = async (id)=>{
  try{
    await remove(ref(db, 'marketListings/'+id));
    S.myListings = S.myListings.filter(x=>x.id !== id);
    S.marketplace = S.marketplace.filter(x=>x.id !== id);
    closeModal();
    toast('Deleted');
    route();
  }catch(e){
    toast('Failed');
  }
};

/* ============================================================
   LOCATION PERMISSION
   ============================================================ */
function showLocationPermissionModal(){
  return new Promise((resolve)=>{
    modal(`<div style="text-align:center">
      <div style="font-size:48px;margin-bottom:12px">📍</div>
      <h3>Enable Location</h3>
      <p>AgriCare needs your location to show accurate weather and detect your city.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-p" id="loc-allow-btn">Allow Location</button>
        <button class="btn btn-s" id="loc-skip-btn">Not Now</button>
      </div>
    </div>`);
    document.getElementById('loc-allow-btn').onclick = ()=>{ closeModal(); resolve(true); };
    document.getElementById('loc-skip-btn').onclick = ()=>{ closeModal(); resolve(false); };
  });
}

async function detectUserCityAndWeather(force){
  if(!S.locationPermissionAsked && !force){
    S.locationPermissionAsked = true;
    const allowed = await showLocationPermissionModal();
    if(!allowed){
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if(S.screen === 'home') route();
      return;
    }
  }
  if(!navigator.geolocation){
    S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
    S.weatherCity = S.userLocation;
    return;
  }
  return new Promise((resolve)=>{
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      S.userCoords = {lat, lng};
      const place = await reverseGeocodeCity(lat, lng);
      if(place && place.city){
        S.weatherCity = place.city;
        S.userLocation = place.city;
      }
      S.weather = await loadWeatherByCoords(lat, lng);
      if(S.screen === 'home') route();
      resolve();
    }, async ()=>{
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if(S.screen === 'home') route();
      resolve();
    }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 300000});
  });
}

/* ============================================================
   SYSTEM STATE (banned/maintenance)
   ============================================================ */
function renderBanned(reason){
  return `<div class="screen-wrap" style="display:flex;align-items:center;justify-content:center"><div class="state-screen"><div class="st-ic danger">🚫</div><h1>Account Banned</h1><p>${esc(reason||'Contact support.')}</p><button class="btn btn-s" onclick="doLogout()">Sign Out</button></div></div>`;
}

async function checkSystemState(){
  let banned = false, banReason = '';
  try{
    const u = await get(ref(db,'users/'+S.user.uid));
    if(u.exists() && u.val().banned){
      banned = true;
      banReason = u.val().banReason || 'Contact support';
    }
  }catch(e){}
  return {banned, banReason};
}

/* ============================================================
   APP BOOTSTRAP
   ============================================================ */
async function startApp(){
  const splash = document.getElementById('splash');
  requestAnimationFrame(()=> splash.classList.add('show'));
  onAuthStateChanged(auth, async (user)=>{
    await new Promise(r=>setTimeout(r, 2500));
    if(!user){
      window.location.href = 'index.html';
      return;
    }
    S.user = user;
    const st = await checkSystemState();
    if(st.banned){
      document.getElementById('app').innerHTML = renderBanned(st.banReason);
      return;
    }

    await loadAgriKnowledge();

    const ud = await loadUserData(user.uid);
    S.profile = ud.profile || {};
    S.myActivities = ud.activities || [];
    S.myListings = ud.listings || [];
    S.following = ud.following || {};
    S.myBatches = ud.batches || [];

    if(S.profile.location) S.userLocation = S.profile.location;
    if(S.profile.city) S.weatherCity = S.profile.city;

    S.marketplace = await loadMarketplace();

    await loadAllDeliveries();
    startDeliveriesLiveListener();
    startSupplierProductsListener();
    startNotificationsListener();
    startContentNotificationListeners();

    if(S.followUnsub) S.followUnsub();
    S.followUnsub = onValue(ref(db, `users/${S.user.uid}/following`), (snap)=>{
      S.following = snap.val() || {};
    });

    const app = document.getElementById('app');
    app.innerHTML = `<div class="screen-wrap"></div>`;
    const wrap = app.querySelector('.screen-wrap');
    const home = document.createElement('div');
    home.className = 'screen';
    home.id = 'screen-home';
    wrap.appendChild(home);
    activeScreenEl = home;
    S.screen = 'home';
    home.classList.add('active');
    route();
    try{
      history.replaceState({screen:'home'}, '', '#home');
    }catch(e){}

    await detectUserCityAndWeather();

    clearInterval(S.weatherRefreshTimer);
    S.weatherRefreshTimer = setInterval(async ()=>{
      if(S.userCoords){
        S.weather = await loadWeatherByCoords(S.userCoords.lat, S.userCoords.lng);
        if(S.screen === 'home') route();
      }
    }, 30*60*1000);
  });
}

startApp();

setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash && splash.parentNode){
    setTimeout(()=>{
      splash.classList.remove('show');
      setTimeout(()=>{
        if(splash.parentNode) splash.parentNode.removeChild(splash);
      }, 1000);
    }, 300);
  }
}, 2700);

window.addEventListener('unhandledrejection', e=>{
  console.warn('Unhandled:', e.reason);
});

window.addEventListener('beforeunload', ()=>{
  S.notifListeners.forEach(u=>{ try{ u(); }catch(e){} });
  if(S.heroDriverListener){ try{ S.heroDriverListener(); }catch(e){} }
  if(S.delActiveUnsub){ try{ S.delActiveUnsub(); }catch(e){} }
  if(S.followUnsub){ try{ S.followUnsub(); }catch(e){} }
  if(S.ongoingTrackUnsub){ try{ S.ongoingTrackUnsub(); }catch(e){} }
  if(S.ongoingStatusUnsub){ try{ S.ongoingStatusUnsub(); }catch(e){} }
  if(S.ongoingRouteRefreshTimer){ clearInterval(S.ongoingRouteRefreshTimer); }
});
</script>
