      </div>
    </div>`;
  }

  if (isFisheries) {
    return `
    <div class="scroll">
      <div class="topbar bordered">
        <button class="tb-back" onclick="showScreen('plant-step-1')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
        <div class="tb-title">Pond Size</div>
      </div>
      ${renderStepsIndicator(3)}
      <div class="step-label">Step 3 of 4</div>
      <div class="step-title">How big is your pond?</div>
      <div class="step-sub">Enter pond length and width in metres. We'll estimate fish yield.</div>
      <div class="area-grid">
        <div class="area-box"><label>Pond Length</label><input type="number" id="plant-length" min="0" step="0.5" inputmode="decimal" placeholder="0" value="${w.length || ''}" oninput="updateArea('length', this.value)"><div class="ab-unit">metres (m)</div></div>
        <div class="area-box"><label>Pond Width</label><input type="number" id="plant-width" min="0" step="0.5" inputmode="decimal" placeholder="0" value="${w.width || ''}" oninput="updateArea('width', this.value)"><div class="ab-unit">metres (m)</div></div>
      </div>
      <div id="estimate-container">
        ${est ? `
        <div class="box-estimate-card">
          <div class="bec-label">🐟 Estimated Fish Yield</div>
          <div class="bec-value">${est.quantity.toLocaleString()}</div>
          <div class="bec-unit">${esc(est.unitLabel)}</div>
          <div class="bec-range">Range: <strong>${est.low.toLocaleString()}</strong> to <strong>${est.high.toLocaleString()}</strong> ${esc(est.unit)}.<br>Based on ${area.m2.toFixed(0)} m² pond.</div>

        <button class="btn btn-s" onclick="showScreen('plant-step-1')">← Back</button>

      </div>

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="showScreen('plant-step-1')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="tb-title">Field Size</div>

    ${renderStepsIndicator(3)}
    <div class="step-label">Step 3 of 4</div>

      ` : ''}
    </div>
    <div class="btn-row" style="padding-top:16px">
      <button class="btn btn-s" onclick="showScreen('plant-step-1')">← Back</button>

    </div>
  </div>`;
}

window.updateArea = (field, value) => {
  const v = parseFloat(value) || 0;
  if (field === 'length') S.plantWizard.length = v;
  if (field === 'width') S.plantWizard.width = v;
  const btn = document.getElementById('plant-step3-next');
  if (btn) btn.disabled = !(S.plantWizard.length > 0 && S.plantWizard.width > 0);

  const estContainer = document.getElementById('estimate-container');
  if (!estContainer) return;
  const w = S.plantWizard;
  const crop = S.catalogue.find(c => c.id === w.cropId);
  const isFisheries = crop && crop.category.includes('Fisheries');
  if (w.length > 0 && w.width > 0) {
    const est = estimateHarvest(crop ? crop.category : 'Crop', w.length, w.width, crop ? crop.name : '', w.animalCount);
    const area = computeArea(w.length, w.width);
    estContainer.innerHTML = `
      <div class="box-estimate-card">
        <div class="bec-label">${isFisheries ? '🐟 Estimated Fish Yield' : '📦 Estimated Harvest'}</div>
        <div class="bec-value">${est.quantity.toLocaleString()}</div>
        <div class="bec-unit">${esc(est.unitLabel)}</div>
        <div class="bec-range">Range: <strong>${est.low.toLocaleString()}</strong> to <strong>${est.high.toLocaleString()}</strong> ${esc(est.unit)}.<br>Based on ${area.m2.toFixed(0)} m² ${isFisheries ? 'pond' : 'field'}.</div>
      </div>`;
  } else {
    estContainer.innerHTML = '';
  }
};
window.updateAnimalCount = (value) => { S.plantWizard.animalCount = parseInt(value) || 0; };
window.goPlantStep4 = () => {
  const w = S.plantWizard;
  const crop = S.catalogue.find(c => c.id === w.cropId);
  const isLivestock = crop && (crop.category.includes('Livestock') || crop.category.includes('Poultry'));
  if (isLivestock) {
    if (!w.animalCount || w.animalCount <= 0) { toast('Please enter number of animals'); return; }
  } else {
    if (!w.length || !w.width) { toast('Please enter length and width'); return; }
  }
  showScreen('plant-step-4');
};

window.toggleCitySelect = () => {
  const opts = document.getElementById('city-options');

  if (!opts || !trigger) return;
  opts.classList.toggle('open');
  trigger.classList.toggle('open', opts.classList.contains('open'));
};
window.pickTown = (town) => {
  S.plantWizard.town = town;
  const hidden = document.getElementById('selected-town');
  if (hidden) hidden.value = town;
  const trigger = document.getElementById('city-trigger');
  if (trigger) {
    trigger.querySelector('.st-value').textContent = town;
    trigger.querySelector('.st-value').style.color = 'var(--td)';
  }
  const opts = document.getElementById('city-options');
  if (opts) {
    opts.querySelectorAll('.select-option').forEach(x => x.classList.remove('selected'));
    const match = opts.querySelector(`[data-value="${CSS.escape(town)}"]`);
    if (match) match.classList.add('selected');
    opts.classList.remove('open');
  }
  if (trigger) trigger.classList.remove('open');
};
window.goPlantConfirm = () => {
  const town = document.getElementById('selected-town')?.value || S.plantWizard.town || S.weatherCity || 'Lusaka';
  S.plantWizard.town = town;
  showScreen('plant-confirm');
};

function renderPlantConfirm() {

window.cancelPlantingFlow = () => {
  S.plantWizard = { step:1, cropId:null, varietyName:null, length:null, width:null, town:null, animalCount:0 };
  showScreen('farm');
};

window.finishPlanting = async () => {
  if (S._finishing) return;
  S._finishing = true;

  const w = S.plantWizard;
  const crop = S.catalogue.find(c => c.id === w.cropId);
  if (!crop) {
    S._finishing = false;
    toast('Crop not found — start again');
    return;
  }

  showLoader('Creating your batch…', 'Saving to your farm');

  try {
    const farmId = await ensureFarmAsync();
    const area = computeArea(w.length, w.width);
    const est = estimateHarvest(crop.category, w.length, w.width, crop.name, w.animalCount);
    const { batchNumber, batchSeq, batchDateKey } = await generateBatchNumber();
    let totalDays = 120;
    const v = (S.varieties[w.cropId] || []).find(x => x.name === w.varietyName);
    if (v && v.maturity) { const m = String(v.maturity).match(/(\d+)/); if (m) totalDays = parseInt(m[1],10); }
    const plantedDate = nowMs();
    const batch = {
      batchNumber, batchSeq, batchDateKey,
      ownerId: S.user.uid,
      ownerName: (S.profile.firstName || '') + ' ' + (S.profile.lastName || ''),
      ownerCity: S.weatherCity || S.userLocation,
      farmId,
      cropId: w.cropId, cropName: crop.name, varietyName: w.varietyName,
      category: crop.category,
      lengthM: w.length || 0, widthM: w.width || 0,
      areaM2: area.m2, animalCount: w.animalCount || 0, town: w.town,
      stage: 'planted', status: 'active',
      plantedDate, totalDays,
      harvestStart: plantedDate + Math.round(totalDays * 0.85) * 86400000,
      harvestEnd: plantedDate + Math.round(totalDays * 1.15) * 86400000,
      estimatedBoxes: est.quantity,
      estimatedUnit: est.unit,
      estimatedUnitLabel: est.unitLabel,
      estimatedBoxesLow: est.low,
      estimatedBoxesHigh: est.high,
      estimatedTotalKg: est.totalKg,
      actualBoxes: 0,
      dailyHarvests: [],
      harvestFinished: false,
      createdAt: nowMs(), updatedAt: nowMs(),
      harvestRecords: []
    };
    const newRef = push(ref(db, 'batches'));
    await set(newRef, batch);
    batch.id = newRef.key;

    const successBatch = { ...batch };
    S.plantWizard = { step:1, cropId:null, varietyName:null, length:null, width:null, town:null, animalCount:0 };

    hideLoader();
    showScreen('plant-success', { batch: successBatch, est }, false);
    try { history.replaceState({ screen: 'plant-success', data: { batch: successBatch, est } }, '', '#plant-success'); } catch(e) {}
  } catch (e) {
    hideLoader();
    toast('Failed: ' + (e.message || e));
  } finally {
    S._finishing = false;
  }
};

  const b = data.batch;

  return `

function renderStepsIndicator(active, total = 4) {
  let html = '<div class="steps-indicator">';
  for (let i = 1; i <= total; i++) html += `<div class="step-dot ${i < active ? 'done' : ''} ${i === active ? 'active' : ''}"></div>`;
  html += '</div>';
  return html;
}

window.setBatchStage = async (id, stage) => {

  if (!b) return;
  if (stage === 'harvested' && !b.harvestFinished) {
    toast('Finish harvesting first (Record Harvest → Finish)');
    return;
  }
  try {
    const updates = { stage, updatedAt: nowMs() };
    updates.status = stage === 'harvested' ? 'harvested' : 'active';
    await update(ref(db, 'batches/' + id), updates);
    b.stage = stage; b.status = updates.status;
    if (stage === 'harvesting') toast('Marked Ready to Harvest 🌾');
    else toast('Stage updated ✓');
    route();
  } catch (e) { toast('Failed: ' + (e.message || e)); }
};

window.saveDailyHarvest = async (batchId) => {
  const b = S.myBatches.find(x => x.id === batchId);
  if (!b) return;
  const boxes = parseInt(document.getElementById('ah-boxes').value) || 0;
  const dateStr = document.getElementById('ah-date').value;
  const note = (document.getElementById('ah-note').value || '').trim();
  if (!boxes || boxes < 1) { toast('Enter quantity'); return; }
  if (!dateStr) { toast('Enter date'); return; }
  const dateMs = new Date(dateStr).getTime();
  const unit = unitForBatch(b);

  const newHarvest = { id: 'h_' + Date.now(), date: dateMs, boxes, note, addedAt: nowMs() };
  const existing = Array.isArray(b.dailyHarvests) ? b.dailyHarvests.slice() : [];
  existing.push(newHarvest);
  const total = existing.reduce((s, h) => s + (parseInt(h.boxes) || 0), 0);

  try {
    await update(ref(db, 'batches/' + batchId), {
      dailyHarvests: existing,
      actualBoxes: total,
      updatedAt: nowMs()
    });
    b.dailyHarvests = existing;
    b.actualBoxes = total;

    const activeListing = getActiveListingForBatch(batchId);
    if (activeListing) {
      const listedQty = activeListing.quantity || 0;
      if (total > listedQty) {
        await update(ref(db, 'marketListings/' + activeListing.id), {
          quantity: total,
          updatedAt: nowMs()
        });
        toast(`+${boxes} ${unit} · listing updated to ${total} ✓`);
      } else {
        toast(`+${boxes} ${unit} ✓`);
      }
      closeModal();
      route();
    } else {
      closeModal();
      toast(`+${boxes} ${unit} ✓`);
      route();
      setTimeout(() => {
        modal(`
          <h3>🌾 Harvest Recorded!</h3>
          <p>You've added <strong>${boxes} ${unit}</strong>. Total harvest is now <strong>${total} ${unit}</strong>.</p>
          <p>Would you like to list your harvest for sale on the market now?</p>
          <div class="mc-actions">
            <button class="btn btn-s" onclick="closeModal();">Later</button>
            <button class="btn btn-p" onclick="closeModal(); showScreen('post-harvest-goods',{id:'${esc(batchId)}'})">🛒 List for Sale</button>
          </div>
        `);
      }, 450);
    }
  } catch (e) { toast('Failed: ' + (e.message || e)); }
};

function renderDraftImageGrid(batchId) {
  const imgs = (S.draftImages[batchId] || []);
  const slots = [];
  for (let i = 0; i < 2; i++) {
    if (imgs[i]) {
      slots.push(`
        <div class="img-slot filled">
          <img src="${esc(imgs[i])}" alt="">
          <button type="button" class="img-slot-remove" onclick="event.stopPropagation();removeDraftImage('${esc(batchId)}',${i})">✕</button>
        </div>
      `);
    } else {
      slots.push(`
        <button type="button" class="img-slot" onclick="openImageUpload('${esc(batchId)}')">
          <div class="img-slot-add">
            <span class="ic">📷</span>
            <span>Add photo</span>
          </div>
        </button>
      `);
    }
  }
  return slots.join('');
}
function updateDraftImagesUI(batchId) {
  const grid = document.getElementById('ph-images-grid');
  if (grid) grid.innerHTML = renderDraftImageGrid(batchId);
  const counter = document.getElementById('ph-image-count');
  if (counter) {
    const n = (S.draftImages[batchId] || []).length;
    counter.textContent = `${n} / 2 photos · 2 required`;
    counter.style.color = n >= 2 ? 'var(--p)' : 'var(--tl)';
  }
}
window.openImageUpload = (batchId) => {
  if (!window.cloudinary || !window.cloudinary.createUploadWidget) {
    toast('Upload widget not loaded');
    return;
  }
  if (!S.draftImages[batchId]) S.draftImages[batchId] = [];
  if (S.draftImages[batchId].length >= 2) {
    toast('Maximum 2 photos');
    return;
  }
  try {
    const widget = window.cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      sources: ['local', 'camera', 'url'],
      multiple: false,
      maxFiles: 1,
      cropping: false,
      folder: 'agricare/market',
      resourceType: 'image',
      clientAllowedFormats: ['jpg','jpeg','png','webp'],
      maxFileSize: 8000000
    }, (error, result) => {
      if (error) { console.warn('upload', error); toast('Upload failed'); return; }
      if (result && result.event === 'success') {
        S.draftImages[batchId].push(result.info.secure_url);
        updateDraftImagesUI(batchId);
        toast('Photo added ✓');
      }
    });
    widget.open();
  } catch (e) {
    console.warn('upload init', e);
    toast('Upload unavailable');
  }
};
window.removeDraftImage = (batchId, idx) => {
  if (!S.draftImages[batchId]) return;
  S.draftImages[batchId].splice(idx, 1);
  updateDraftImagesUI(batchId);
};
window.cancelPostHarvest = (batchId) => {
  delete S.draftImages[batchId];
  try { navTo('marketplace'); }

};

window.submitMarketPost = async (ev, batchId) => {
  if (ev && ev.preventDefault) ev.preventDefault();
  const b = S.myBatches.find(x => x.id === batchId);
  if (!b) { toast('Batch not found'); return; }
  if (getActiveListingForBatch(batchId)) { toast('This batch is already on the market'); return; }

  const btn = document.getElementById('ph-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Listing…'; }
  const restore = () => { if (btn) { btn.disabled = false; btn.textContent = '💰 List for Sale'; } };

  try {
    const name = document.getElementById('ph-name').value.trim();
    const phone = document.getElementById('ph-phone').value.trim();
    const variety = (document.getElementById('ph-variety').value || '').trim();
    const qty = parseInt(document.getElementById('ph-qty').value) || 0;
    const marketSelect = document.getElementById('ph-market').value;
    const customMarket = (document.getElementById('ph-custom-market')?.value || '').trim();
    const marketName = marketSelect === '__other' ? customMarket : marketSelect;
    const priceAmount = parseFloat(document.getElementById('ph-price').value) || 0;
    const availAtStr = document.getElementById('ph-avail-at').value;
    const desc = document.getElementById('ph-desc').value.trim();
    const photoUrls = (S.draftImages[batchId] || []).slice(0, 2);

    if (!name) { toast('Please enter your name'); restore(); return; }
    if (!phone) { toast('Please enter a phone number'); restore(); return; }
    if (!qty || qty < 1) { toast('Please enter quantity'); restore(); return; }
    if (!marketName) { toast('Please select a market'); restore(); return; }
    if (!priceAmount || priceAmount <= 0) { toast('Please enter a valid price'); restore(); return; }
    if (!availAtStr) { toast('Please set availability time'); restore(); return; }
    if (photoUrls.length < 2) { toast('Please upload 2 photos of your produce'); restore(); return; }

    const availAt = new Date(availAtStr).getTime();
    if (!availAt || isNaN(availAt)) { toast('Invalid date/time'); restore(); return; }
    if (availAt <= Date.now() - 60000) { toast('Please set a future time'); restore(); return; }

    const priceMode = S.priceMode || 'per_box';
    const totalPrice = priceMode === 'total' ? priceAmount : priceAmount * qty;
    const pricePerBox = priceMode === 'total' ? (qty ? priceAmount / qty : 0) : priceAmount;
    const city = S.weatherCity || S.userLocation;
    const unit = singularUnit(unitForBatch(b));

    const data = {
      seller_id: S.user.uid,
      sellerName: name,
      sellerPhone: phone,
      sellerPhoto: S.profile?.profileUrl || '',
      catalog_item_id: b.cropId,
      title: `Fresh ${b.cropName} – ${qty} ${pluralUnit(unit, qty)}`,
      productName: b.cropName,
      varietyName: variety || b.varietyName || '',
      quantity: qty,
      soldQuantity: 0,
      unit,
      priceMode, priceAmount, pricePerBox, totalPrice, currency: 'ZMW',
      city, marketName,
      availabilityStatus: 'pending',
      availableAt: availAt,
      description: desc,
      photoUrls,
      status: 'pending',
      fromBatchId: batchId,
      fromBatchNumber: b.batchNumber,
      createdAt: nowMs()
    };

    const newRef = push(ref(db, 'marketListings'));
    await set(newRef, data);
    delete S.draftImages[batchId];
    toast('Listed! Countdown started ⏱');
    setTimeout(() => navTo('marketplace'), 600);
  } catch (e) {
    toast('Failed: ' + (e.message || e));
    restore();
  }
};

window.saveEditedListing = async (ev, id) => {
  if (ev && ev.preventDefault) ev.preventDefault();
  const l = S.marketplace.find(x => x.id === id);
  if (!l || l.seller_id !== S.user?.uid) { toast('Cannot edit'); return; }

  const btn = document.getElementById('el-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const restore = () => { if (btn) { btn.disabled = false; btn.textContent = '💾 Save Changes'; } };

  try {
    const phone = document.getElementById('el-phone').value.trim();
    const variety = (document.getElementById('el-variety').value || '').trim();
    const qty = parseInt(document.getElementById('el-qty').value) || 0;
    const marketSelect = document.getElementById('el-market').value;
    const customMarket = (document.getElementById('el-custom-market')?.value || '').trim();
    const marketName = marketSelect === '__other' ? customMarket : marketSelect;
    const priceAmount = parseFloat(document.getElementById('el-price').value) || 0;
    const availAtStr = document.getElementById('el-avail-at').value;
    const desc = document.getElementById('el-desc').value.trim();

    if (!phone) { toast('Phone required'); restore(); return; }
    if (!qty || qty < 1) { toast('Quantity required'); restore(); return; }
    if (!marketName) { toast('Market required'); restore(); return; }
    if (!priceAmount || priceAmount <= 0) { toast('Price required'); restore(); return; }

    const priceMode = S.priceMode || 'per_box';
    const totalPrice = priceMode === 'total' ? priceAmount : priceAmount * qty;
    const pricePerBox = priceMode === 'total' ? (qty ? priceAmount / qty : 0) : priceAmount;

    const updates = {
      sellerPhone: phone,
      varietyName: variety,
      quantity: qty,
      marketName,
      priceMode, priceAmount, pricePerBox, totalPrice,
      description: desc,
      updatedAt: nowMs()
    };
    if (availAtStr) {
      const availAt = new Date(availAtStr).getTime();
      if (!isNaN(availAt)) updates.availableAt = availAt;
    }

    await update(ref(db, 'marketListings/' + id), updates);
    toast('Listing updated ✓');
    setTimeout(() => navTo('marketplace'), 500);
  } catch (e) {
    toast('Failed: ' + (e.message || e));
    restore();
  }
};

window.confirmSellListing = async (id) => {
  const l = S.marketplace.find(x => x.id === id);
  if (!l) return;
  const soldQty = parseInt(document.getElementById('sell-qty').value) || 0;
  const buyer = (document.getElementById('sell-buyer').value || '').trim();
  const total = l.quantity || 0;
  const alreadySold = l.soldQuantity || 0;
  if (!soldQty || soldQty < 1) { toast('Enter quantity'); return; }
  if (soldQty > total) { toast('Quantity exceeds listed'); return; }

  const newRemaining = total - soldQty;
  const newSoldQty = alreadySold + soldQty;
  const now = nowMs();
  const unit = l.unit || 'box';

  try {
    if (newRemaining <= 0) {
      await update(ref(db, 'marketListings/' + id), {
        availabilityStatus: 'sold', status: 'sold', quantity: 0,
        soldQuantity: newSoldQty, soldAt: now, buyerName: buyer, removedAt: now
      });
      toast('✅ Sold — moved to history');
    } else {
      await update(ref(db, 'marketListings/' + id), {
        quantity: newRemaining, soldQuantity: newSoldQty, soldAt: now, buyerName: buyer, updatedAt: now
      });
      toast(`Sold ${soldQty} ${pluralUnit(unit, soldQty)} · ${newRemaining} remaining`);
    }
    closeModal();
    setTimeout(() => { if (S.screen === 'marketplace' || S.screen === 'my-posts') route(); }, 200);
  } catch (e) { toast('Failed: ' + (e.message || e)); }
};

      if (!t || isNaN(t)) return;
      if (Date.now() >= t) {
        el.textContent = '⏰ Ready — confirm';
        el.style.background = 'linear-gradient(135deg,#f97316,#ea580c)';
        el.style.color = '#fff';
      } else {
        el.textContent = '⏱ ' + timeUntil(t);

}

function runConfirmationChecks() {
  if (!S.user) return;
  if (!S.marketplace || !S.marketplace.length) return;
  if ($modal.classList.contains('open')) return;
  if ($varietySheetOverlay.classList.contains('open')) return;
  const id = S.screen || '';
  if (id.includes('post') || id.includes('edit') || id.includes('plant')) return;

  const pendingDue = S.marketplace.find(l =>
    l.seller_id === S.user.uid &&
    l.availabilityStatus === 'pending' &&
    l.availableAt && Date.now() >= l.availableAt &&
    !S.promptedListings[l.id]
  );
  if (pendingDue) {
    S.promptedListings[pendingDue.id] = true;
    showAvailabilityConfirmModal(pendingDue);
    return;
  }

  const TWENTY_FOUR_H = 24 * 60 * 60 * 1000;
  const now = Date.now();
  const availDue = S.marketplace.find(l => {
    if (l.seller_id !== S.user.uid) return false;
    if (l.availabilityStatus !== 'available') return false;
    if (S.prompted24h[l.id]) return false;
    const lastConf = l.lastConfirmedAt || l.confirmedAt || l.availableAt || l.createdAt;
    if (!lastConf) return false;
    return now - lastConf >= TWENTY_FOUR_H;
  });
  if (availDue) {
    S.prompted24h[availDue.id] = true;
    show24hConfirmModal(availDue);
  }
}
function startPendingCheckTimer() {
  clearInterval(S.pendingCheckTimer);
  S.pendingCheckTimer = setInterval(runConfirmationChecks, 5000);
}

/* ============================================================
   STAGE ADVANCEMENT NOTIFICATIONS
   ============================================================ */
const STAGE_THRESHOLDS = { planted: 0.25, growing: 0.45, flowering: 0.65, fruiting: 0.85 };
const NEXT_STAGE = { planted: 'growing', growing: 'flowering', flowering: 'fruiting', fruiting: 'harvesting' };

function checkStageAdvancement() {
  if (!S.user || !S.myBatches?.length) return;
  if ($modal.classList.contains('open')) return;
  if ($varietySheetOverlay.classList.contains('open')) return;
  if (['plant-loader','plant-step-1','plant-step-3','plant-step-4','plant-confirm','plant-success','batch-detail','harvest-record','post-harvest-goods','edit-listing'].includes(S.screen)) return;

  const now = Date.now();
  for (const b of S.myBatches) {
    if (!b.plantedDate || !b.totalDays) continue;
    if (b.stage === 'harvesting' || b.stage === 'harvested') continue;
    if (S.stageNotified[b.id] === b.stage) continue;

    const daysSince = (now - b.plantedDate) / 86400000;
    const threshold = STAGE_THRESHOLDS[b.stage];
    if (threshold && daysSince >= b.totalDays * threshold) {
      const next = NEXT_STAGE[b.stage];
      if (next) {
        S.stageNotified[b.id] = b.stage;
        showStageAdvanceModal(b, next);
        return;
      }
    }
  }
}

function showStageAdvanceModal(batch, nextStage) {
  const farmerName = (S.profile?.firstName || 'Farmer').trim() || 'Farmer';
  const stageLabel = STAGE_LABELS[nextStage] || nextStage;
  const stageIcon = STAGE_ICONS[nextStage] || '';
  const daysSince = Math.round((Date.now() - batch.plantedDate) / 86400000);
  modal(`
    <h3>🌱 Hey ${esc(farmerName)}!</h3>
    <p>Your <strong>${esc(batch.cropName)}</strong> (${esc(batch.varietyName || '')}) batch is ready to move to the next stage:</p>
    <div style="font-size:18px;font-weight:900;color:var(--p-d);margin:14px 0;padding:16px;background:linear-gradient(135deg,#e6f5eb,#d1fae5);border-radius:var(--r-lg);border:1px solid rgba(15,122,52,.2)">
      ${stageIcon} ${esc(stageLabel)}
    </div>
    <p style="font-size:12px;color:var(--tl);margin-bottom:0">
      ${daysSince} day${daysSince === 1 ? '' : 's'} since planting.
      Tap <strong>Advance</strong> to update your batch.
    </p>
    <div class="mc-actions">
      <button class="btn btn-s" onclick="dismissStageNotification('${esc(batch.id)}')">Later</button>
      <button class="btn btn-p" onclick="advanceBatchStage('${esc(batch.id)}','${nextStage}')">Advance ✓</button>
    </div>
  `, true);
}

window.advanceBatchStage = async (id, stage) => {
  try {
    await update(ref(db, 'batches/' + id), { stage, updatedAt: nowMs() });
    const b = S.myBatches.find(x => x.id === id);
    if (b) b.stage = stage;
    closeModal();
    toast('Stage advanced to ' + (STAGE_LABELS[stage] || stage) + ' ✓');
    route();
  } catch (e) { toast('Failed: ' + (e.message || e)); }
};

    ? `Sold ${fmtDuration((l.soldAt || Date.now()) - (l.createdAt || 0))} after listing`
    : isRemoved
      ? `Was on market for ${fmtDuration((l.removedAt || Date.now()) - (l.createdAt || 0))}`
      : `On market for ${fmtDuration(onMarketMs)}`;

  const photosBlock = (l.photoUrls && l.photoUrls.length) ? `
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px">
      ${l.photoUrls.map(u => `<img src="${esc(u)}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#000">`).join('')}
    </div>` : '';

  modal(`
    <h3 style="margin-bottom:4px">${esc(l.title || l.productName || 'Listing')}</h3>
    <p style="margin-bottom:10px">${esc(l.sellerName || '')} · ${esc(l.city || '')}</p>
    <div style="font-size:11.5px;color:${due ? '#ea580c' : (isAvailable ? '#16a34a' : (isSold ? '#5b21b6' : (isRemoved ? '#475569' : '#92400e')))};font-weight:800;margin-bottom:8px;padding:8px 12px;background:${due ? '#ffedd5' : (isAvailable ? '#d1fae5' : (isSold ? '#ede9fe' : (isRemoved ? '#f1f5f9' : '#fef3c7')))};border-radius:var(--r-p);display:inline-block">
      ${statusText}
    </div>
    <div style="font-size:11px;color:var(--tl);font-weight:700;margin-bottom:12px">⏱ ${timeOnMarket}</div>
    ${photosBlock}
    ${contactBlock}
    <div class="info-table" style="text-align:left;margin-bottom:14px">
      ${l.varietyName ? `<div class="info-row"><span class="ir-k">Variety</span><span class="ir-v">${esc(l.varietyName)}</span></div>` : ''}
      <div class="info-row"><span class="ir-k">Quantity</span><span class="ir-v">${esc((l.quantity || '—') + ' ' + pluralUnit(unit, l.quantity || 1))}</span></div>
      <div class="info-row"><span class="ir-k">Price</span><span class="ir-v">${esc(priceDisplay)}</span></div>
      <div class="info-row"><span class="ir-k">Market</span><span class="ir-v">${esc(l.marketName || '—')}</span></div>
      ${l.soldQuantity ? `<div class="info-row"><span class="ir-k">Sold</span><span class="ir-v" style="color:#5b21b6">${l.soldQuantity} ${esc(pluralUnit(unit, l.soldQuantity))}</span></div>` : ''}
      ${l.buyerName ? `<div class="info-row"><span class="ir-k">Buyer</span><span class="ir-v">${esc(l.buyerName)}</span></div>` : ''}
      ${l.availableAt ? `<div class="info-row"><span class="ir-k">Available from</span><span class="ir-v">${esc(fmtDateTime(l.availableAt))}</span></div>` : ''}
      ${l.description ? `<div class="info-row"><span class="ir-k">Notes</span><span class="ir-v">${esc(l.description)}</span></div>` : ''}
    </div>
    ${actions}
  `);
};

window.setAgroTab = (tab) => { S.agroTab = tab; route(); };
window.setAgroCity = (city) => { S.agroCity = city; route(); };
window.setAgroView = (view) => { S.agroView = view; route(); };
window.onAgroSearch = (v) => {
  S.agroSearch = v;
  clearTimeout(window._agroSearchTimer);
  window._agroSearchTimer = setTimeout(() => {
    route();
    const el = document.getElementById('agro-search');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }

};

  S.agroSearch = '';
  route();
};
window.openAgroProduct = (id) => showScreen('product-detail', { id });
window.openBusiness = (id) => showScreen('business-detail', { id });

window.callAgroBusiness = (phone, name) => {
  if (!phone) { toast('No phone number'); return; }
  const clean = String(phone).replace(/[^\d+]/g, '');
  modal(`
    <h3>📞 Call ${esc(name || 'Dealer')}?</h3>
    <p style="font-size:16px;font-weight:900;color:var(--td);margin:8px 0">${esc(phone)}</p>
    <p style="font-size:12px;color:var(--tl)">Call the dealer to ask about their products.</p>
    <div class="mc-actions">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <a class="btn btn-p" href="tel:${esc(clean)}" onclick="setTimeout(closeModal,300)" style="text-decoration:none">📞 Call Now</a>
    </div>

function renderAgroDealers() {
  const all = (S.agroProducts || []).filter(p => p.available !== false);
  const businesses = getBusinessesFromProducts();

  const search = (S.agroSearch || '').toLowerCase().trim();
  const tab = S.agroTab || 'all';
  const city = S.agroCity || 'all';
  const view = S.agroView || 'products';

  const categories = [...new Set(all.map(p => p.category).filter(Boolean))].sort();
  const cities = [...new Set(all.map(p => p.city).filter(Boolean))].sort();

  let filteredProducts = all.slice();
  if (search) {
    filteredProducts = filteredProducts.filter(p =>
      String(p.name || '').toLowerCase().includes(search) ||
      String(p.sellerName || '').toLowerCase().includes(search) ||
      String(p.category || '').toLowerCase().includes(search) ||
      String(p.cropTag || '').toLowerCase().includes(search)
    );
  }
  if (tab !== 'all') filteredProducts = filteredProducts.filter(p => p.category === tab);
  if (city !== 'all') filteredProducts = filteredProducts.filter(p => p.city === city);

  let filteredBusinesses = businesses.slice();
  if (search) {
    filteredBusinesses = filteredBusinesses.filter(b =>
      String(b.name || '').toLowerCase().includes(search)
    );
  }
  if (city !== 'all') filteredBusinesses = filteredBusinesses.filter(b => b.city === city);
  if (tab !== 'all') {
    filteredBusinesses = filteredBusinesses.filter(b =>
      b.products.some(p => p.category === tab)
    );
  }

  const showClear = search.length > 0;

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goHome()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="tb-title">Agro Dealers</div>
    </div>

    <div class="agro-hero">
      <h2>🏪 Agro Dealers</h2>
      <p>Browse products and businesses near you. Call the dealer directly — no cart needed.</p>
      <div class="ah-stats">
        <div class="ah-stat">
          <div class="ah-stat-n">${businesses.length}</div>
          <div class="ah-stat-l">Businesses</div>
        </div>
        <div class="ah-stat">
          <div class="ah-stat-n">${all.length}</div>
          <div class="ah-stat-l">Products</div>
        </div>
        <div class="ah-stat">
          <div class="ah-stat-n">${cities.length}</div>
          <div class="ah-stat-l">Cities</div>
        </div>
      </div>
    </div>

    <div class="agro-search-wrap">
      <span class="agro-search-icon">🔍</span>
      <input id="agro-search" class="agro-search-input" placeholder="Search products, businesses, categories…" value="${esc(S.agroSearch || '')}" oninput="onAgroSearch(this.value)">
      <button class="agro-search-clear ${showClear ? 'show' : ''}" onclick="clearAgroSearch()">✕</button>
    </div>

    <div class="agro-view-toggle">
      <button class="avt-btn ${view === 'products' ? 'active' : ''}" onclick="setAgroView('products')">
        <span class="avt-ic">📦</span> Products
      </button>
      <button class="avt-btn ${view === 'businesses' ? 'active' : ''}" onclick="setAgroView('businesses')">
        <span class="avt-ic">🏪</span> Businesses
      </button>
    </div>

    <div class="biz-filters">
      <button class="biz-filter ${tab === 'all' ? 'active' : ''}" onclick="setAgroTab('all')">All categories</button>
      ${categories.map(c => `<button class="biz-filter ${tab === c ? 'active' : ''}" onclick="setAgroTab('${esc(c)}')">${esc(c)}</button>`).join('')}
    </div>

    ${cities.length > 1 ? `
    <div class="biz-filters">
      <button class="biz-filter ${city === 'all' ? 'active' : ''}" onclick="setAgroCity('all')">📍 All cities</button>
      ${cities.map(c => `<button class="biz-filter ${city === c ? 'active' : ''}" onclick="setAgroCity('${esc(c)}')">📍 ${esc(c)}</button>`).join('')}
    </div>
    ` : ''}

    ${view === 'products' ? `
      <div class="agro-section-label">
        <span>📦 Products</span>
        <span class="asl-cnt">${filteredProducts.length}</span>
      </div>
      ${filteredProducts.length ? filteredProducts.map(p => renderAgroProductCard(p)).join('') : `
        <div class="biz-empty">
          <div class="be-em">📦</div>
          <h3>No products found</h3>
          <p>${search || tab !== 'all' || city !== 'all' ? 'Try a different search, category or city.' : 'Agro dealers will show their products here.'}</p>
        </div>
      `}
    ` : `
      <div class="agro-section-label">
        <span>🏪 Businesses</span>
        <span class="asl-cnt">${filteredBusinesses.length}</span>
      </div>
      ${filteredBusinesses.length ? filteredBusinesses.map(b => renderBusinessCard(b)).join('') : `
        <div class="biz-empty">
          <div class="be-em">🏪</div>
          <h3>No businesses found</h3>
          <p>${search || tab !== 'all' || city !== 'all' ? 'Try a different search, category or city.' : 'Agro dealers will appear here once they add products.'}</p>
        </div>
      `}
    `}

    <div style="height:8px"></div>
  </div>
  ${bottomNavHTML()}`;
}

function renderAgroProductCard(p) {
  const stock = p.stock;
  const stockNum = stock != null ? Number(stock) : null;
  const outOfStock = stockNum === 0;
  const lowStock = stockNum != null && stockNum > 0 && stockNum < 10;

  return `
  <div class="market-card" onclick="openAgroProduct('${esc(p.id)}')">
    <div class="mc-thumb">
      ${p.photoUrl ? `<img src="${esc(p.photoUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">` : pickIcon(p.name)}
    </div>
    <div class="mc-body">
      <div style="display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">
        🏪 ${esc(p.sellerName || 'Dealer')}
      </div>
      <div class="mc-title">${esc(p.name)}</div>
      <div class="mc-meta">${esc(p.category || '')}${p.cropTag ? ' · ' + esc(p.cropTag) : ''}${p.city ? ' · ' + esc(p.city) : ''}</div>
      <div class="mc-price"><strong>${fmtZMK(p.price)}</strong><small>/ ${esc(p.unit || 'unit')}</small></div>
      ${outOfStock ? `<div style="font-size:10.5px;color:var(--danger);font-weight:800;margin-top:4px">● Out of stock</div>` : ''}
      ${lowStock ? `<div style="font-size:10.5px;color:var(--warn);font-weight:800;margin-top:4px">⚠ Only ${stockNum} left</div>` : ''}
    </div>
    <div class="mc-side">
      ${p.sellerPhone
        ? `<a class="biz-card-call" href="tel:${esc(String(p.sellerPhone).replace(/[^\d+]/g,''))}" onclick="event.stopPropagation()" aria-label="Call">
             <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
           </a>`
        : ''}
    </div>
  </div>`;
}

function renderBusinessCard(b) {
  const photoCount = b.products.length;
  const categories = [...new Set(b.products.map(p => p.category).filter(Boolean))];
  const cheapest = b.products.reduce((min, p) => {
    const price = Number(p.price);
    if (isNaN(price) || price <= 0) return min;
    return min === null || price < min ? price : min;
  }, null);
  return `
  <div class="business-card" onclick="openBusiness('${esc(b.id)}')">
    <div class="biz-card-hero">
      <div class="biz-card-logo">
        ${b.logo ? `<img src="${esc(b.logo)}" alt="">` : initials(b.name)}
      </div>
      <div class="biz-card-info">
        <div class="biz-card-name">${esc(b.name)}</div>
        <div class="biz-card-city">📍 ${esc(b.city || 'Unknown')}</div>
      </div>
    </div>
    <div class="biz-card-body">
      <div class="biz-card-stat">
        <div class="bcs-num">${photoCount}</div>
        <div class="bcs-lb">Products</div>
      </div>
      <div class="biz-card-stat">
        <div class="bcs-num">${categories.length}</div>
        <div class="bcs-lb">Categories</div>
      </div>
      <div class="biz-card-stat">
        <div class="bcs-num" style="font-size:13px">${cheapest != null ? fmtZMK(cheapest) : '—'}</div>
        <div class="bcs-lb">From</div>
      </div>
      ${b.phone
        ? `<a class="biz-card-call" href="tel:${esc(String(b.phone).replace(/[^\d+]/g,''))}" onclick="event.stopPropagation()" aria-label="Call">
             <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
           </a>`
        : `<div class="biz-cta-arrow">

           </div>`}
    </div>
  </div>`;
}

function getCropNameFromListing(l) {
  if (l.productName) return l.productName;
  return String(l.title || '').replace(/^\s*Fresh\s+/i, '').replace(/\s*–.*$/, '').trim() || 'Other';
}

function computeDemandIndicator(crop, city, allBatches, allListings) {
  const expectedSupply = allBatches
    .filter(b => (city === 'all' || b.town === city) && (!crop || b.cropName === crop))
    .reduce((s, b) => s + (b.estimatedBoxes || 0), 0);
  const totalExpected = allBatches
    .filter(b => (city === 'all' || b.town === city))
    .reduce((s, b) => s + (b.estimatedBoxes || 0), 0);
  const listings = allListings.filter(l =>
    (city === 'all' || l.city === city) &&
    (!crop || getCropNameFromListing(l) === crop)
  ).length;
  const supplyRatio = totalExpected > 0 ? expectedSupply / totalExpected : 0;
  if (supplyRatio > 0.45 || listings > 8) return 'low';
  if (supplyRatio > 0.2 || listings > 3) return 'medium';
  return 'high';
}

function renderMarketAnalysis() {
  const allListings = (S.marketplace || []).filter(l =>
    l.status !== 'removed' && l.availabilityStatus !== 'removed' && l.availabilityStatus !== 'sold'
  );

  const years = [...new Set(allListings.map(l => l.createdAt ? new Date(l.createdAt).getFullYear() : null).filter(Boolean))].sort((a,b) => b - a);
  const cities = [...new Set(allListings.map(l => l.city).filter(Boolean))].sort();
  const crops = [...new Set(allListings.map(l => getCropNameFromListing(l)).filter(Boolean))].sort();

  const city = S.analysisMarket || 'all';
  const cropF = S.analysisCrop || 'all';
  const monthF = S.analysisMonth || 'all';
  const yearF = S.analysisYear || 'all';

  let filtered = allListings.slice();
  if (city !== 'all') filtered = filtered.filter(l => l.city === city);
  if (cropF !== 'all') filtered = filtered.filter(l => getCropNameFromListing(l) === cropF);
  if (monthF !== 'all') filtered = filtered.filter(l => l.createdAt && new Date(l.createdAt).getMonth() === parseInt(monthF));
  if (yearF !== 'all') filtered = filtered.filter(l => l.createdAt && new Date(l.createdAt).getFullYear() === parseInt(yearF));

  const priceByCrop = {};
  filtered.forEach(l => {
    const name = getCropNameFromListing(l);
    let p = 0;
    if (l.priceMode === 'total' && l.quantity) p = (parseFloat(l.priceAmount) || 0) / l.quantity;
    else p = parseFloat(l.pricePerBox || l.priceAmount || 0);
    if (p <= 0) return;
    if (!priceByCrop[name]) priceByCrop[name] = { min: Infinity, max: 0, towns: new Set(), unit: l.unit || 'box' };
    priceByCrop[name].min = Math.min(priceByCrop[name].min, p);
    priceByCrop[name].max = Math.max(priceByCrop[name].max, p);
    if (l.city) priceByCrop[name].towns.add(l.city);
  });
  const priceList = Object.entries(priceByCrop).sort((a,b) => {
    const aAvg = (a[1].min + a[1].max) / 2;
    const bAvg = (b[1].min + b[1].max) / 2;
    return bAvg - aAvg;
  });

  const trending = filtered
    .slice()
    .sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0))
    .slice(0, 8);

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goBack()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="tb-title">Market Analysis</div>
      <div class="tb-actions">
        <button class="tb-btn" onclick="navTo('preview-market')" title="Preview Market">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
      </div>
    </div>

    <div class="analysis-filters">
      <div class="af-box">
        <label>Market</label>
        <div class="af-value"><span>📍 ${city === 'all' ? 'All cities' : esc(city)}</span><span class="st-arrow">▼</span></div>
        <select onchange="setAnalysisMarket(this.value)">
          <option value="all" ${city === 'all' ? 'selected' : ''}>All cities</option>
          ${cities.map(c => `<option value="${esc(c)}" ${c === city ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="af-box">
        <label>Crop</label>
        <div class="af-value"><span>🌱 ${cropF === 'all' ? 'All crops' : esc(cropF)}</span><span class="st-arrow">▼</span></div>
        <select onchange="setAnalysisCrop(this.value)">
          <option value="all" ${cropF === 'all' ? 'selected' : ''}>All crops</option>
          ${crops.map(c => `<option value="${esc(c)}" ${c === cropF ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="af-box">
        <label>Month</label>
        <div class="af-value"><span>📅 ${monthF === 'all' ? 'All months' : MONTH_NAMES[parseInt(monthF)]}</span><span class="st-arrow">▼</span></div>
        <select onchange="setAnalysisMonth(this.value)">
          <option value="all" ${monthF === 'all' ? 'selected' : ''}>All months</option>
          ${MONTH_NAMES.map((m, i) => `<option value="${i}" ${String(i) === monthF ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
      </div>
      <div class="af-box">
        <label>Year</label>
        <div class="af-value"><span>🗓️ ${yearF === 'all' ? 'All years' : yearF}</span><span class="st-arrow">▼</span></div>
        <select onchange="setAnalysisYear(this.value)">
          <option value="all" ${yearF === 'all' ? 'selected' : ''}>All years</option>
          ${years.map(y => `<option value="${y}" ${String(y) === String(yearF) ? 'selected' : ''}>${y}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="analysis-hero">
      <h2>📊 Market Prices</h2>
      <p>Prices per crop and the towns where they're being sold${city !== 'all' ? ' in ' + esc(city) : ''}${cropF !== 'all' ? ' for ' + esc(cropF) : ''}${monthF !== 'all' ? ' · ' + MONTH_NAMES[parseInt(monthF)] : ''}${yearF !== 'all' ? ' · ' + yearF : ''}.</p>
    </div>

    <div class="ma-section">
      <h3>💰 Price Range by Crop</h3>
      ${priceList.length ? priceList.map(([name, data]) => {
        const unit = data.unit || 'box';
        const towns = [...data.towns];
        return `
          <div style="padding:12px 0;border-bottom:1px solid var(--bd)">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">
              <div style="font-size:13px;font-weight:900;color:var(--td)">${pickIcon(name)} ${esc(name)}</div>
              <div style="font-size:14px;font-weight:900;color:var(--p-d);white-space:nowrap;text-align:right">
                ${fmtZMK(data.min)}${data.max > data.min ? ' – ' + fmtZMK(data.max) : ''}
              </div>
            </div>
            <div style="font-size:11px;color:var(--tl);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span>📍 ${towns.length ? towns.map(t => esc(t)).join(', ') : 'No towns'}</span>
              <span style="color:var(--tm)">·</span>
              <span>/ ${esc(singularUnit(unit))}</span>
            </div>
          </div>
        `;
      }).join('') : `<div class="empty" style="padding:16px"><p>No listings match this filter.</p></div>`}
    </div>

    <div class="ma-section">
      <h3>🔥 Trending</h3>
      ${trending.length ? trending.map(l => {
        const unit = l.unit || 'box';
        return `
        <div class="trend-card" onclick="viewMarketListing('${esc(l.id)}')">
          <div class="trend-ic">${pickIcon(getCropNameFromListing(l))}</div>
          <div class="trend-body">
            <div class="trend-name">${esc(getCropNameFromListing(l))}</div>
            <div class="trend-market">${esc(l.marketName || 'Market')} · ${esc(l.city || '')}</div>
          </div>
          <div class="trend-price">
            <strong>${fmtZMK(l.priceAmount)}</strong>
            <small>${l.priceMode === 'total' ? 'total' : '/ ' + singularUnit(unit)}</small>
          </div>
        </div>`;
      }).join('') : `<div class="empty" style="padding:16px"><p>No listings match this filter.</p></div>`}
    </div>

    <div style="padding:0 18px 18px">
      <button class="btn btn-p" onclick="navTo('preview-market')">👁 Preview Market Board</button>
    </div>

    <div style="height:8px"></div>
  </div>
  ${bottomNavHTML()}`;
}

function renderPreviewMarket() {
  const allListings = (S.marketplace || []).filter(l =>
    l.status !== 'removed' && l.availabilityStatus !== 'removed' && l.availabilityStatus !== 'sold'
  );

  const years = [...new Set(allListings.map(l => l.createdAt ? new Date(l.createdAt).getFullYear() : null).filter(Boolean))].sort((a,b) => b - a);
  const cities = [...new Set(allListings.map(l => l.city).filter(Boolean))].sort();
  const markets = [...new Set(allListings.map(l => l.marketName).filter(Boolean))].sort();
  const crops = [...new Set(allListings.map(l => getCropNameFromListing(l)).filter(Boolean))].sort();

  const selYear = S.previewYear || 'all';
  const selCity = S.previewCity || (S.weatherCity || 'all');
  const selMarket = S.previewMarket || 'all';
  const selCrop = S.previewCrop || 'all';

  let filtered = allListings.slice();
  if (selYear !== 'all') filtered = filtered.filter(l => l.createdAt && new Date(l.createdAt).getFullYear() === parseInt(selYear));
  if (selCity !== 'all') filtered = filtered.filter(l => l.city === selCity);
  if (selMarket !== 'all') filtered = filtered.filter(l => l.marketName === selMarket);
  if (selCrop !== 'all') filtered = filtered.filter(l => getCropNameFromListing(l) === selCrop);

  const cropMap = {};
  filtered.forEach(l => {
    const name = getCropNameFromListing(l);
    if (!name) return;
    if (!cropMap[name]) cropMap[name] = { prices: [], count: 0 };
    let p = 0;
    if (l.priceMode === 'total' && l.quantity) p = (parseFloat(l.priceAmount) || 0) / l.quantity;
    else p = parseFloat(l.pricePerBox || l.priceAmount || 0);
    if (p > 0) cropMap[name].prices.push(p);
    cropMap[name].count++;
  });

  const rows = Object.entries(cropMap).map(([name, data]) => {
    const avg = data.prices.length ? Math.round(data.prices.reduce((a, b) => a + b, 0) / data.prices.length) : 0;
    return { name, price: 'K' + avg, icon: pickIcon(name) };
  });
  rows.sort((a, b) => a.name.localeCompare(b.name));

  const today = new Date();
  const dateStr = `${today.getDate()} ${MONTH_NAMES[today.getMonth()]} ${today.getFullYear()}`;

  return `
  <div class="scroll market-board-page" style="padding-top:0">
    <div class="topbar" style="background:transparent;border-bottom:1px solid rgba(255,255,255,.12)">
      <button class="tb-back" onclick="navTo('marketplace')" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2)">
        <svg viewBox="0 0 24 24" style="fill:#fff"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="tb-title" style="color:#fbbf24">Market Update</div>
    </div>

    <div style="padding:10px 18px 0;position:relative;z-index:2">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="af-box" style="background:rgba(0,0,0,.35);border:1px solid rgba(251,191,36,.3)">
          <label style="color:#fbbf24">Year</label>
          <div class="af-value" style="color:#f0fdf4"><span>🗓️ ${selYear === 'all' ? 'All years' : selYear}</span><span class="st-arrow" style="color:#fbbf24">▼</span></div>
          <select onchange="setPreviewYear(this.value)">
            <option value="all" ${selYear === 'all' ? 'selected' : ''}>All years</option>
            ${years.map(y => `<option value="${y}" ${String(y) === String(selYear) ? 'selected' : ''}>${y}</option>`).join('')}
          </select>
        </div>
        <div class="af-box" style="background:rgba(0,0,0,.35);border:1px solid rgba(251,191,36,.3)">
          <label style="color:#fbbf24">City</label>
          <div class="af-value" style="color:#f0fdf4"><span>📍 ${selCity === 'all' ? 'All cities' : esc(selCity)}</span><span class="st-arrow" style="color:#fbbf24">▼</span></div>
          <select onchange="setPreviewCity(this.value)">
            <option value="all" ${selCity === 'all' ? 'selected' : ''}>All cities</option>
            ${cities.map(c => `<option value="${esc(c)}" ${c === selCity ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="af-box" style="background:rgba(0,0,0,.35);border:1px solid rgba(251,191,36,.3)">
          <label style="color:#fbbf24">Market</label>
          <div class="af-value" style="color:#f0fdf4"><span>🏪 ${selMarket === 'all' ? 'All markets' : esc(selMarket)}</span><span class="st-arrow" style="color:#fbbf24">▼</span></div>
          <select onchange="setPreviewMarket(this.value)">
            <option value="all" ${selMarket === 'all' ? 'selected' : ''}>All markets</option>
            ${markets.map(m => `<option value="${esc(m)}" ${m === selMarket ? 'selected' : ''}>${esc(m)}</option>`).join('')}
          </select>
        </div>
        <div class="af-box" style="background:rgba(0,0,0,.35);border:1px solid rgba(251,191,36,.3)">
          <label style="color:#fbbf24">Crop</label>
          <div class="af-value" style="color:#f0fdf4"><span>🌱 ${selCrop === 'all' ? 'All crops' : esc(selCrop)}</span><span class="st-arrow" style="color:#fbbf24">▼</span></div>
          <select onchange="setPreviewCrop(this.value)">
            <option value="all" ${selCrop === 'all' ? 'selected' : ''}>All crops</option>
            ${crops.map(c => `<option value="${esc(c)}" ${c === selCrop ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>

    <div style="padding:20px 18px 20px;position:relative;z-index:1">
      <div class="pb-head">
        <div class="pb-sub">Farmer · Championing Agribusiness</div>
        <div class="pb-title">MARKET UPDATE</div>
        <div class="pb-loc">📍 ${selCity === 'all' ? 'ALL CITIES' : esc(selCity.toUpperCase())}</div>
        <div class="pb-date">📅 ${esc(dateStr)}</div>
      </div>

      <div class="pb-grid">
        ${rows.length ? rows.map((r, i) => `
          <div class="pb-item">
            <div class="pb-num">${i + 1}</div>
            <div class="pb-icon">${r.icon}</div>
            <div class="pb-name">${esc(r.name)}</div>
            <div class="pb-price">${esc(r.price)}</div>
          </div>
        `).join('') : `
          <div class="pb-empty" style="grid-column:1/-1">
            🌾 No crops match the current filters.
            <div style="font-size:11.5px;font-weight:600;margin-top:10px;opacity:.85">Try changing the filters above.</div>
          </div>
        `}
      </div>

      <div class="pb-footer">AgriCare · Market Data Live</div>
    </div>
  </div>
  ${bottomNavHTML()}`;
}

function renderDelivery() {
  const farmerCity = S.weatherCity || S.userLocation || 'Lusaka';
  const farmerCoords = S.userCoords;
  const filter = S.deliveryVehicleFilter || 'all';

  const allPartners = S.allDeliveryPartners || [];

  const inCityAll = allPartners.filter(p => partnerMatchesCity(p, farmerCity, farmerCoords));

  const pool = filter === 'all'
    ? inCityAll
    : inCityAll.filter(p => p.vehicleType === filter);

  const available = pool.filter(p => partnerIsAvailable(p));
  const unavailable = pool.filter(p => !partnerIsAvailable(p));

  available.sort((a,b) => partnerDisplayName(a).localeCompare(partnerDisplayName(b)));
  unavailable.sort((a,b) => partnerDisplayName(a).localeCompare(partnerDisplayName(b)));

  const pillDefs = [
    { key: 'all',     em: '🚚', lb: 'All',     count: inCityAll.length },
    { key: 'bicycle', em: '🚲', lb: 'Bicycle', count: inCityAll.filter(p => p.vehicleType === 'bicycle').length },
    { key: 'bike',    em: '🏍️', lb: 'Bike',    count: inCityAll.filter(p => p.vehicleType === 'bike').length },
    { key: 'car',     em: '🚗', lb: 'Car',     count: inCityAll.filter(p => p.vehicleType === 'car').length },
    { key: 'truck',   em: '🚚', lb: 'Truck',   count: inCityAll.filter(p => p.vehicleType === 'truck').length }
  ];

  const pillHTML = pillDefs.map(p => `
    <button class="delivery-filter-pill ${filter === p.key ? 'active' : ''}" onclick="setDeliveryVehicleFilter('${p.key}')">
      <span class="dfp-em">${p.em}</span>
      <span class="dfp-lb">${p.lb}</span>
      <span class="dfp-cnt ${p.count === 0 ? 'zero' : ''}">${p.count}</span>
    </button>
  `).join('');

  const renderPartnerCard = (p) => {
    const avail = partnerIsAvailable(p);
    const name = partnerDisplayName(p);
    const phone = partnerPhone(p);
    const photo = p.profileUrl || p.vehiclePhoto || '';
    const vehicle = vehicleLabel(p.vehicleType);
    const vEmoji = vehicleEmoji(p.vehicleType);
    const initials_ = initials(name);

    const callBtn = avail && phone
      ? `<a class="dpc-call-btn" href="tel:${esc(phone)}" onclick="event.stopPropagation()" aria-label="Call">
           <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
         </a>`
      : `<span class="dpc-call-btn disabled">
           <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
         </span>`;

    return `
      <div class="delivery-partner-card ${avail ? 'available' : 'unavailable'}" onclick="openDeliveryPartner('${esc(p.id)}')">
        <div class="dpc-avatar">
          ${photo ? `<img src="${esc(photo)}" alt="">` : initials_}
          <span class="dpc-dot ${avail ? 'online' : ''}"></span>
        </div>
        <div class="dpc-body">
          <div class="dpc-name">${esc(name)}</div>
          <div class="dpc-meta">
            <span class="dpc-vehicle-chip">${vEmoji} ${esc(vehicle)}</span>
            <span class="dpc-availability ${avail ? 'online' : 'offline'}">${avail ? '● Available' : '○ Offline'}</span>
          </div>
        </div>
        ${callBtn}
      </div>`;
  };

  const availableHTML = available.length
    ? available.map(renderPartnerCard).join('')
    : '';

  const unavailableHTML = unavailable.length
    ? unavailable.map(renderPartnerCard).join('')
    : '';

  const hasAnyInCity = inCityAll.length > 0;

  return `
  <div class="scroll">
    <div class="topbar bordered"><div class="tb-title">Hire a Transporter</div></div>

    <div class="delivery-intro">
      <h2>🚚 Delivery Vehicles</h2>
      <p>Call a delivery partner to come pick up your produce. Only available partners can be called directly.</p>
      <div class="di-city">📍 ${esc(farmerCity)}</div>
    </div>

    <div class="delivery-filter-row">${pillHTML}</div>

    ${!hasAnyInCity ? `
      <div class="delivery-empty">
        <div class="de-em">🚚</div>
        <h3>No vehicles near ${esc(farmerCity)} yet</h3>
        <p>Delivery partners will appear here once they register in your area. Try checking again later.</p>
      </div>
    ` : `
      ${available.length ? `
        <div class="delivery-section-label available">
          <span class="dsl-dot"></span>
          <span>Available now</span>
          <span class="dsl-cnt">${available.length}</span>
        </div>
        ${availableHTML}
      ` : `
        <div style="padding:8px 18px 12px">
          <div class="delivery-note">
            <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z"/></svg>
            <div class="dn-tx">No ${filter === 'all' ? '' : vehicleLabel(filter).toLowerCase() + ' '}vehicles are available right now. You can still see registered partners below.</div>

      ${unavailable.length ? `
        <div class="delivery-section-label unavailable">
          <span class="dsl-dot"></span>
          <span>Currently offline</span>
          <span class="dsl-cnt">${unavailable.length}</span>
        </div>
        ${unavailableHTML}
      ` : ''}

      ${!available.length && !unavailable.length ? `
        <div class="delivery-empty">
          <div class="de-em">🔍</div>
          <h3>No ${filter === 'all' ? '' : vehicleLabel(filter).toLowerCase() + ' '}partners</h3>
          <p>Try a different vehicle type above.</p>
        </div>
      ` : ''}
    `}

    <div style="height:8px"></div>
  </div>
  ${bottomNavHTML()}`;
}

function renderDeliveryDetail(id) {

function computeCelestialPosition(now) {
  const hour = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
  const isDay = hour >= 6 && hour < 18;
  let progress;
  if (isDay) progress = (hour - 6)/12;
  else { const nh = hour >= 18 ? hour - 18 : hour + 6; progress = nh/12; }
  progress = Math.max(0, Math.min(1, progress));
  const angle = Math.PI * (1 - progress);
  const cx = 150, cy = 120, r = 100;
  const x = cx - r * Math.cos(angle);
  const y = cy - r * Math.sin(angle);
  return { x, y, isDay, hour, progress };
}
function startWeatherClock() {
  clearInterval(S.weatherClockTimer);
  const tick = () => {
    const now = new Date();
    const timeEl = document.getElementById('weather-live-time');
    const dateEl = document.getElementById('weather-live-date');
    const badgeEl = document.getElementById('weather-live-badge');
    const celestialEl = document.getElementById('weather-celestial-body');
    const glowEl = document.getElementById('weather-celestial-glow');
    const sunGroup = document.getElementById('celestial-sun');
    const moonGroup = document.getElementById('celestial-moon');
    const noteEl = document.getElementById('weather-celestial-note');

    const hh = pad2(now.getHours()), mm = pad2(now.getMinutes()), ss = pad2(now.getSeconds());
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    if (timeEl) timeEl.textContent = `${hh}:${mm}:${ss}`;
    if (dateEl) dateEl.textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

    const pos = computeCelestialPosition(now);
    if (badgeEl) {
      badgeEl.textContent = pos.isDay ? '☀️ Day' : '🌙 Night';
      badgeEl.classList.toggle('night', !pos.isDay);
    }
    if (celestialEl && glowEl) {
      celestialEl.setAttribute('cx', pos.x.toFixed(1));
      celestialEl.setAttribute('cy', pos.y.toFixed(1));
      glowEl.setAttribute('cx', pos.x.toFixed(1));
      glowEl.setAttribute('cy', pos.y.toFixed(1));
    }
    if (sunGroup && moonGroup) {
      sunGroup.style.display = pos.isDay ? 'inline' : 'none';
      moonGroup.style.display = pos.isDay ? 'none' : 'inline';
    }
    if (noteEl) {
      noteEl.textContent = pos.isDay
        ? `Sun is ${Math.round(pos.progress * 100)}% across the sky. Sunrise 6:00 · Sunset 18:00.`
        : `Moon is ${Math.round(pos.progress * 100)}% across the night sky. Night runs 18:00 → 6:00.`;
    }
  };
  tick();
  S.weatherClockTimer = setInterval(tick, 1000);
}

window.setFarmersCity = (city) => { S.farmersCity = city; route(); };
function renderFarmersByCity() {
  const all = (S.allFarmersBatches || []).filter(b => b.town);
  const cityMap = {};
  all.forEach(b => { cityMap[b.town] = (cityMap[b.town] || 0) + 1; });
  const cities = Object.keys(cityMap).sort((a,b) => cityMap[b] - cityMap[a]);
  const selected = S.farmersCity || S.weatherCity || (cities[0] || 'Lusaka');
  if (!S.farmersCity) S.farmersCity = selected;
  const filtered = all.filter(b => b.town === selected);

  const byCrop = {};
  filtered.forEach(b => {
    if (!byCrop[b.cropName]) byCrop[b.cropName] = { expected: 0, count: 0 };
    byCrop[b.cropName].count++;
    byCrop[b.cropName].expected += b.estimatedBoxes || 0;
  });
  const cropList = Object.entries(byCrop).sort((a,b) => b[1].expected - a[1].expected);
  const totalExpected = filtered.reduce((s, b) => s + (b.estimatedBoxes || 0), 0);

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goBack()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="tb-title">Farmers by City</div>
    </div>
    <div class="analysis-hero">
      <h2>🧑‍🌾 Farmers by City</h2>
      <p>See what other AgriCare farmers are planting and raising in each town.</p>
    </div>
    <div class="city-chips">
      ${cities.length ? cities.map(c => `
        <button class="city-chip ${c === selected ? 'active' : ''}" onclick="setFarmersCity('${esc(c)}')">📍 ${esc(c)} <span style="opacity:.7;font-weight:700">·${cityMap[c]}</span></button>
      `).join('') : `<div style="color:var(--tl);font-weight:700;font-size:12px;padding:6px 12px">No farmers recorded yet.</div>`}
    </div>
    <div class="ma-section">
      <h3>By Crop in ${esc(selected)}</h3>
      ${cropList.length ? cropList.map(([name, data], idx) => {
        const pct = totalExpected ? Math.round(data.expected / totalExpected * 100) : 0;
        return `
          <div class="analysis-crop-row">
            <div class="acr-head">
              <div class="acr-name">${pickIcon(name)} ${esc(name)}</div>
              ${idx === 0 ? `<span class="acr-top">🥇 Top</span>` : `<span style="font-size:11px;color:var(--tl);font-weight:700">${pct}%</span>`}
            </div>
            <div class="acr-bars">
              <div class="acr-bar-row">
                <span class="acr-bar-lb">Yield</span>
                <div class="acr-bar-track"><div class="acr-bar-fill act" style="width:${Math.min(100, data.expected / Math.max(1, totalExpected) * 100)}%"></div></div>
                <span class="acr-bar-val">${data.expected.toLocaleString()}</span>
              </div>
            </div>
          </div>`;
      }).join('') : `<div class="empty" style="padding:20px"><p>No crops planted here yet.</p></div>`}
    </div>
    <div style="height:8px"></div>
  </div>
  ${bottomNavHTML()}`;
}

/* ============================================================
   FARM ANALYSIS
   ============================================================ */
window.setAnalysisYear = (y) => { S.analysisYear = (y === 'all') ? null : parseInt(y); route(); };
window.setAnalysisCity = (c) => { S.analysisCity = c; route(); };

function renderFarmAnalysis() {
  const all = (S.allFarmersBatches || []).filter(b => b.plantedDate);
  const years = [...new Set(all.map(b => new Date(b.plantedDate).getFullYear()))].sort((a,b) => b - a);
  const cities = [...new Set(all.map(b => b.town).filter(Boolean))].sort();
  const selYear = S.analysisYear || (years[0] || new Date().getFullYear());
  const selCity = S.analysisCity || 'all';

  const filtered = all.filter(b => {
    const y = new Date(b.plantedDate).getFullYear();
    if (y !== selYear) return false;
    if (selCity !== 'all' && b.town !== selCity) return false;
    return true;
  });

  const totalExpected = filtered.reduce((s, b) => s + (b.estimatedBoxes || 0), 0);
  const totalActual = filtered.reduce((s, b) => s + (b.actualBoxes || 0), 0);
  const deltaPct = totalExpected ? Math.round((totalActual - totalExpected) / totalExpected * 100) : 0;
  const efficiency = totalExpected ? Math.round(totalActual / totalExpected * 100) : 0;

  const byCrop = {};
  filtered.forEach(b => {
    if (!byCrop[b.cropName]) byCrop[b.cropName] = { expected: 0, actual: 0 };
    byCrop[b.cropName].expected += b.estimatedBoxes || 0;
    byCrop[b.cropName].actual += b.actualBoxes || 0;
  });
  const sortedCrops = Object.entries(byCrop).sort((a,b) => b[1].expected - a[1].expected);
  const topCrop = sortedCrops[0];

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goBack()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <div class="tb-title">Farm Analysis</div>
    </div>
    <div class="analysis-hero">
      <h2>📈 Farm Analysis · ${selYear}</h2>
      <p>Historical production. Compare what was expected and produced.</p>
    </div>
    <div class="analysis-filters">
      <div class="af-box">
        <label>Year</label>
        <div class="af-value"><span>📅 ${selYear}</span><span class="st-arrow">▼</span></div>
        <select onchange="setAnalysisYear(this.value)">
          ${years.length ? years.map(y => `<option value="${y}" ${y === selYear ? 'selected' : ''}>${y}</option>`).join('') : `<option>${selYear}</option>`}
        </select>
      </div>
      <div class="af-box">
        <label>City</label>
        <div class="af-value"><span>📍 ${selCity === 'all' ? 'All cities' : esc(selCity)}</span><span class="st-arrow">▼</span></div>
        <select onchange="setAnalysisCity(this.value)">
          <option value="all" ${selCity === 'all' ? 'selected' : ''}>All cities</option>
          ${cities.map(c => `<option value="${esc(c)}" ${c === selCity ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="analysis-stat-grid">
      <div class="as-card">
        <div class="as-ic">📦</div>
        <div class="as-lb">Expected</div>
        <div class="as-v">${totalExpected.toLocaleString()}</div>
        <div class="as-sub">units planned</div>
      </div>
      <div class="as-card highlight">
        <div class="as-ic">✅</div>
        <div class="as-lb">Produced</div>
        <div class="as-v">${totalActual.toLocaleString()}</div>
        <div class="as-sub">actual units</div>
      </div>
      <div class="as-card">
        <div class="as-ic">${deltaPct >= 0 ? '📈' : '📉'}</div>
        <div class="as-lb">Efficiency</div>
        <div class="as-v">${efficiency}%</div>
        <div class="as-sub as-delta ${deltaPct >= 0 ? 'up' : 'down'}">${deltaPct >= 0 ? '+' : ''}${deltaPct}% vs expected</div>
      </div>
      <div class="as-card">
        <div class="as-ic">🥇</div>
        <div class="as-lb">Top crop</div>
        <div class="as-v" style="font-size:16px">${topCrop ? esc(topCrop[0]) : '—'}</div>
        <div class="as-sub">${topCrop ? topCrop[1].expected.toLocaleString() + ' units' : '—'}</div>
      </div>
    </div>
    <div class="ma-section">
      <h3>Production by Crop</h3>
      ${sortedCrops.length ? sortedCrops.map(([name, data], idx) => {
        const maxVal = Math.max(data.expected, data.actual, 1);
        const isTop = idx === 0;
        return `
          <div class="analysis-crop-row">
            <div class="acr-head">
              <div class="acr-name">${pickIcon(name)} ${esc(name)}</div>
              ${isTop ? `<span class="acr-top">🥇 Top</span>` : ''}
            </div>
            <div class="acr-bars">
              <div class="acr-bar-row">
                <span class="acr-bar-lb">Expected</span>
                <div class="acr-bar-track"><div class="acr-bar-fill exp" style="width:${Math.min(100, data.expected / maxVal * 100)}%"></div></div>
                <span class="acr-bar-val">${data.expected.toLocaleString()}</span>
              </div>
              <div class="acr-bar-row">
                <span class="acr-bar-lb">Actual</span>
                <div class="acr-bar-track"><div class="acr-bar-fill act" style="width:${Math.min(100, data.actual / maxVal * 100)}%"></div></div>
                <span class="acr-bar-val">${data.actual.toLocaleString()}</span>
              </div>
            </div>
          </div>`;
      }).join('') : `<div class="empty" style="padding:20px"><p>No batches recorded for this filter.</p></div>`}
    </div>
    <div style="height:8px"></div>
  </div>
  ${bottomNavHTML()}`;
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function startApp() {
  const splash = document.getElementById('splash');
  requestAnimationFrame(() => splash.classList.add('show'));

  onAuthStateChanged(auth, async (user) => {
    await new Promise(r => setTimeout(r, 2500));
    if (!user) { window.location.href = 'index.html'; return; }

    S.user = user;
    S.theme = document.documentElement.getAttribute('data-theme') || 'light';

    await loadAgriKnowledge();
    const ud = await loadUserData(user.uid);
    S.profile = ud.profile || {};
    S.myListings = ud.listings || [];
    S.following = ud.following || {};
    S.myBatches = ud.batches || [];

    if (S.profile.location) S.userLocation = S.profile.location;
    if (S.profile.city) S.weatherCity = S.profile.city;
    if (S.profile.currentFarmId) S.currentFarmId = S.profile.currentFarmId;

    S.marketplace = await loadMarketplace();
    startNotificationsListener();
    startAllBatchesListener();
    startMarketplaceListener();
    startAgroProductsListener();
    startFarmsListener();
    startDeliveryPartnersListener();

    const app = document.getElementById('app');
    app.innerHTML = `<div class="screen-wrap"></div>`;
    const wrap = app.querySelector('.screen-wrap');
    const home = document.createElement('div');
    home.className = 'screen';
    home.id = 'screen-home';
    wrap.appendChild(home);
    activeScreenEl = home;
    S.screen = 'home';
    home.classList.add('active');
    route();
    try { history.replaceState({ screen:'home' }, '', '#home'); } catch (e) {}

    await detectUserCityAndWeather();

    setTimeout(() => { migrateLegacyBatches(); }, 1500);

    startPendingCheckTimer();
    startCountdownTicker();
    startStageAdvancementChecker();

    clearInterval(S.weatherRefreshTimer);
    S.weatherRefreshTimer = setInterval(async () => {
      if (S.userCoords) {
        S.weather = await loadWeatherByCoords(S.userCoords.lat, S.userCoords.lng);
        if (S.screen === 'home' || S.screen === 'weather-detail') route();
      }
    }, 30 * 60 * 1000);
  });
}
startApp();

setTimeout(() => {
  const splash = document.getElementById('splash');
  if (splash && splash.parentNode) {
    setTimeout(() => {
      splash.classList.remove('show');
      setTimeout(() => { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 1000);
    }, 300);
  }
}, 2700);

window.addEventListener('unhandledrejection', e => { console.warn('Unhandled:', e.reason); });
</script>
