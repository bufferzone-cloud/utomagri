window.toggleComments = (postId)=>{
  const el = document.getElementById('comments-'+postId);
  if(!el) return;
  const isOpen = el.classList.contains('open');
  if(isOpen){
    el.classList.remove('open');
    if(S.postCommentsUnsubs[postId]){ S.postCommentsUnsubs[postId](); delete S.postCommentsUnsubs[postId]; }
    return;
  }
  el.classList.add('open');
  if(S.postCommentsUnsubs[postId]) S.postCommentsUnsubs[postId]();
  const r = ref(db, `communityPosts/${postId}/comments`);
  S.postCommentsUnsubs[postId] = onValue(r, (snap)=>{
    const list = document.getElementById('c-list-'+postId);
    if(!list) return;
    const data = snap.val() || {};
    const arr = Object.entries(data).map(([id, v])=>({id, ...v}));
    arr.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(!arr.length){
      list.innerHTML = `<div style="font-size:11.5px;color:var(--tm);padding:4px 0">No comments yet. Be the first.</div>`;
      return;
    }
    list.innerHTML = arr.map(c=>{
      const myComment = c.authorId === S.user.uid;
      return `
        <div class="comment">
          <div class="c-av">${c.authorPhoto?`<img src="${esc(c.authorPhoto)}" alt="">`:initials(c.authorName||'F')}</div>
          <div class="c-body">
            <div class="c-name">${esc(c.authorName||'Farmer')}</div>
            <div class="c-text">${esc(c.text||'')}</div>
            <div class="c-meta">
              <span>${timeAgo(c.createdAt)}</span>
              ${myComment?`<button onclick="deleteComment('${esc(postId)}','${esc(c.id)}')">Delete</button>`:''}
            </div>
          </div>
        </div>`;
    }).join('');
  });
};

window.submitComment = async (postId)=>{
  const input = document.getElementById('c-input-'+postId);
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  try{
    const r = push(ref(db, `communityPosts/${postId}/comments`));
    await set(r, {
      authorId: S.user.uid,
      authorName: (S.profile.firstName||'')+' '+(S.profile.lastName||''),
      authorPhoto: S.profile.profileUrl||'',
      text, createdAt: Date.now()
    });
    const post = S.community.find(p=>p.id===postId);
    if(post) await update(ref(db, `communityPosts/${postId}`), { commentCount: (post.commentCount||0)+1 });
    if(post && post.authorId && post.authorId !== S.user.uid){
      try{
        const notifRef = push(ref(db, `users/${post.authorId}/notifications`));
        await set(notifRef, {
          type:'comment', title:'💬 New comment',
          text:`${(S.profile.firstName||'')} ${(S.profile.lastName||'')} commented on your post`,
          link:'screen:post-detail/'+postId,
          createdAt: Date.now(), read: false
        });
      }catch(e){}
    }
  }catch(e){ toast('Failed to comment'); }
};

window.deleteComment = async (postId, commentId)=>{
  try{
    await remove(ref(db, `communityPosts/${postId}/comments/${commentId}`));
    const post = S.community.find(p=>p.id===postId);
    if(post) await update(ref(db, `communityPosts/${postId}`), { commentCount: Math.max(0, (post.commentCount||1)-1) });
    toast('Comment deleted');
  }catch(e){ toast('Failed'); }
};

window.toggleLike = async (postId)=>{
  const post = S.community.find(p=>p.id===postId);
  if(!post) return;
  const likedBy = post.likedBy || {};
  const myLike = likedBy[S.user.uid];
  try{
    const updates = {};
    if(myLike){
      updates[`communityPosts/${postId}/likedBy/${S.user.uid}`] = null;
      updates[`communityPosts/${postId}/likes`] = Math.max(0, (post.likes||1)-1);
    } else {
      updates[`communityPosts/${postId}/likedBy/${S.user.uid}`] = true;
      updates[`communityPosts/${postId}/likes`] = (post.likes||0)+1;
      if(post.authorId && post.authorId !== S.user.uid){
        try{
          const notifRef = push(ref(db, `users/${post.authorId}/notifications`));
          await set(notifRef, { type:'community', title:'❤️ New like', text:`${(S.profile.firstName||'')} ${(S.profile.lastName||'')} liked your post`, link:'screen:post-detail/'+postId, createdAt: Date.now(), read: false });
        }catch(e){}
      }
    }
    await update(ref(db), updates);
  }catch(e){ toast('Failed'); }
};

window.sharePost = (postId)=>{
  const post = S.community.find(p=>p.id===postId);
  if(!post) return;
  if(navigator.share){
    navigator.share({title:'AgriCare Post', text: post.body || '', url: window.location.href}).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(window.location.href);
    toast('Link copied');
  }
};

window.useCurrentPostLocation = async ()=>{
  if(!S.userCoords){ toast('Waiting for GPS…'); return; }
  const place = await reverseGeocodePrecise(S.userCoords.lat, S.userCoords.lng);
  const el = document.getElementById('post-location');
  if(el) el.value = place ? place.label : S.userLocation;
  toast('Location added');
};

function wireCreatePost(){
  document.querySelectorAll('#screen-create-post .up-box[data-slot]').forEach(box=>{
    box.addEventListener('click', async(ev)=>{
      if(ev.target.classList.contains('up-del')){
        box.classList.remove('has-img');
        box.querySelector('.up-prev').removeAttribute('src');
        box.dataset.url='';
        ev.stopPropagation();
        return;
      }
      if(box.classList.contains('has-img')) return;
      try{
        const url = await uploadImage('community');
        box.querySelector('.up-prev').src = url;
        box.classList.add('has-img');
        box.dataset.url = url;
      }catch(e){ if(!String(e).includes('cancel')) toast('Upload failed'); }
    });
  });
  const vbox = document.getElementById('post-video-box');
  if(vbox){
    vbox.addEventListener('click', async(ev)=>{
      if(ev.target.classList.contains('up-del')){
        vbox.classList.remove('has-img');
        vbox.querySelector('video').removeAttribute('src');
        vbox.dataset.url='';
        ev.stopPropagation();
        return;
      }
      if(vbox.classList.contains('has-img')) return;
      try{
        const url = await uploadImage('community', 'video');
        const v = vbox.querySelector('video');
        v.src = url;
        vbox.classList.add('has-img');
        vbox.dataset.url = url;
      }catch(e){ if(!String(e).includes('cancel')) toast('Upload failed'); }
    });
  }
}

window.submitPost = async (ev)=>{
  ev.preventDefault();
  const btn = document.getElementById('post-submit');
  btn.disabled = true;
  const body = document.getElementById('post-body').value.trim();
  if(!body){ btn.disabled = false; return; }
  const photos = [];
  document.querySelectorAll('#screen-create-post .up-box[data-slot]').forEach(b=>{ if(b.dataset.url) photos.push(b.dataset.url); });
  const vbox = document.getElementById('post-video-box');
  const videoUrl = vbox?.dataset.url || '';
  const locationLabel = document.getElementById('post-location')?.value.trim() || S.weatherCity || S.userLocation;
  try{
    const newRef = push(ref(db,'communityPosts'));
    const data = {
      authorId: S.user.uid,
      authorName: (S.profile.firstName||'')+' '+(S.profile.lastName||''),
      authorPhoto: S.profile.profileUrl || '',
      body, photoUrls: photos, videoUrl,
      locationLabel,
      lat: S.userCoords?.lat || null,
      lng: S.userCoords?.lng || null,
      likes: 0, likedBy: {}, commentCount: 0,
      visibility: 'public',
      createdAt: Date.now()
    };
    await set(newRef, data);
    // Update last seen for community so we don't self-notify
    S.lastSeen.community = Date.now();
    update(ref(db, `users/${S.user.uid}/lastSeen`), { community: Date.now() }).catch(()=>{});
    toast('Posted ✓');
    setTimeout(()=>navTo('community'), 400);
  }catch(e){ toast('Failed: '+(e.message||e)); btn.disabled=false; }
};

window.addToCart = (id)=>{
  const existing = S.cart.find(c=>c.id===id);
  if(existing) existing.qty++;
  else S.cart.push({id, qty:1});
  updateCartFloat();
  toast('Added to cart');
  const el = document.getElementById('screen-product-detail');
  if(el) el.innerHTML = renderProduct(id);
};
window.buyNow = (id)=>{
  S.cart = [{id, qty:1}];
  updateCartFloat();
  navTo('checkout');
};

  if(!S.userCoords){ toast('Waiting for GPS…'); return; }
  const place = await reverseGeocodePrecise(S.userCoords.lat, S.userCoords.lng);
  const el = document.getElementById('pl-city');
  if(el) el.value = place ? place.label : S.userLocation;

function wirePostReadyGoods(){
  document.querySelectorAll('#screen-post-ready-goods .up-box').forEach(box=>{
    box.addEventListener('click', async(ev)=>{
      if(ev.target.classList.contains('up-del')){
        box.classList.remove('has-img');
        box.querySelector('.up-prev').removeAttribute('src');
        box.dataset.url='';
        ev.stopPropagation();
        return;
      }
      if(box.classList.contains('has-img')) return;
      try{
        const url = await uploadImage('listings');
        box.querySelector('.up-prev').src = url;
        box.classList.add('has-img');
        box.dataset.url = url;
      }catch(e){ if(!String(e).includes('cancel')) toast('Upload failed'); }
    });
  });
}

window.submitListing = async (ev)=>{
  ev.preventDefault();
  const err = document.getElementById('pl-error');
  err.style.display='none';
  const btn = document.getElementById('pl-submit');
  btn.disabled = true;
  const product = document.getElementById('pl-product').value;
  const catItem = S.catalogue.find(c=>c.id===product);
  const title = document.getElementById('pl-title').value.trim();
  const qty = document.getElementById('pl-qty').value;
  const unit = document.getElementById('pl-unit').value;
  const price = document.getElementById('pl-price').value;
  const city = document.getElementById('pl-city').value.trim();
  const target = document.getElementById('pl-target').value;
  const desc = document.getElementById('pl-desc').value.trim();
  const avail = document.getElementById('pl-avail').value;
  const fulfil = document.getElementById('pl-fulfil').value;
  const category = document.getElementById('pl-cat').value;

  if(!product || !title || !qty || !price){
    err.textContent = 'Fill in all required fields.';
    err.style.display='block';
    btn.disabled=false; return;
  }
  const photos = [];
  document.querySelectorAll('#screen-post-ready-goods .up-box').forEach(b=>{ if(b.dataset.url) photos.push(b.dataset.url); });
  try{
    const newRef = push(ref(db,'marketListings'));
    const data = {
      seller_id: S.user.uid,
      sellerName: (S.profile.firstName||'')+' '+(S.profile.lastName||''),
      sellerPhoto: S.profile.profileUrl||'',
      category,
      catalog_item_id: product,
      title,
      productName: catItem?.name || title,
      quantity: qty, unit,
      priceAmount: Number(price), currency: 'ZMW', priceBasis: unit,
      city, targetMarket: target,
      description: desc,
      availability: avail,
      fulfilment: fulfil,
      photoUrls: photos,
      status: 'available',
      createdAt: Date.now(),
      expiresAt: Date.now() + 30*86400000
    };
    await set(newRef, data);
    S.marketplace.unshift({id:newRef.key, ...data});
    S.myListings.unshift({id:newRef.key, ...data});
    // Update last seen for market
    S.lastSeen.market = Date.now();
    update(ref(db, `users/${S.user.uid}/lastSeen`), { market: Date.now() }).catch(()=>{});
    toast('Listing published ✓');
    setTimeout(()=>navTo('marketplace'), 400);
  }catch(e){
    err.textContent = 'Error: '+(e.message||e);
    err.style.display='block';
    btn.disabled=false;
  }
};

const DELIVERY_VEHICLES = {
  bicycle: { id:'bicycle', label:'Bicycle', icon:'🚲', desc:'Light, short distance',
    base: 5, perKm: 4, perMin: 0.3, min: 10 },
  rider:   { id:'rider', label:'Motorbike rider', icon:'🏍️', desc:'Small parcels',
    base: 8, perKm: 6, perMin: 0.5, min: 15 },
  car:     { id:'car', label:'Car', icon:'🚗', desc:'Smaller loads',
    base: 15, perKm: 10, perMin: 1, min: 30 },
  truck:   { id:'truck', label:'Truck', icon:'🚚', desc:'Bulk / livestock',
    base: 30, perKm: 15, perMin: 1.5, min: 60 }
};

function computeDeliveryFare(vehicleId, distanceM, durationS){
  const v = DELIVERY_VEHICLES[vehicleId] || DELIVERY_VEHICLES.rider;
  const km = (distanceM || 0) / 1000;
  const min = (durationS || 0) / 60;
  const subtotal = (v.base || 0) + km * (v.perKm || 0) + min * (v.perMin || 0);
  return Math.round(Math.max(v.min || 0, subtotal));
}

function wireDeliveryHeroMap(){
  setTimeout(()=>{
    const el = document.getElementById('deliveryHeroMap');
    if(!el) return;
    if(S.heroMap){ try{ S.heroMap.remove(); }catch(e){} S.heroMap = null; }
    const coords = S.userCoords || {lat: -15.4167, lng: 28.2833};
    S.heroMap = L.map('deliveryHeroMap', {zoomControl:false, attributionControl:false}).setView([coords.lat, coords.lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, subdomains:'abc'}).addTo(S.heroMap);
    // User marker
    const userIcon = L.divIcon({
      className:'',
      html:'<div style="width:18px;height:18px;border-radius:50%;background:#0f7a34;border:3px solid #fff;box-shadow:0 2px 10px rgba(15,122,52,.5)"></div>',
      iconSize:[18,18], iconAnchor:[9,9]
    });
    L.marker([coords.lat, coords.lng], {icon:userIcon, zIndexOffset:1000}).addTo(S.heroMap);
    // Green circle pulse
    L.circle([coords.lat, coords.lng], {
      radius: 800, color:'#0f7a34', fillColor:'#0f7a34',
      fillOpacity:.08, weight:1.5, opacity:.35
    }).addTo(S.heroMap);
    // Listen for nearby drivers
    const driversGroup = L.layerGroup().addTo(S.heroMap);
    const nearby = ref(db, 'providers');
    const unsub = onValue(nearby, (snap)=>{
      driversGroup.clearLayers();
      const data = snap.val() || {};
      let count = 0;
      Object.entries(data).forEach(([uid, p])=>{
        if(!p || p.online !== true || p.status !== 'approved') return;
        const loc = p.location;
        if(!loc || !isFinite(loc.lat) || !isFinite(loc.lng)) return;
        const d = haversineMeters(coords.lat, coords.lng, loc.lat, loc.lng);
        if(d > 15000) return;
        const icon = L.divIcon({
          className:'',
          html:'<div style="width:22px;height:22px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)">🚗</div>',
          iconSize:[22,22], iconAnchor:[11,11]
        });
        L.marker([loc.lat, loc.lng], {icon, interactive:false}).addTo(driversGroup);
        count++;
      });
      const cd = document.getElementById('deliveryDriverCount');
      const cdt = document.getElementById('deliveryDriverCountText');
      if(count > 0){
        cd?.classList.remove('hidden-count');
        if(cdt) cdt.textContent = count === 1 ? '1 driver nearby' : count + ' drivers nearby';
      } else {
        cd?.classList.add('hidden-count');
      }
    }, ()=>{});
    S.heroDriverListener = unsub;
  }, 100);
}

function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180;
  const dl = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

let delMap = null;
let delPickupMarker = null;
let delDropoffMarker = null;
let delRouteLayer = null;
let delSearchAbort = null;
let delSearchMode = null;
let delPickupLoc = null;
let delDropoffLoc = null;
let delRouteInfo = null;

function wireRequestDelivery(){
  setTimeout(()=>{ initDeliveryMap(); setupDeliverySearch(); }, 250);
}

function initDeliveryMap(){
  const mapEl = document.getElementById('deliveryMap');
  if(!mapEl) return;
  if(delMap){ try{ delMap.remove(); }catch(e){} delMap = null; }
  delMap = L.map('deliveryMap', {zoomControl:false, attributionControl:false}).setView([-15.4167, 28.2833], 12);
  // Green-tinted tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, subdomains:'abc'}).addTo(delMap);
  delMap.on('click', (e)=>{
    if(delSearchMode === 'pickup') setDeliveryPoint('pickup', e.latlng.lat, e.latlng.lng);
    else if(delSearchMode === 'dropoff') setDeliveryPoint('dropoff', e.latlng.lat, e.latlng.lng);
  });
  if(S.userCoords) delMap.setView([S.userCoords.lat, S.userCoords.lng], 14);
  // Restore existing
  if(delPickupLoc) setDeliveryPoint('pickup', delPickupLoc.lat, delPickupLoc.lng, delPickupLoc.label);
  if(delDropoffLoc) setDeliveryPoint('dropoff', delDropoffLoc.lat, delDropoffLoc.lng, delDropoffLoc.label);
  document.getElementById('del-locate-btn')?.addEventListener('click', ()=>{
    if(!S.userCoords) return;
    delMap.setView([S.userCoords.lat, S.userCoords.lng], 16);
  });
  document.getElementById('del-fit-btn')?.addEventListener('click', fitDeliveryRoute);
}

function setupDeliverySearch(){
  const pickupInput = document.getElementById('del-pickup');
  const dropoffInput = document.getElementById('del-dropoff');
  const pickupRow = document.getElementById('del-pickup-row');
  const dropoffRow = document.getElementById('del-dropoff-row');
  const results = document.getElementById('del-search-results');
  if(!pickupInput || !dropoffInput) return;
  const onFocus = (mode)=>{
    delSearchMode = mode;
    pickupRow?.classList.toggle('active', mode === 'pickup');
    dropoffRow?.classList.toggle('active', mode === 'dropoff');
    const badge = document.getElementById('del-map-badge');
    if(badge) badge.innerHTML = `<i>📍</i> Tap map or search to set ${mode === 'pickup' ? 'pickup' : 'drop-off'}`;
  };
  pickupInput.addEventListener('focus', ()=>onFocus('pickup'));
  dropoffInput.addEventListener('focus', ()=>onFocus('dropoff'));
  const debounce = (fn, ms)=>{ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };
  const runSearch = async (q, mode)=>{
    if(!q || q.length < 3){ results.classList.remove('open'); return; }
    if(delSearchAbort) delSearchAbort.abort();
    delSearchAbort = new AbortController();
    try{
      // Restrict to user's city by appending it to query
      let query = q;
      if(S.weatherCity && !q.toLowerCase().includes(S.weatherCity.toLowerCase())){
        query = q + ', ' + S.weatherCity;
      }
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=10&addressdetails=1&accept-language=en&q=${encodeURIComponent(query)}`;
      const r = await fetch(url, {signal: delSearchAbort.signal});
      const arr = await r.json();
      if(!arr.length){ results.classList.remove('open'); return; }
      results.innerHTML = arr.map((p, i)=>{
        const name = p.name || (p.display_name || '').split(',')[0];
        const dist = S.userCoords ? haversineMeters(S.userCoords.lat, S.userCoords.lng, parseFloat(p.lat), parseFloat(p.lon)) : null;
        return `<button type="button" class="map-search-item" data-idx="${i}">
          <span class="ms-ic">📍</span>
          <span class="ms-body">
            <span class="ms-name">${esc(name)}</span>
            <span class="ms-sub">${esc(p.display_name || '')}</span>
          </span>
          ${dist != null ? `<span class="ms-dist">${dist < 1000 ? Math.round(dist)+' m' : (dist/1000).toFixed(1)+' km'}</span>`:''}
        </button>`;
      }).join('');
      results.classList.add('open');
      results.querySelectorAll('.map-search-item').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const p = arr[parseInt(btn.dataset.idx, 10)];
          if(!p) return;
          setDeliveryPoint(mode, parseFloat(p.lat), parseFloat(p.lon), p.display_name);
          results.classList.remove('open');
        });
      });
    }catch(e){ if(e.name !== 'AbortError') console.warn(e); }
  };
  pickupInput.addEventListener('input', debounce(()=>runSearch(pickupInput.value.trim(), 'pickup'), 320));
  dropoffInput.addEventListener('input', debounce(()=>runSearch(dropoffInput.value.trim(), 'dropoff'), 320));
}

async function setDeliveryPoint(mode, lat, lng, label){
  const place = await reverseGeocodePrecise(lat, lng);
  const finalLabel = label || (place ? place.label : `${lat.toFixed(4)}, ${lng.toFixed(4)}`);
  if(mode === 'pickup'){
    delPickupLoc = {lat, lng, label: finalLabel, address: place?.address || finalLabel};
    const el = document.getElementById('del-pickup');
    if(el) el.value = finalLabel;
    if(delPickupMarker && delMap) delMap.removeLayer(delPickupMarker);
    if(delMap){
      delPickupMarker = L.marker([lat, lng], {icon: L.divIcon({
        className:'', html:'<div style="width:18px;height:18px;border-radius:50%;background:#0f7a34;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',
        iconSize:[18,18], iconAnchor:[9,9]
      })}).addTo(delMap);
    }
  } else {
    delDropoffLoc = {lat, lng, label: finalLabel, address: place?.address || finalLabel};
    const el = document.getElementById('del-dropoff');
    if(el) el.value = finalLabel;
    if(delDropoffMarker && delMap) delMap.removeLayer(delDropoffMarker);
    if(delMap){
      delDropoffMarker = L.marker([lat, lng], {icon: L.divIcon({
        className:'', html:'<div style="width:18px;height:18px;background:#2563eb;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);border-radius:50% 50% 50% 0;transform:rotate(-45deg)"></div>',
        iconSize:[18,18], iconAnchor:[9,18]
      })}).addTo(delMap);
    }
  }
  drawDeliveryRoute();
}

window.useCurrentForDelivery = async (mode)=>{
  if(!S.userCoords){
    if(navigator.geolocation){
      toast('Getting your location…');
      navigator.geolocation.getCurrentPosition((pos)=>{
        S.userCoords = {lat: pos.coords.latitude, lng: pos.coords.longitude};
        setDeliveryPoint(mode, S.userCoords.lat, S.userCoords.lng);
      }, ()=>toast('Location unavailable'));
    } else toast('Geolocation not supported');
    return;
  }
  setDeliveryPoint(mode, S.userCoords.lat, S.userCoords.lng);
};

async function drawDeliveryRoute(){
  if(!delMap || !delPickupLoc || !delDropoffLoc) return;
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${delPickupLoc.lng},${delPickupLoc.lat};${delDropoffLoc.lng},${delDropoffLoc.lat}?overview=full&geometries=geojson`;
    const r = await fetch(url);
    const j = await r.json();
    if(!j.routes || !j.routes.length) return;
    delRouteInfo = { distance: j.routes[0].distance, duration: j.routes[0].duration };
    const coords = j.routes[0].geometry.coordinates.map(([lng, lat])=>[lat, lng]);
    if(delRouteLayer) delMap.removeLayer(delRouteLayer);
    delRouteLayer = L.layerGroup().addTo(delMap);
    L.polyline(coords, {color:'#ffffff', weight:8, opacity:.95, lineJoin:'round', lineCap:'round'}).addTo(delRouteLayer);
    L.polyline(coords, {color:'#0f7a34', weight:4.5, opacity:1, lineJoin:'round', lineCap:'round'}).addTo(delRouteLayer);
    const badge = document.getElementById('del-map-badge');
    const distKm = (j.routes[0].distance/1000).toFixed(1);
    const durMin = Math.round(j.routes[0].duration/60);
    if(badge) badge.innerHTML = `<i>🛣️</i> ${distKm} km · ~${durMin} min`;
    delMap.fitBounds(L.latLngBounds(coords), {padding: [30, 30]});
  }catch(e){ console.warn('route', e); }
}

function fitDeliveryRoute(){
  if(!delMap) return;
  const pts = [];
  if(delPickupLoc) pts.push([delPickupLoc.lat, delPickupLoc.lng]);
  if(delDropoffLoc) pts.push([delDropoffLoc.lat, delDropoffLoc.lng]);
  if(pts.length === 2) delMap.fitBounds(L.latLngBounds(pts), {padding: [40, 40]});
}

window.submitDelivery = async (ev)=>{
  ev.preventDefault();
  const err = document.getElementById('del-error');
  err.style.display='none';
  const btn = document.getElementById('del-submit');
  btn.disabled = true;
  if(!delPickupLoc){
    const v = document.getElementById('del-pickup').value.trim();
    if(v){
      try{
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(v)}`;
        const r = await fetch(url); const arr = await r.json();
        if(arr[0]) await setDeliveryPoint('pickup', parseFloat(arr[0].lat), parseFloat(arr[0].lon));
      }catch(e){}
    }
  }
  if(!delDropoffLoc){
    const v = document.getElementById('del-dropoff').value.trim();
    if(v){
      try{
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(v)}`;
        const r = await fetch(url); const arr = await r.json();
        if(arr[0]) await setDeliveryPoint('dropoff', parseFloat(arr[0].lat), parseFloat(arr[0].lon));
      }catch(e){}
    }
  }
  if(!delPickupLoc || !delDropoffLoc){
    err.textContent = 'Please set both pickup and drop-off locations.';
    err.style.display='block';
    btn.disabled=false; return;
  }
  if(!delRouteInfo){
    try{ await drawDeliveryRoute(); }catch(e){}
  }
  if(!delRouteInfo){
    // Fallback: straight line
    const straight = haversineMeters(delPickupLoc.lat, delPickupLoc.lng, delDropoffLoc.lat, delDropoffLoc.lng);
    delRouteInfo = { distance: straight, duration: (straight/1000) / 30 * 3600 };
  }
  const sender = document.getElementById('del-sender').value.trim();
  const senderPhone = document.getElementById('del-sender-phone').value.trim();
  const receiver = document.getElementById('del-receiver').value.trim();
  const receiverPhone = document.getElementById('del-receiver-phone').value.trim();
  const cargo = document.getElementById('del-cargo').value.trim();
  const weight = document.getElementById('del-weight').value;
  const date = document.getElementById('del-date').value;
  const notes = document.getElementById('del-notes').value.trim();
  if(!sender || !senderPhone || !receiver || !receiverPhone || !cargo || !weight){
    err.textContent = 'Please fill in all sender, receiver & goods fields.';
    err.style.display='block';
    btn.disabled=false; return;
  }
  // Show vehicle selection sheet
  showVehicleSheet({
    sender, senderPhone, receiver, receiverPhone, cargo, weight: Number(weight),
    date, notes,
    pickup: delPickupLoc, dropoff: delDropoffLoc,
    distance: delRouteInfo.distance, duration: delRouteInfo.duration
  });
  btn.disabled = false;
};

      receiverName: delData.receiver,
      receiverPhone: delData.receiverPhone,
      cargo: delData.cargo,
      weight: delData.weight,
      vehicleType: vehicleId,
      vehicleLabel: vehicle.label,
      distance: delData.distance,
      duration: delData.duration,
      fare,
      date: delData.date,
      notes: delData.notes,
      status: 'searching',
      createdAt: Date.now()
    });
    await pushNotification({
      type:'delivery',
      title:'🚚 Delivery requested',
      text:`Your delivery (${id}) is searching for a ${vehicle.label.toLowerCase()}.`,
      link:'screen:ongoing-deliveries'
    });
    // Show searching overlay
    $searchingIcon.textContent = vehicle.icon;
    $searchingTitle.textContent = `Searching for a ${vehicle.label}`;
    $searchingSubtitle.textContent = `Looking for a ${vehicle.label.toLowerCase()} near ${delData.pickup.label || 'you'}…`;
    $searchingOverlay.classList.add('open');
    S.delActiveId = id;
    // Save reference
    if(!S.allDeliveries) S.allDeliveries = [];
    S.allDeliveries.unshift({
      id, requester_id: S.user.uid,
      pickup: delData.pickup, dropoff: delData.dropoff,
      pickupLabel: delData.pickup.label, dropoffLabel: delData.dropoff.label,
      cargo: delData.cargo, weight: delData.weight,
      vehicleType: vehicleId, vehicleLabel: vehicle.label,
      distance: delData.distance, duration: delData.duration,
      fare, date: delData.date, notes: delData.notes,
      senderName: delData.sender, senderPhone: delData.senderPhone,
      receiverName: delData.receiver, receiverPhone: delData.receiverPhone,
      status:'searching', createdAt: Date.now()
    });
    // Reset form
    window._pendingDel = null;
    delPickupLoc = null; delDropoffLoc = null; delRouteInfo = null;
    try{
      if(delPickupMarker && delMap) delMap.removeLayer(delPickupMarker);
      if(delDropoffMarker && delMap) delMap.removeLayer(delDropoffMarker);
      if(delRouteLayer) delMap.removeLayer(delRouteLayer);
    }catch(e){}
    // Watch for acceptance
    watchDeliveryAcceptance(id);
    // Navigate to delivery dashboard after a beat
    setTimeout(()=>{ 
      closeSearching();
      navTo('ongoing-deliveries');
    }, 5000);
  }catch(e){
    console.error(e);
    toast('Failed: '+(e.message||e));
  }
};

window.closeSearching = ()=>{ $searchingOverlay.classList.remove('open'); };
window.cancelDeliverySearch = async ()=>{
  closeSearching();
  if(S.delActiveId){
    try{
      await update(ref(db, 'deliveryRequests/'+S.delActiveId), {status:'cancelled', cancelledAt:Date.now()});
      toast('Delivery cancelled');
    }catch(e){}
  }
};

function watchDeliveryAcceptance(id){
  const r = ref(db, 'deliveryRequests/'+id);
  if(S.delActiveUnsub) S.delActiveUnsub();
  S.delActiveUnsub = onValue(r, (snap)=>{
    if(!snap.exists()) return;
    const d = snap.val();
    // Update local cache
    const idx = (S.allDeliveries||[]).findIndex(x=>x.id===id);
    if(idx >= 0){
      S.allDeliveries[idx] = {id, ...d};
    }
    if(d.status === 'accepted' && d.providerName){
      $searchingIcon.textContent = '✅';
      $searchingTitle.textContent = `${d.providerName} accepted!`;
      $searchingSubtitle.textContent = `${d.providerRole || 'Provider'} is on the way to pickup`;
      // Notify
      pushNotification({
        type:'delivery',
        title:'🚚 Delivery accepted',
        text:`${d.providerName} is on the way to ${d.pickupLabel||'pickup'}`,
        link:'screen:ongoing-deliveries'
      });
      setTimeout(()=>{ closeSearching(); navTo('ongoing-deliveries'); }, 1800);
    } else if(d.status === 'in_progress'){
      pushNotification({type:'delivery', title:'📦 Delivery picked up', text:`Your delivery is in progress`, link:'screen:ongoing-deliveries'});
    } else if(d.status === 'delivered' || d.status === 'completed'){
      pushNotification({type:'delivery', title:'✅ Delivery complete', text:`Your delivery has been completed`, link:'screen:delivery-history'});
    } else if(d.status === 'cancelled'){
      pushNotification({type:'delivery', title:'❌ Delivery cancelled', text:`Your delivery was cancelled`, link:'screen:delivery-history'});
    }
    // Update screens
    if(S.screen === 'ongoing-deliveries') route();
    if(S.screen === 'delivery-history') route();
    if(S.screen === 'delivery') route();
  });
}

window.openDeliverySearching = ()=>{

  $searchingIcon.textContent = '🚚';

};

function wireSupplierCheckout(){
  const box = document.getElementById('sc-proof-box');
  if(!box) return;
  box.addEventListener('click', async(ev)=>{
    if(ev.target.classList.contains('up-del')){
      box.classList.remove('has-img');
      box.querySelector('.up-prev').removeAttribute('src');
      document.getElementById('sc-proof-url').value = '';
      ev.stopPropagation();
      return;
    }
    try{
      const url = await uploadImage('payments');
      box.querySelector('.up-prev').src = url;
      box.classList.add('has-img');
      document.getElementById('sc-proof-url').value = url;
    }catch(e){ if(!String(e).includes('cancel')) toast('Upload failed'); }
  });
}
window.submitSupplierOrder = async (ev)=>{
  ev.preventDefault();
  const err = document.getElementById('sc-error');
  err.style.display = 'none';
  const btn = document.getElementById('sc-submit');
  btn.disabled = true;
  const proof = document.getElementById('sc-proof-url').value;
  if(!proof){
    err.textContent = 'Please upload your payment proof.';
    err.style.display = 'block';
    btn.disabled = false;
    return;
  }
  const items = S.cart.map(c=>{
    const p = S.supplierProducts.find(x=>x.id === c.productId);
    return { productId: c.productId, name: p?.name || '', price: Number(p?.price || 0), qty: c.qty, unit: p?.unit || '', supplierId: p?.supplierId || p?.supplier_id || '', supplierName: p?.supplierName || '' };
  });
  const total = items.reduce((s,i)=>s + i.price*i.qty, 0);
  const id = 'SUP-' + Date.now().toString(36).toUpperCase();
  try{
    await set(ref(db, 'supplierOrders/'+id), {
      orderId: id, buyerId: S.user.uid,
      buyerName: document.getElementById('sc-name').value,
      buyerPhone: document.getElementById('sc-phone').value,
      address: document.getElementById('sc-addr').value,
      payment: document.getElementById('sc-pay').value,
      paymentProofUrl: proof,
      items, total,
      status: 'pending_approval',
      createdAt: Date.now()
    });
    const supplierIds = new Set(items.map(i=>i.supplierId).filter(Boolean));
    for(const sid of supplierIds){
      try{
        const nref = push(ref(db, `users/${sid}/notifications`));
        await set(nref, { type:'order', severity:'warn', title:'📦 New order awaiting approval', text:`${document.getElementById('sc-name').value} placed order ${id}. Review payment proof.`, createdAt: Date.now(), read:false });
      }catch(e){}
    }
    S.cart = [];
    updateCartFloat();
    modal(`<h3>Order submitted ✅</h3><p>Reference: <strong>${esc(id)}</strong><br>Your payment proof has been uploaded. The supplier will review and approve your order shortly.</p><button class="btn btn-p" onclick="closeModal();navTo('home')">Back to Home</button>`);
  }catch(e){
    err.textContent = 'Error: ' + (e.message||e);
    err.style.display = 'block';
    btn.disabled = false;
  }
};

  const yearStart = new Date(new Date().getFullYear(), 0, 1).getTime();
  const thisYearActivities = activities.filter(a => (a.planted_date || a.createdAt || 0) >= yearStart);
  const cropCounts = {};
  thisYearActivities.forEach(a=>{
    const name = a.speciesName || a.species_or_crop_id || 'Unknown';
    cropCounts[name] = (cropCounts[name] || 0) + 1;
  });
  const topCrops = Object.entries(cropCounts).sort((a,b)=>b[1]-a[1]).slice(0, 8);
  const maxCropCount = topCrops.length ? topCrops[0][1] : 1;
  const boughtCounts = {};
  listings.forEach(l=>{
    const name = l.productName || l.title || 'Unknown';
    boughtCounts[name] = (boughtCounts[name] || 0) + 1;
  });
  const topBought = Object.entries(boughtCounts).sort((a,b)=>b[1]-a[1]).slice(0, 6);
  const cityCounts = {};
  activities.forEach(a=>{
    const c = a.location || 'Unknown';
    cityCounts[c] = (cityCounts[c] || 0) + 1;
  });
  const topCities = Object.entries(cityCounts).sort((a,b)=>b[1]-a[1]).slice(0, 6);
  const totalActivities = activities.length;
  const totalListings = listings.length;
  const activeCrops = activities.filter(a => a.status === 'active' || a.status === 'ready_for_sale').length;
  const totalFarmers = new Set(activities.map(a => a.owner_user_id)).size;

  const govSites = [
    {name:'Ministry of Agriculture', url:'https://www.agriculture.gov.zm/', desc:'Market bulletins, FISP, e-Voucher, SAFF & policy updates', icon:'🏛️'},
    {name:'ZARI – Research Institute', url:'https://www.zari.gov.zm/', desc:'Crop research, pest & disease diagnostics, seed varieties', icon:'🔬'},
    {name:'ZIAMIS – Farmer Registry', url:'https://www.agriculture.gov.zm/', desc:'Register as a farmer, access inputs & extension services', icon:'📋'},
    {name:'ZamStats – Crop Forecast', url:'http://nada.zamstats.gov.zm/', desc:'National crop production & area planted statistics', icon:'📊'},
    {name:'Mulimi360 e-Extension', url:'https://www.agriculture.gov.zm/', desc:'Real-time early warnings, market prices & advisory services', icon:'📱'},
    {name:'AMIC – Market Info Centre', url:'https://www.agriculture.gov.zm/', desc:'Weekly/monthly commodity price bulletins by district', icon:'💰'},
    {name:'Zambia Drought Monitor', url:'https://www.zamstats.gov.zm/', desc:'Satellite-based drought monitoring & early warning', icon:'🛰️'},
    {name:'FRA – Food Reserve Agency', url:'https://fra.org.zm/', desc:'Crop marketing, floor prices & strategic reserves', icon:'🌾'}
  ];

  return `
  <div class="scroll">
    <div class="topbar bordered">
      <button class="tb-back" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="tb-title">Farm Analysis</div>
    </div>

    <div style="padding:14px 18px 0">
      <p style="font-size:13px;color:var(--tl);font-weight:600;line-height:1.55">Insights based on farmer activities &amp; marketplace data across Zambia.</p>
    </div>

    <div class="rev-grid" style="padding-top:14px">
      <div class="rev-tile dark">
        <div class="rt-l">Total Activities</div>
        <div class="rt-v">${totalActivities}</div>
        <div class="rt-s">${activeCrops} active</div>
      </div>
      <div class="rev-tile">
        <div class="rt-l">Marketplace Listings</div>
        <div class="rt-v">${totalListings}</div>
        <div class="rt-s">products listed</div>
      </div>
      <div class="rev-tile">
        <div class="rt-l">Active Farmers</div>
        <div class="rt-v">${totalFarmers}</div>
        <div class="rt-s">sharing data</div>
      </div>
      <div class="rev-tile">
        <div class="rt-l">Cities Covered</div>
        <div class="rt-v">${Object.keys(cityCounts).length}</div>
        <div class="rt-s">across Zambia</div>
      </div>
    </div>

    <div class="sec-h"><h3>🌱 Most Planted This Year</h3></div>
    <div style="padding:0 18px 18px">
      ${topCrops.length ? topCrops.map(([name, count], i)=>{
        const pct = Math.round((count / maxCropCount) * 100);
        const rankCls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
        return `
          <div class="bar-row">
            <div class="as-rank ${rankCls}">${i+1}</div>
            <div class="br-label">${esc(name)}</div>
            <div class="br-bar"><div class="br-fill" style="width:${pct}%"></div></div>
            <div class="br-val">${count}</div>
          </div>`;
      }).join('') : `
        <div class="empty" style="padding:20px">
          <div class="e-ic">🌱</div>
          <h3>No planting data yet</h3>
          <p>Activities shared by farmers will appear here.</p>
        </div>`}
    </div>

    <div class="sec-h"><h3>🛒 Most Listed on Market</h3></div>
    <div style="padding:0 18px 18px">
      ${topBought.length ? topBought.map(([name, count], i)=>{
        const maxB = topBought[0][1];
        const pct = Math.round((count / maxB) * 100);
        const rankCls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
        return `
          <div class="bar-row">
            <div class="as-rank ${rankCls}">${i+1}</div>
            <div class="br-label">${esc(name)}</div>
            <div class="br-bar"><div class="br-fill" style="width:${pct}%"></div></div>
            <div class="br-val">${count}</div>
          </div>`;
      }).join('') : `
        <div class="empty" style="padding:20px">
          <div class="e-ic">🛒</div>
          <h3>No market data yet</h3>
          <p>Listings from the marketplace will appear here.</p>
        </div>`}
    </div>

    <div class="sec-h"><h3>📍 Farmers by City</h3></div>
    <div style="padding:0 18px 18px">
      ${topCities.length ? topCities.map(([city, count], i)=>{
        const maxC = topCities[0][1];
        const pct = Math.round((count / maxC) * 100);
        return `
          <div class="bar-row">
            <div class="as-rank">${i+1}</div>
            <div class="br-label">${esc(city)}</div>
            <div class="br-bar"><div class="br-fill" style="width:${pct}%"></div></div>
            <div class="br-val">${count}</div>
          </div>`;
      }).join('') : `
        <div class="empty" style="padding:20px">
          <div class="e-ic">📍</div>
          <h3>No city data yet</h3>
          <p>Share your location to see this analysis.</p>
        </div>`}
    </div>

    <div class="sec-h"><h3>🇿🇲 Free Government Resources</h3></div>
    <div style="padding:0 18px 18px">
      ${govSites.map(s=>`
        <a class="gov-site" href="${esc(s.url)}" target="_blank" rel="noopener">
          <div class="gs-ic">${s.icon}</div>
          <div class="gs-body">
            <div class="gs-name">${esc(s.name)}</div>
            <div class="gs-desc">${esc(s.desc)}</div>
          </div>
          <div class="gs-arrow">→</div>
        </a>
      `).join('')}
    </div>
  </div>
  ${bottomNavHTML()}`;
}

window.saveEditListing = async (id)=>{
  const title = document.getElementById('edit-title').value.trim();
  const price = document.getElementById('edit-price').value;
  const qty = document.getElementById('edit-qty').value;
  try{
    await update(ref(db, 'marketListings/'+id), { title, priceAmount: Number(price), quantity: qty, updatedAt: Date.now() });

    await remove(ref(db, 'marketListings/'+id));
    S.myListings = S.myListings.filter(x=>x.id !== id);
    S.marketplace = S.marketplace.filter(x=>x.id !== id);
    closeModal();
    toast('Listing deleted');
    route();
  }catch(e){ toast('Failed'); }
};
window.markListingSold = async (id)=>{
  try{
    await update(ref(db, 'marketListings/'+id), { status:'sold', soldAt: Date.now() });
    const m = S.myListings.find(x=>x.id === id);
    if(m) m.status = 'sold';
    await pushNotification({type:'market', title:'Item marked sold', text:'Your listing is now marked as sold.'});
    toast('Marked as sold ✓');
    route();
  }catch(e){ toast('Failed'); }
};

      </div>

      ${sold.length ? sold.slice(0, 20).map(m=>`
        <div class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
          <div style="width:44px;height:44px;border-radius:8px;background:${gradFor(m.title||'')};display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0">

/* ============================================================
   LOCATION PERMISSION
   ============================================================ */
function showLocationPermissionModal(){
  return new Promise((resolve)=>{
    modal(`
      <div style="text-align:center">
        <div style="font-size:48px;margin-bottom:12px">📍</div>
        <h3>Enable Location</h3>
        <p>AgriCare needs your location to show accurate weather, detect your city, and connect you with nearby farmers and markets.</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
          <button class="btn btn-p" id="loc-allow-btn">Allow Location</button>
          <button class="btn btn-s" id="loc-skip-btn">Not Now</button>
        </div>
      </div>
    `);
    document.getElementById('loc-allow-btn').addEventListener('click', ()=>{
      closeModal();
      resolve(true);
    });
    document.getElementById('loc-skip-btn').addEventListener('click', ()=>{
      closeModal();
      resolve(false);
    });
  });
}

async function detectUserCityAndWeather(forcePrompt){
  if(!S.locationPermissionAsked && !forcePrompt){
    S.locationPermissionAsked = true;
    const allowed = await showLocationPermissionModal();
    if(!allowed){
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if(S.screen === 'home'){
        const el = document.getElementById('screen-home');
        if(el) el.innerHTML = renderHome();
      }
      return;
    }
  }
  if(!navigator.geolocation){
    S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
    S.weatherCity = S.userLocation;
    return;
  }
  return new Promise((resolve)=>{
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      S.userCoords = {lat, lng};
      const place = await reverseGeocodeCity(lat, lng);
      if(place && place.city){
        S.weatherCity = place.city;
        S.userLocation = place.city;
      } else {
        S.weatherCity = S.userLocation;
      }
      S.weather = await loadWeatherByCoords(lat, lng);
      if(S.screen === 'home'){
        const el = document.getElementById('screen-home');
        if(el) el.innerHTML = renderHome();
      }
      resolve();
    }, async (err)=>{
      console.warn('geo', err);
      S.weather = await loadWeatherByCoords(-15.4167, 28.2833);
      S.weatherCity = S.userLocation;
      if(S.screen === 'home'){
        const el = document.getElementById('screen-home');
        if(el) el.innerHTML = renderHome();
      }
      resolve();
    }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 300000});
  });
}

/* ============================================================
   START APP
   ============================================================ */
function renderBanned(reason){
  return `
    <div class="screen-wrap" style="display:flex;align-items:center;justify-content:center">
      <div class="state-screen">
        <div class="st-ic danger">🚫</div>
        <h1>Account Banned</h1>
        <p>${esc(reason||'Your account has been banned. Please contact support.')}</p>
        <button class="btn btn-s" onclick="doLogout()">Sign Out</button>
      </div>
    </div>`;
}
function renderMaintenance(){
  return `
    <div class="screen-wrap" style="display:flex;align-items:center;justify-content:center">
      <div class="state-screen">
        <div class="st-ic warn">🔧</div>
        <h1>Under Maintenance</h1>
        <p>AgriCare is getting an update. Please try again in a few minutes.</p>
      </div>
    </div>`;
}
async function checkSystemState(){
  let maint = false, banned = false, banReason = '';
  try{
    const m = await get(ref(db,'system/maintenance'));
    if(m.exists() && m.val().enabled) maint = true;
  }catch(e){}
  try{
    const u = await get(ref(db,'users/'+S.user.uid));
    if(u.exists()){
      const v = u.val();
      if(v.banned){ banned = true; banReason = v.banReason || 'Contact support'; }
      if(v.role === 'farmer' && v.status === 'banned'){ banned = true; banReason = v.banReason || 'Account banned'; }
    }
  }catch(e){}
  return { maint, banned, banReason };
}

async function startApp(){
  const splash = document.getElementById('splash');
  requestAnimationFrame(()=> splash.classList.add('show'));
  onAuthStateChanged(auth, async (user)=>{
    await new Promise(r=>setTimeout(r, 2600));
    if(!user){ window.location.href = 'index.html'; return; }
    S.user = user;
    const st = await checkSystemState();
    if(st.maint){ document.getElementById('app').innerHTML = renderMaintenance(); return; }
    if(st.banned){ document.getElementById('app').innerHTML = renderBanned(st.banReason); return; }

    const agri = await loadAgriKnowledge();
    S.agri = agri;
    S.catalogue = agri?.catalogue || [];

    const ud = await loadUserData(user.uid);
    S.profile = ud.profile || {};
    S.myActivities = ud.activities || [];
    S.myListings = ud.listings || [];
    S.following = ud.following || {};
    if(S.profile.location) S.userLocation = S.profile.location;
    if(S.profile.city) S.weatherCity = S.profile.city;

    const [acts, mkt, sup] = await Promise.all([loadAllActivities(), loadMarketplace(), loadSuppliers()]);
    S.allActivities = acts; S.marketplace = mkt; S.suppliers = sup;

    // Load deliveries
    loadAllDeliveries();

    startCommunityListener();
    startSupplierProductsListener();
    startNotificationsListener();
    startContentNotificationListeners();
    startFollowingListener();

    const app = document.getElementById('app');
    app.innerHTML = `<div class="screen-wrap"></div>`;
    const wrap = app.querySelector('.screen-wrap');
    const home = document.createElement('div');
    home.className = 'screen'; home.id = 'screen-home';
    wrap.appendChild(home);
    activeScreenEl = home; S.screen = 'home';
    home.classList.add('active');
    route();
    try{ history.replaceState({screen:'home'}, '', '#home'); }catch(e){}

    await detectUserCityAndWeather();
    startWeatherRefresh();
    loadMyDeliveries();
  });
}

function startFollowingListener(){
  if(!S.user) return;
  if(S.followUnsub) S.followUnsub();
  S.followUnsub = onValue(ref(db, `users/${S.user.uid}/following`), (snap)=>{
    const data = snap.val() || {};
    S.following = data;
  });
}

function startWeatherRefresh(){
  clearInterval(S.weatherRefreshTimer);
  S.weatherRefreshTimer = setInterval(async ()=>{
    if(S.userCoords){
      S.weather = await loadWeatherByCoords(S.userCoords.lat, S.userCoords.lng);
      if(S.screen === 'home'){
        const el = document.getElementById('screen-home');
        if(el) el.innerHTML = renderHome();
      }
    }
  }, 30 * 60 * 1000);
}

async function loadMyDeliveries(){
  if(!S.user) return;
  try{
    const snap = await get(ref(db, 'deliveryRequests'));
    if(!snap.exists()) return;
    const data = snap.val();
    const mine = [];
    Object.entries(data).forEach(([id, d])=>{
      if(d.requester_id === S.user.uid) mine.push({id, ...d});
    });
    mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.myDeliveries = mine;
    S.allDeliveries = mine;
    if(S.screen === 'delivery') route();
  }catch(e){}
}

async function loadAllDeliveries(){
  try{
    const snap = await get(ref(db, 'deliveryRequests'));
    if(!snap.exists()) return;
    const data = snap.val();
    const mine = [];
    Object.entries(data).forEach(([id, d])=>{
      if(d.requester_id === S.user.uid) mine.push({id, ...d});
    });
    mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.allDeliveries = mine;
  }catch(e){}
}

startApp();

setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash && splash.parentNode){
    setTimeout(()=>{
      splash.classList.remove('show');
      setTimeout(()=>{ if(splash.parentNode) splash.parentNode.removeChild(splash); }, 1000);
    }, 300);
  }
}, 2700);

window.addEventListener('unhandledrejection', e=>{ console.warn('Unhandled:', e.reason); });

window.startFromCatalogue = (id)=>{
  const item = S.catalogue.find(c=>c.id === id);
  if(!item){ toast('Not found'); return; }
  const catMap = {Crop:'crops','Field Crops':'crops',Pulses:'crops',Vegetables:'crops',Fruits:'crops',Livestock:'livestock',Poultry:'poultry',Aquaculture:'fisheries','Capture fisheries':'fisheries'};
  const cat = catMap[item.enterpriseType] || 'crops';
  navTo('create-activity', {category:cat, speciesId:id});
  setTimeout(()=>{
    const sp = document.getElementById('act-species');
    if(sp) sp.value = id;
    const tt = document.getElementById('act-title');
    if(tt) tt.value = item.name;
  }, 100);
};
window.openCatalogueItem = (id)=>{ navTo('catalogue-detail', {id}); };

/* Cleanup on unload */
window.addEventListener('beforeunload', ()=>{
  S.notifListeners.forEach(u=>{ try{u();}catch(e){} });
  if(S.heroDriverListener){ try{S.heroDriverListener();}catch(e){} }
  if(S.delActiveUnsub){ try{S.delActiveUnsub();}catch(e){} }
  if(S.followUnsub){ try{S.followUnsub();}catch(e){} }
});
